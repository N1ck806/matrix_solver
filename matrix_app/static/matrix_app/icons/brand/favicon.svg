<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="mlFavCore" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </radialGradient>
    <radialGradient id="mlFavHighlight" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mlFavOrbit1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="mlFavOrbit2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="mlFavGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <g transform="translate(16 16)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="14" ry="4" fill="none"
               stroke="url(#mlFavOrbit1)" stroke-width="0.8" opacity="0.7"
               transform="rotate(-20)"/>
      <circle cx="14" cy="0" r="1.6" fill="#FBBF24" filter="url(#mlFavGlow)"/>
      <circle cx="14" cy="0" r="0.8" fill="#FFFFFF"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360" to="0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="15" ry="5" fill="none"
               stroke="url(#mlFavOrbit2)" stroke-width="0.7" opacity="0.55"
               transform="rotate(35)"/>
      <circle cx="15" cy="0" r="1.4" fill="#22D3EE" filter="url(#mlFavGlow)"/>
      <circle cx="15" cy="0" r="0.7" fill="#FFFFFF"/>
    </g>
  </g>

  <circle cx="16" cy="16" r="9" fill="url(#mlFavCore)"/>
  <circle cx="16" cy="16" r="9" fill="url(#mlFavHighlight)"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.6"/>

  <circle cx="12" cy="12" r="0.9" fill="#FFFFFF"/>
  <circle cx="20" cy="12" r="0.9" fill="#FFFFFF"/>
  <circle cx="12" cy="20" r="0.9" fill="#FFFFFF"/>
  <circle cx="20" cy="20" r="0.9" fill="#FFFFFF"/>

  <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.5">
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="16" cy="16" r="1.5" fill="#FFFFFF"/>
</svg>