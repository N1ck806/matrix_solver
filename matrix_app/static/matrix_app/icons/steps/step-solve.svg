<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none"
     role="img" aria-label="Расчёт"
     class="ml-step ml-step--solve"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>

    <!-- ЯДРО: фиолетово-розовое (активная фаза) -->
    <radialGradient id="ss-neon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.2"  stop-color="#F5D0FE" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#D946EF" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#5B21B6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ss-glass" cx="0.4" cy="0.32" r="0.72">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4"  stop-color="#E9D5FF" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#4C1D95" stop-opacity="0.4"/>
    </radialGradient>

    <radialGradient id="ss-fresnel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.93" stop-color="#F5D0FE" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="ss-key" cx="0.28" cy="0.18" r="0.42">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ss-fill" cx="0.75" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#FBCFE8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ss-rim" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ss-bounce" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- ОРБИТЫ -->
    <linearGradient id="ss-orbit-1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#F0ABFC" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#D946EF" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#A21CAF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="ss-orbit-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#0891B2" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="ss-orbit-3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#C4B5FD" stop-opacity="0.7"/>
      <stop offset="1"   stop-color="#7C3AED" stop-opacity="0.85"/>
    </linearGradient>

    <!-- ДУГИ-ВЫЧИСЛЕНИЯ -->
    <linearGradient id="ss-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- ЧАСТИЦЫ -->
    <radialGradient id="ss-spark-white" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#F5D0FE"/>
      <stop offset="1"   stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ss-spark-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ss-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ss-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FDE68A"/>
      <stop offset="1"   stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- ФИЛЬТРЫ -->
    <filter id="ss-bloom-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="ss-bloom-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="ss-bloom-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="ss-shadow-floor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="ss-core-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="ss-core-clip">
      <circle cx="140" cy="140" r="52"/>
    </clipPath>

  </defs>

  <!-- ================================================================
       ФОН: ореол
       ================================================================ -->
  <circle cx="140" cy="140" r="120"
          fill="url(#ss-neon)" opacity="0.12">
    <animate attributeName="r" values="120;128;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================================================
       ТЕНЬ НА ПОЛ
       ================================================================ -->
  <ellipse cx="140" cy="234" rx="72" ry="9"
           fill="#4C1D95" opacity="0.24"
           filter="url(#ss-shadow-floor)">
    <animate attributeName="rx" values="72;80;72" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.24;0.16;0.24" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================================================
       ТРИ ОРБИТЫ: розовая, циановая, фиолетовая
       ================================================================ -->

  <!-- 1. Дальняя фиолетовая (медленная, тусклая) -->
  <g transform="translate(140 138)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="50s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="118" ry="26"
               fill="none" stroke="url(#ss-orbit-3)"
               stroke-width="1.2" opacity="0.55"
               transform="rotate(15)"/>
    </g>
  </g>

  <!-- 2. Средняя циановая (обратное вращение) -->
  <g transform="translate(140 138)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="28s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="104" ry="22"
               fill="none" stroke="url(#ss-orbit-2)"
               stroke-width="1.5" opacity="0.75"
               transform="rotate(-30)"/>
      <ellipse cx="0" cy="0" rx="104" ry="22"
               fill="none" stroke="#22D3EE" stroke-width="4"
               opacity="0.12" filter="url(#ss-bloom-md)"
               transform="rotate(-30)"/>
      <g transform="rotate(-30)">
        <circle cx="-104" cy="0" r="3"
                fill="url(#ss-spark-cyan)" filter="url(#ss-bloom-sm)">
          <animate attributeName="r" values="3;4;3" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-104" cy="0" r="1.4" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- 3. Ближняя розовая (главная, быстрая) -->
  <g transform="translate(140 138)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="92" ry="20"
               fill="none" stroke="url(#ss-orbit-1)"
               stroke-width="1.8" opacity="0.9"
               transform="rotate(28)"/>
      <ellipse cx="0" cy="0" rx="92" ry="20"
               fill="none" stroke="#D946EF" stroke-width="5"
               opacity="0.15" filter="url(#ss-bloom-md)"
               transform="rotate(28)"/>
      <g transform="rotate(28)">
        <circle cx="92" cy="0" r="3.6"
                fill="url(#ss-spark-pink)" filter="url(#ss-bloom-sm)">
          <animate attributeName="r" values="3.6;4.6;3.6" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="92" cy="0" r="1.6" fill="#FFFFFF"/>
      </g>
      <!-- Второй спутник, противоположный -->
      <g transform="rotate(28)">
        <circle cx="-92" cy="0" r="2.6"
                fill="url(#ss-spark-white)" filter="url(#ss-bloom-sm)">
          <animate attributeName="r" values="2.6;3.4;2.6" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-92" cy="0" r="1.2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ================================================================
       ЛУЧ ВХОДА (слева) — наследие от step-input
       ================================================================ -->
  <g opacity="0.75">
    <path d="M18 138 L86 138"
          stroke="#22D3EE" stroke-width="1.4"
          stroke-linecap="round" stroke-dasharray="3 4"
          opacity="0.65"/>
    <circle cx="18" cy="138" r="2.6"
            fill="url(#ss-spark-cyan)" filter="url(#ss-bloom-sm)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="138" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- ================================================================
       ДУГА-ВЫЧИСЛЕНИЕ (вращающиеся сегменты вокруг ядра)
       ================================================================ -->
  <g transform="translate(140 140)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <path d="M-72 0 A72 72 0 0 1 0 -72"
            fill="none" stroke="url(#ss-arc)" stroke-width="2.2"
            stroke-linecap="round"/>
      <path d="M0 72 A72 72 0 0 1 72 0"
            fill="none" stroke="url(#ss-arc)" stroke-width="2.2"
            stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================================================================
       ЯДРО: стеклянная сфера — «процессор»
       ================================================================ -->
  <g filter="url(#ss-core-shadow)">

    <!-- Внешний пульсирующий ореол (сильнее, чем у input) -->
    <circle cx="140" cy="140" r="70"
            fill="url(#ss-neon)" opacity="0.32"
            filter="url(#ss-bloom-lg)">
      <animate attributeName="r" values="70;78;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.32;0.18;0.32" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Стеклянная оболочка -->
    <circle cx="140" cy="140" r="52" fill="url(#ss-glass)"/>
    <circle cx="140" cy="140" r="52" fill="url(#ss-neon)" opacity="0.85"/>
    <circle cx="140" cy="140" r="52" fill="url(#ss-fresnel)"/>

    <!-- Внутренний пульс — «процессор работает» -->
    <circle cx="140" cy="140" r="28"
            fill="url(#ss-neon)" opacity="0.9">
      <animate attributeName="r" values="28;34;28" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="140" r="12" fill="#FFFFFF" opacity="0.95">
      <animate attributeName="r" values="12;14.5;12" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="140" r="5" fill="#FFFFFF"/>

    <!-- ============================================================
         ВНУТРИ: вращающийся крест-процессор
         ============================================================ -->
    <g clip-path="url(#ss-core-clip)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 140 140" to="360 140 140"
                          dur="12s" repeatCount="indefinite"/>
        <path d="M116 140 H164 M140 116 V164"
              stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4"/>
        <circle cx="164" cy="140" r="2.2" fill="#FFFFFF"/>
        <circle cx="116" cy="140" r="2.2" fill="#FFFFFF"/>
        <circle cx="140" cy="164" r="2.2" fill="#FFFFFF"/>
        <circle cx="140" cy="116" r="2.2" fill="#FFFFFF"/>
      </g>

      <!-- Сетка тонкая -->
      <g opacity="0.2">
        <path d="M96 128 H184 M96 140 H184 M96 152 H184"
              stroke="#FFFFFF" stroke-width="0.6"/>
        <path d="M128 96 V184 M140 96 V184 M152 96 V184"
              stroke="#FFFFFF" stroke-width="0.6"/>
      </g>

      <!-- Микро-точки данных, кружатся внутри -->
      <circle cx="128" cy="124" r="1.6" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="156" cy="130" r="1.4" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="148" cy="158" r="1.6" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="124" cy="152" r="1.2" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Key light -->
    <ellipse cx="122" cy="120" rx="18" ry="12"
             fill="url(#ss-key)" transform="rotate(-24 122 120)"/>
    <ellipse cx="118" cy="116" rx="5" ry="3.2"
             fill="#FFFFFF" opacity="0.9"
             transform="rotate(-28 118 116)"/>

    <!-- Fill -->
    <ellipse cx="164" cy="172" rx="22" ry="14"
             fill="url(#ss-fill)" transform="rotate(-20 164 172)"/>

    <!-- Rim: циановая полоса справа -->
    <path d="M188 128 A52 52 0 0 1 170 182"
          fill="none" stroke="url(#ss-rim)" stroke-width="1.8"
          stroke-linecap="round" opacity="0.8"/>

    <!-- Bounce -->
    <ellipse cx="140" cy="186" rx="34" ry="10"
             fill="url(#ss-bounce)"/>

    <circle cx="140" cy="140" r="52" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8"/>
  </g>

  <!-- ================================================================
       ЧАСТИЦЫ
       ================================================================ -->
  <circle cx="38" cy="46" r="2" fill="url(#ss-spark-cyan)" filter="url(#ss-bloom-sm)">
    <animate attributeName="opacity" values="1;0.35;1" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="244" cy="42" r="2.2" fill="url(#ss-spark-pink)" filter="url(#ss-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.25;0.9" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="238" r="1.8" fill="url(#ss-spark-warm)" filter="url(#ss-bloom-sm)">
    <animate attributeName="cy" values="238;230;238" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="246" cy="232" r="2.4" fill="url(#ss-spark-white)" filter="url(#ss-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="22" r="1.6" fill="url(#ss-spark-white)" filter="url(#ss-bloom-sm)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="258" r="1.8" fill="url(#ss-spark-pink)" filter="url(#ss-bloom-sm)">
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="5.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

</svg>