<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none"
     role="img" aria-label="Готовый ответ"
     class="ml-step ml-step--result"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>

    <!-- ЯДРО: изумрудно-зелёное -->
    <radialGradient id="sr-neon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.2"  stop-color="#A7F3D0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#34D399" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#064E3B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sr-glass" cx="0.4" cy="0.32" r="0.72">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4"  stop-color="#D1FAE5" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#064E3B" stop-opacity="0.4"/>
    </radialGradient>

    <radialGradient id="sr-fresnel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.93" stop-color="#A7F3D0" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="sr-key" cx="0.28" cy="0.18" r="0.42">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sr-fill" cx="0.75" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sr-rim" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#FBBF24" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#FBBF24" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#FCD34D" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sr-bounce" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- ОРБИТА -->
    <linearGradient id="sr-orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#A7F3D0" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#047857" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="sr-orbit-2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#FCD34D" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#F59E0B" stop-opacity="0.75"/>
    </linearGradient>

    <!-- КАРТОЧКА-ОТВЕТ -->
    <linearGradient id="sr-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0.85"/>
    </linearGradient>

    <!-- ЛУЧ ВЫХОДА (широкий финальный) -->
    <linearGradient id="sr-out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#FCD34D" stop-opacity="0.7"/>
    </linearGradient>

    <!-- ЧАСТИЦЫ -->
    <radialGradient id="sr-spark-white" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A7F3D0"/>
      <stop offset="1"   stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sr-spark-mint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#6EE7B7"/>
      <stop offset="1"   stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sr-spark-gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FDE68A"/>
      <stop offset="1"   stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sr-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- ФИЛЬТРЫ -->
    <filter id="sr-bloom-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="sr-bloom-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="sr-bloom-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="sr-shadow-floor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="sr-core-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="sr-core-clip">
      <circle cx="140" cy="140" r="52"/>
    </clipPath>

  </defs>

  <!-- ================================================================
       ФОН: ореол (чуть ярче — финал)
       ================================================================ -->
  <circle cx="140" cy="140" r="120"
          fill="url(#sr-neon)" opacity="0.14">
    <animate attributeName="r" values="120;128;120" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================================================
       ТЕНЬ НА ПОЛ (мягкая, «уверенная»)
       ================================================================ -->
  <ellipse cx="140" cy="234" rx="76" ry="10"
           fill="#064E3B" opacity="0.24"
           filter="url(#sr-shadow-floor)">
    <animate attributeName="rx" values="76;82;76" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================================================
       ОДНА ШИРОКАЯ ОРБИТА — спокойное вращение
       ================================================================ -->
  <g transform="translate(140 138)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="44s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="116" ry="26"
               fill="none" stroke="url(#sr-orbit)"
               stroke-width="1.8" opacity="0.85"
               transform="rotate(-22)"/>
      <ellipse cx="0" cy="0" rx="116" ry="26"
               fill="none" stroke="#34D399" stroke-width="5"
               opacity="0.14" filter="url(#sr-bloom-md)"
               transform="rotate(-22)"/>
      <g transform="rotate(-22)">
        <circle cx="116" cy="0" r="3.6"
                fill="url(#sr-spark-mint)" filter="url(#sr-bloom-sm)">
          <animate attributeName="r" values="3.6;4.6;3.6" dur="3s" repeatCount="indefinite"/>
        </circle>
        <circle cx="116" cy="0" r="1.6" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Тонкая золотая орбита (акцент финала) -->
  <g transform="translate(140 138)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="56s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="96" ry="20"
               fill="none" stroke="url(#sr-orbit-2)"
               stroke-width="0.9" opacity="0.6"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-96" cy="0" r="2.4"
                fill="url(#sr-spark-gold)" filter="url(#sr-bloom-sm)">
          <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-96" cy="0" r="1.1" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ================================================================
       ЛУЧ ВХОДА (слева, от explain)
       ================================================================ -->
  <g opacity="0.75">
    <path d="M18 138 L86 138"
          stroke="#22D3EE" stroke-width="1.4"
          stroke-linecap="round" stroke-dasharray="3 4"
          opacity="0.55"/>
    <circle cx="18" cy="138" r="2.6"
            fill="url(#sr-spark-white)" filter="url(#sr-bloom-sm)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="138" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- ================================================================
       ЛУЧ ВЫХОДА (справа, финальный, широкий)
       ================================================================ -->
  <g>
    <path d="M194 138 L272 138"
          stroke="url(#sr-out)" stroke-width="2.4"
          stroke-linecap="round" opacity="0.9"/>
    <circle cx="272" cy="138" r="3.6"
            fill="url(#sr-spark-gold)" filter="url(#sr-bloom-md)">
      <animate attributeName="r" values="3.6;5;3.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="138" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- ================================================================
       ЯДРО: стеклянная сфера с одной крупной матрицей-ответом
       ================================================================ -->
  <g filter="url(#sr-core-shadow)">

    <!-- Ореол (ярче — финал) -->
    <circle cx="140" cy="140" r="72"
            fill="url(#sr-neon)" opacity="0.35"
            filter="url(#sr-bloom-lg)">
      <animate attributeName="r" values="72;78;72" dur="5.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="140" cy="140" r="52" fill="url(#sr-glass)"/>
    <circle cx="140" cy="140" r="52" fill="url(#sr-neon)" opacity="0.85"/>
    <circle cx="140" cy="140" r="52" fill="url(#sr-fresnel)"/>

    <!-- Внутренний пульс -->
    <circle cx="140" cy="140" r="26"
            fill="url(#sr-neon)" opacity="0.9">
      <animate attributeName="r" values="26;30;26" dur="4.4s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================================================
         КАРТОЧКА-ОТВЕТ (одна, крупная)
         ============================================================ -->
    <g clip-path="url(#sr-core-clip)">

      <!-- Тень карточки -->
      <rect x="106" y="118" width="72" height="48" rx="10"
            fill="#064E3B" opacity="0.25"
            transform="translate(0 2)"/>

      <!-- Карточка -->
      <rect x="106" y="116" width="72" height="48" rx="10"
            fill="url(#sr-card)"
            stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="1.1"/>

      <!-- 2×2 ячейки матрицы-ответа -->
      <rect x="114" y="126" width="12" height="12" rx="3"
            fill="#FFFFFF" fill-opacity="0.9"
            stroke="#047857" stroke-opacity="0.7" stroke-width="0.7"/>
      <rect x="130" y="126" width="12" height="12" rx="3"
            fill="#FFFFFF" fill-opacity="0.9"
            stroke="#047857" stroke-opacity="0.7" stroke-width="0.7"/>
      <rect x="114" y="142" width="12" height="12" rx="3"
            fill="#FFFFFF" fill-opacity="0.9"
            stroke="#047857" stroke-opacity="0.7" stroke-width="0.7"/>
      <rect x="130" y="142" width="12" height="12" rx="3"
            fill="#FFFFFF" fill-opacity="0.9"
            stroke="#047857" stroke-opacity="0.7" stroke-width="0.7"/>

      <!-- Точки в ячейках (данные) -->
      <circle cx="120" cy="132" r="2" fill="#047857"/>
      <circle cx="136" cy="132" r="2" fill="#047857"/>
      <circle cx="120" cy="148" r="2" fill="#047857"/>
      <circle cx="136" cy="148" r="2" fill="#047857"/>

      <!-- ГАЛОЧКА (успех) в правом нижнем углу карточки -->
      <circle cx="166" cy="152" r="11" fill="#10B981" opacity="0.95"/>
      <circle cx="166" cy="152" r="11" fill="none"
              stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2"/>
      <path d="M160.5 152 L164.5 156 L171.5 148.5"
            stroke="#FFFFFF" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Микро-блик на карточке -->
      <path d="M108 118 H180"
            stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.7"/>
    </g>

    <!-- Key light -->
    <ellipse cx="120" cy="120" rx="18" ry="12"
             fill="url(#sr-key)" transform="rotate(-24 120 120)"/>
    <ellipse cx="116" cy="116" rx="5" ry="3.2"
             fill="#FFFFFF" opacity="0.9"
             transform="rotate(-28 116 116)"/>

    <!-- Fill -->
    <ellipse cx="164" cy="172" rx="22" ry="14"
             fill="url(#sr-fill)" transform="rotate(-20 164 172)"/>

    <!-- Rim: золотая полоса справа (акцент финала) -->
    <path d="M188 128 A52 52 0 0 1 170 182"
          fill="none" stroke="url(#sr-rim)" stroke-width="2"
          stroke-linecap="round" opacity="0.85"/>

    <!-- Bounce -->
    <ellipse cx="140" cy="186" rx="34" ry="10"
             fill="url(#sr-bounce)"/>

    <circle cx="140" cy="140" r="52" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="0.8"/>
  </g>

  <!-- ================================================================
       ЧАСТИЦЫ (праздничные, но сдержанные)
       ================================================================ -->
  <circle cx="38" cy="46" r="2" fill="url(#sr-spark-mint)" filter="url(#sr-bloom-sm)">
    <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="244" cy="44" r="2.2" fill="url(#sr-spark-gold)" filter="url(#sr-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="238" r="1.8" fill="url(#sr-spark-pink)" filter="url(#sr-bloom-sm)">
    <animate attributeName="cy" values="238;232;238" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="246" cy="234" r="2.4" fill="url(#sr-spark-mint)" filter="url(#sr-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="5.6s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="20" r="2" fill="url(#sr-spark-gold)" filter="url(#sr-bloom-sm)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="260" r="2" fill="url(#sr-spark-white)" filter="url(#sr-bloom-sm)">
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="5.2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

</svg>