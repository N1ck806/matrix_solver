<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Собственные значения и направления">
    <defs>
        <linearGradient id="ed-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#EC4899" stop-opacity="0.06"/>
        </linearGradient>
        <radialGradient id="ed-glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(400 320) scale(160)">
            <stop stop-color="#8B5CF6" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ed-v1" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <linearGradient id="ed-v2" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
        <filter id="ed-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="ed-arrow1" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/>
        </marker>
        <marker id="ed-arrow2" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
        </marker>
    </defs>

    <rect width="800" height="600" fill="url(#ed-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="40" width="440" height="60" rx="30"
          fill="#8B5CF6" fill-opacity="0.12"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="78" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24" font-weight="800" fill="#7C3AED">
        Собственные направления
    </text>

    <!-- Оси координат -->
    <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4">
        <line x1="120" y1="320" x2="680" y2="320"/>
        <line x1="400" y1="140" x2="400" y2="500"/>
    </g>

    <!-- Свечение -->
    <circle cx="400" cy="320" r="160" fill="url(#ed-glow1)"/>

    <!-- Эллипс, показывающий деформацию -->
    <ellipse cx="400" cy="320" rx="200" ry="90"
             transform="rotate(-30 400 320)"
             fill="none" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.5"
             stroke-dasharray="8 6">
        <animate attributeName="stroke-dashoffset" values="0;28" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Собственный вектор 1 — длинный -->
    <line x1="400" y1="320" x2="640" y2="180"
          stroke="url(#ed-v1)" stroke-width="4" stroke-linecap="round"
          marker-end="url(#ed-arrow1)" filter="url(#ed-glow)"/>
    <text x="650" y="175" font-family="system-ui, sans-serif"
          font-size="16" font-weight="800" fill="#8B5CF6">v₁</text>
    <text x="650" y="195" font-family="system-ui, sans-serif"
          font-size="12" fill="#EC4899">λ₁ = 2.5</text>

    <!-- Собственный вектор 2 — короткий -->
    <line x1="400" y1="320" x2="500" y2="470"
          stroke="url(#ed-v2)" stroke-width="4" stroke-linecap="round"
          marker-end="url(#ed-arrow2)" filter="url(#ed-glow)"/>
    <text x="510" y="485" font-family="system-ui, sans-serif"
          font-size="16" font-weight="800" fill="#0891B2">v₂</text>
    <text x="510" y="505" font-family="system-ui, sans-serif"
          font-size="12" fill="#10B981">λ₂ = 0.8</text>

    <!-- Точки на векторах (пульсация) -->
    <circle cx="520" cy="250" r="6" fill="#EC4899" filter="url(#ed-glow)">
        <animate attributeName="r" values="6;9;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="395" r="5" fill="#10B981" filter="url(#ed-glow)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Центр -->
    <circle cx="400" cy="320" r="8" fill="#7C3AED" filter="url(#ed-glow)"/>
    <circle cx="400" cy="320" r="4" fill="#FFFFFF"/>

    <!-- Формула -->
    <rect x="60" y="530" width="320" height="50" rx="12"
          fill="#FFFFFF" fill-opacity="0.9"
          stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="220" y="562" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="16" font-weight="800" fill="#7C3AED">
        A · v = λ · v
    </text>

    <!-- Пояснение -->
    <rect x="420" y="530" width="320" height="50" rx="12"
          fill="#0891B2" fill-opacity="0.1"
          stroke="#0891B2" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="580" y="562" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#0E7490">
        λ — растяжение, v — направление
    </text>
</svg>