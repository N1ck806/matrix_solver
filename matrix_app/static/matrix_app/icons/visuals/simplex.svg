<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Симплекс-метод: оптимизация на многограннике">
    <defs>
        <linearGradient id="sx-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#10B981" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="sx-region" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#8B5CF6" stop-opacity="0.25"/>
            <stop offset="1" stop-color="#10B981" stop-opacity="0.25"/>
        </linearGradient>
        <linearGradient id="sx-axis" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
        <filter id="sx-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="sx-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="url(#sx-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        Симплекс-метод: max cᵀx при Ax ≤ b
    </text>

    <!-- ЛЕВАЯ ЧАСТЬ: допустимая область -->
    <g transform="translate(30, 100)">

        <rect x="0" y="0" width="420" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="210" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">ДОПУСТИМАЯ ОБЛАСТЬ</text>

        <!-- График -->
        <g transform="translate(60, 50)">

            <!-- Оси -->
            <g stroke="#94A3B8" stroke-width="1.2">
                <line x1="0" y1="280" x2="310" y2="280"/>
                <line x1="0" y1="280" x2="0" y2="0"/>
            </g>
            <text x="318" y="285" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#6B7280">x₁</text>
            <text x="-10" y="-4" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#6B7280">x₂</text>

            <!-- Сетка -->
            <g stroke="#E5E7EB" stroke-width="0.8" opacity="0.5">
                <line x1="0" y1="220" x2="310" y2="220"/>
                <line x1="0" y1="160" x2="310" y2="160"/>
                <line x1="0" y1="100" x2="310" y2="100"/>
                <line x1="0" y1="40"  x2="310" y2="40"/>
                <line x1="60"  y1="0" x2="60"  y2="280"/>
                <line x1="120" y1="0" x2="120" y2="280"/>
                <line x1="180" y1="0" x2="180" y2="280"/>
                <line x1="240" y1="0" x2="240" y2="280"/>
            </g>

            <!-- Допустимая область (многоугольник) -->
            <polygon points="0,280 0,60 80,40 180,120 240,220 200,280"
                     fill="url(#sx-region)" stroke="#7C3AED" stroke-width="2"/>

            <!-- Вершины многогранника -->
            <g filter="url(#sx-glow)">
                <circle cx="0"   cy="280" r="6" fill="#7C3AED"/>
                <circle cx="0"   cy="60"  r="6" fill="#8B5CF6"/>
                <circle cx="80"  cy="40"  r="6" fill="#8B5CF6"/>
                <circle cx="180" cy="120" r="6" fill="#8B5CF6"/>
                <circle cx="240" cy="220" r="6" fill="#8B5CF6"/>
                <circle cx="200" cy="280" r="6" fill="#7C3AED"/>
            </g>

            <!-- Целевая функция — стрелка оптимизации -->
            <line x1="120" y1="200" x2="200" y2="60"
                  stroke="url(#sx-axis)" stroke-width="2.5"
                  stroke-linecap="round" marker-end="url(#sx-arrow)"
                  stroke-dasharray="6 3"/>
            <text x="210" y="55" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#10B981">c</text>

            <!-- Оптимум (одна из вершин) -->
            <circle cx="80" cy="40" r="11" fill="none" stroke="#10B981" stroke-width="2.5"
                    filter="url(#sx-glow)"/>
            <circle cx="80" cy="40" r="5" fill="#10B981"/>
            <text x="90" y="32" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#059669">оптимум</text>

            <!-- Итерации симплекса -->
            <g stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6">
                <line x1="0" y1="60" x2="80" y2="40"/>
                <line x1="80" y1="40" x2="180" y2="120"/>
            </g>
            <g fill="#EC4899" opacity="0.7">
                <circle cx="0" cy="60" r="3"/>
                <circle cx="80" cy="40" r="3"/>
            </g>
        </g>

        <!-- Легенда -->
        <g transform="translate(40, 348)" font-family="system-ui, sans-serif"
           font-size="10.5" fill="#6B7280">
            <circle cx="6" cy="-3" r="5" fill="#8B5CF6"/>
            <text x="18" y="0">вершина многогранника</text>
            <circle cx="180" cy="-3" r="6" fill="none" stroke="#10B981" stroke-width="2"/>
            <text x="196" y="0">оптимум</text>
            <line x1="280" y1="-3" x2="306" y2="-3"
                  stroke="#EC4899" stroke-width="1.5" stroke-dasharray="3 3"/>
            <text x="314" y="0">путь симплекса</text>
        </g>
    </g>

    <!-- СТРЕЛКА → -->
    <g transform="translate(465, 290)">
        <line x1="0" y1="0" x2="28" y2="0"
              stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,-6 42,0 28,6" fill="#7C3AED"/>
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: матричная форма -->
    <g transform="translate(520, 100)">

        <rect x="0" y="0" width="250" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="125" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">МАТРИЧНАЯ ФОРМА</text>

        <!-- Целевая функция -->
        <g transform="translate(20, 50)">
            <text x="105" y="0" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#059669"
                  letter-spacing="0.8">МАКСИМИЗИРОВАТЬ</text>

            <rect x="0" y="10" width="210" height="40" rx="8"
                  fill="#10B981" fill-opacity="0.10"
                  stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="105" y="36" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="15" font-weight="800" fill="#059669">
                cᵀ · x
            </text>
        </g>

        <!-- Ограничения -->
        <g transform="translate(20, 110)">
            <text x="105" y="0" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#0891B2"
                  letter-spacing="0.8">ПРИ ОГРАНИЧЕНИЯХ</text>

            <rect x="0" y="10" width="210" height="40" rx="8"
                  fill="#06B6D4" fill-opacity="0.10"
                  stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="105" y="36" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="15" font-weight="800" fill="#0891B2">
                A · x ≤ b
            </text>
        </g>

        <!-- Неотрицательность -->
        <g transform="translate(20, 170)">
            <rect x="0" y="0" width="210" height="36" rx="8"
                  fill="#7C3AED" fill-opacity="0.08"
                  stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="105" y="24" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="14" font-weight="800" fill="#7C3AED">
                x ≥ 0
            </text>
        </g>

        <!-- Разделитель -->
        <line x1="20" y1="228" x2="230" y2="228"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1"
              stroke-dasharray="3 3"/>

        <!-- Что означает -->
        <text x="125" y="252" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="0.8">СМЫСЛ</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <g transform="translate(20, 270)">
                <text x="0" y="0" font-family="ui-monospace, monospace"
                      font-size="12" font-weight="800" fill="#059669">c</text>
                <text x="18" y="0">— коэффициенты прибыли</text>
            </g>
            <g transform="translate(20, 290)">
                <text x="0" y="0" font-family="ui-monospace, monospace"
                      font-size="12" font-weight="800" fill="#0891B2">A</text>
                <text x="18" y="0">— матрица ресурсов</text>
            </g>
            <g transform="translate(20, 310)">
                <text x="0" y="0" font-family="ui-monospace, monospace"
                      font-size="12" font-weight="800" fill="#7C3AED">x</text>
                <text x="18" y="0">— объёмы производства</text>
            </g>
            <g transform="translate(20, 330)">
                <text x="0" y="0" font-family="ui-monospace, monospace"
                      font-size="12" font-weight="800" fill="#BE185D">b</text>
                <text x="18" y="0">— запасы ресурсов</text>
            </g>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 500)">
        <rect x="0" y="0" width="740" height="40" rx="12"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="370" y="26" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            Симплекс-метод: оптимум всегда в вершине многогранника допустимой области. Алгоритм перебирает вершины, улучшая целевую функцию.
        </text>
    </g>
</svg>