<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Поворот точки вокруг оси Z на угол θ">
    <defs>
        <linearGradient id="r3-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.07"/>
            <stop offset="0.5" stop-color="#8B5CF6" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#22D3EE" stop-opacity="0.07"/>
        </linearGradient>
        <radialGradient id="r3-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(400 340) scale(240)">
            <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="r3-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(40)">
            <stop stop-color="#DDD6FE"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </radialGradient>
        <radialGradient id="r3-point" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(12)">
            <stop stop-color="#FBCFE8"/>
            <stop offset="0.6" stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </radialGradient>
        <radialGradient id="r3-point0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(10)">
            <stop stop-color="#A7F3D0"/>
            <stop offset="0.6" stop-color="#10B981"/>
            <stop offset="1" stop-color="#047857"/>
        </radialGradient>

        <linearGradient id="r3-axis-z" x1="0" y1="1" x2="0" y2="0">
            <stop stop-color="#06B6D4" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="r3-axis-x" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#EC4899" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <linearGradient id="r3-axis-y" x1="1" y1="0" x2="0" y2="1">
            <stop stop-color="#10B981" stop-opacity="0.3"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>

        <filter id="r3-glowf" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="r3-glow-strong" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>

        <marker id="r3-arrow-x" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#EC4899"/>
        </marker>
        <marker id="r3-arrow-y" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
        </marker>
        <marker id="r3-arrow-z" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
        </marker>

        <!-- ЕДИНЫЙ ПУТЬ ОРБИТЫ: эллипс rx=220 ry=110, центр (400,340) -->
        <path id="r3-orbit"
              d="M 620 340
                 A 220 110 0 0 1 510 435
                 A 220 110 0 0 1 290 435
                 A 220 110 0 0 1 180 340
                 A 220 110 0 0 1 290 245
                 A 220 110 0 0 1 510 245
                 A 220 110 0 0 1 620 340 Z"
              fill="none"/>
    </defs>

    <rect width="800" height="600" fill="url(#r3-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="28" width="440" height="58" rx="29"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="400" y="66" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#7C3AED">
        Поворот вокруг оси Z на угол θ
    </text>

    <!-- Свечение -->
    <circle cx="400" cy="340" r="240" fill="url(#r3-glow)"/>

    <!-- ОСИ (короче, чтобы не уходить за края) -->
    <g stroke-linecap="round" stroke-width="2.5">
        <line x1="400" y1="340" x2="400" y2="130"
              stroke="url(#r3-axis-z)" marker-end="url(#r3-arrow-z)"/>
        <text x="408" y="122" font-family="system-ui, sans-serif"
              font-size="16" font-weight="800" fill="#06B6D4">Z</text>

        <line x1="400" y1="340" x2="620" y2="465"
              stroke="url(#r3-axis-x)" marker-end="url(#r3-arrow-x)"/>
        <text x="632" y="479" font-family="system-ui, sans-serif"
              font-size="16" font-weight="800" fill="#EC4899">X</text>

        <line x1="400" y1="340" x2="180" y2="465"
              stroke="url(#r3-axis-y)" marker-end="url(#r3-arrow-y)"/>
        <text x="158" y="479" font-family="system-ui, sans-serif"
              font-size="16" font-weight="800" fill="#10B981">Y</text>
    </g>

    <!-- ВИДИМАЯ ОРБИТА -->
    <use href="#r3-orbit"
         stroke="#A78BFA" stroke-opacity="0.5" stroke-width="1.6"
         stroke-dasharray="8 8">
        <animate attributeName="stroke-dashoffset" values="0;32" dur="3s" repeatCount="indefinite"/>
    </use>

    <!-- НУЛЕВОЕ ПОЛОЖЕНИЕ P₀ (зелёная точка, статичная) -->
    <line x1="400" y1="340" x2="620" y2="340"
          stroke="#10B981" stroke-width="1.6" stroke-opacity="0.5"
          stroke-dasharray="4 4"/>
    <circle cx="620" cy="340" r="7" fill="url(#r3-point0)" filter="url(#r3-glowf)"/>
    <text x="640" y="336" font-family="system-ui, sans-serif"
          font-size="13" font-weight="800" fill="#10B981">P₀</text>
    <text x="640" y="354" font-family="system-ui, sans-serif"
          font-size="10" fill="#6B7280">θ = 0°</text>

    <!-- ДВИЖУЩАЯСЯ ТОЧКА P по орбите -->
    <circle r="10" fill="url(#r3-point)" filter="url(#r3-glow-strong)">
        <animateMotion dur="10s" repeatCount="indefinite" rotate="auto">
            <mpath href="#r3-orbit"/>
        </animateMotion>
    </circle>

    <!-- ШЛЕЙФ — 3 искры -->
    <circle r="6" fill="#F472B6" opacity="0.5" filter="url(#r3-glowf)">
        <animateMotion dur="10s" begin="-0.35s" repeatCount="indefinite">
            <mpath href="#r3-orbit"/>
        </animateMotion>
    </circle>
    <circle r="4" fill="#FBCFE8" opacity="0.4">
        <animateMotion dur="10s" begin="-0.7s" repeatCount="indefinite">
            <mpath href="#r3-orbit"/>
        </animateMotion>
    </circle>
    <circle r="2.5" fill="#FCE7F3" opacity="0.3">
        <animateMotion dur="10s" begin="-1.05s" repeatCount="indefinite">
            <mpath href="#r3-orbit"/>
        </animateMotion>
    </circle>

    <!-- ЦЕНТР -->
    <circle cx="400" cy="340" r="7" fill="url(#r3-core)" filter="url(#r3-glowf)"/>
    <circle cx="400" cy="340" r="3" fill="#FFFFFF"/>

    <!-- МИНИ-БЛОК УГЛА: круг 2D, две стрелки, дуга θ -->
    <g transform="translate(50, 430)">
        <rect x="0" y="0" width="180" height="150" rx="14"
              fill="#FFFFFF" fill-opacity="0.95"
              stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>

        <text x="90" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#047857"
              letter-spacing="1.2">УГОЛ θ</text>

        <!-- Центр мини-круга -->
        <circle cx="90" cy="90" r="3" fill="#7C3AED"/>

        <!-- Ось X (базовая) -->
        <line x1="90" y1="90" x2="160" y2="90"
              stroke="#10B981" stroke-width="2"
              stroke-linecap="round"/>
        <circle cx="160" cy="90" r="4" fill="#10B981"/>

        <!-- Вектор под углом 45° -->
        <line x1="90" y1="90" x2="140" y2="40"
              stroke="#EC4899" stroke-width="2"
              stroke-linecap="round"/>
        <circle cx="140" cy="40" r="4" fill="#EC4899"/>

        <!-- Дуга θ -->
        <path d="M 130 90 A 40 40 0 0 0 118 62"
              fill="none" stroke="#7C3AED" stroke-width="1.8"
              stroke-linecap="round"/>
        <text x="128" y="70" font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#7C3AED">θ</text>

        <!-- Подписи -->
        <text x="155" y="108" font-family="system-ui, sans-serif"
              font-size="10" font-weight="700" fill="#10B981">P₀</text>
        <text x="140" y="32" font-family="system-ui, sans-serif"
              font-size="10" font-weight="700" fill="#EC4899">P</text>

        <text x="90" y="140" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            угол между OP₀ и OP
        </text>
    </g>

    <!-- МАТРИЦА R_z(θ) -->
    <g transform="translate(560, 430)">
        <rect x="0" y="0" width="210" height="150" rx="14"
              fill="#FFFFFF" fill-opacity="0.95"
              stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"
              filter="url(#r3-glowf)"/>

        <text x="105" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1.2">R_z(θ) — 3 × 3</text>

        <path d="M 30 44 L 24 44 L 24 140 L 30 140"
              stroke="#8B5CF6" stroke-width="2" fill="none"/>
        <path d="M 180 44 L 186 44 L 186 140 L 180 140"
              stroke="#8B5CF6" stroke-width="2" fill="none"/>

        <text x="50"  y="68" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#7C3AED">cos θ</text>
        <text x="108" y="68" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#EC4899">−sin θ</text>
        <text x="162" y="68" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#6B7280">0</text>

        <text x="50"  y="98" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#10B981">sin θ</text>
        <text x="108" y="98" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#7C3AED">cos θ</text>
        <text x="162" y="98" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#6B7280">0</text>

        <text x="50"  y="128" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#6B7280">0</text>
        <text x="108" y="128" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#6B7280">0</text>
        <text x="162" y="128" font-family="ui-monospace, monospace"
              font-size="13" font-weight="700" fill="#7C3AED">1</text>
    </g>

    <!-- ФОРМУЛА 2D-ПОВОРОТА (по центру внизу) -->
    <g transform="translate(270, 460)">
        <rect x="0" y="0" width="260" height="120" rx="14"
              fill="#FFFFFF" fill-opacity="0.95"
              stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.5"/>

        <text x="130" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="1.2">2D-ПОВОРОТ</text>

        <path d="M 68 42 L 62 42 L 62 82 L 68 82"
              stroke="#8B5CF6" stroke-width="2" fill="none"/>
        <path d="M 192 42 L 198 42 L 198 82 L 192 82"
              stroke="#8B5CF6" stroke-width="2" fill="none"/>

        <text x="80"  y="60" font-family="ui-monospace, monospace"
              font-size="12" font-weight="700" fill="#7C3AED">cos θ</text>
        <text x="134" y="60" font-family="ui-monospace, monospace"
              font-size="12" font-weight="700" fill="#EC4899">−sin θ</text>
        <text x="80"  y="80" font-family="ui-monospace, monospace"
              font-size="12" font-weight="700" fill="#10B981">sin θ</text>
        <text x="134" y="80" font-family="ui-monospace, monospace"
              font-size="12" font-weight="700" fill="#7C3AED">cos θ</text>

        <text x="130" y="106" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            Rᵀ · R = I — длины сохраняются
        </text>
    </g>
</svg>