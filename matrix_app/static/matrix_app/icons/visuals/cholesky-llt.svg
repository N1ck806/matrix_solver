<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Разложение Холецкого: A = L · Lᵀ">
    <defs>
        <linearGradient id="ch-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#10B981" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="ch-A" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <linearGradient id="ch-L" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#10B981"/>
            <stop offset="1" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="ch-LT" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#0891B2"/>
        </linearGradient>
        <filter id="ch-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="560" fill="url(#ch-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#10B981" fill-opacity="0.10"
          stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#059669">
        Разложение Холецкого: A = L · Lᵀ
    </text>

    <text x="400" y="92" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="11" fill="#6B7280">
        для симметричных положительно определённых матриц
    </text>

    <!-- РАЗЛОЖЕНИЕ -->
    <g transform="translate(70, 130)">

        <!-- A -->
        <g transform="translate(0, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#BE185D"
                  letter-spacing="0.8">A = Aᵀ</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#EC4899" fill-opacity="0.12"
                  stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Симметричный паттерн -->
            <g transform="translate(15, 15)">
                <!-- Диагональ -->
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>

                <!-- Верхний треугольник -->
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.3"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>

                <!-- Нижний треугольник — зеркало -->
                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.3"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#BE185D">симметричная</text>
        </g>

        <!-- = -->
        <text x="145" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="26" font-weight="800" fill="#7C3AED">=</text>

        <!-- L -->
        <g transform="translate(180, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#059669"
                  letter-spacing="0.8">L</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#10B981" fill-opacity="0.12"
                  stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Нижнетреугольный паттерн -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#10B981" opacity="0.75"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#10B981" opacity="0.7"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#10B981" opacity="0.8"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#059669">нижняя ⬤</text>
        </g>

        <!-- · -->
        <text x="325" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="20" font-weight="800" fill="#7C3AED">·</text>

        <!-- Lᵀ -->
        <g transform="translate(345, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#0891B2"
                  letter-spacing="0.8">Lᵀ</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#06B6D4" fill-opacity="0.12"
                  stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Верхнетреугольный паттерн (зеркало L) -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.75"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.7"/>

                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.8"/>

                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>

                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#0891B2">верхняя ⬤</text>
        </g>
    </g>

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <g transform="translate(30, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#10B981" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#059669"
                  letter-spacing="1">УСЛОВИЯ ПРИМЕНИМОСТИ</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">• A — симметричная: A = Aᵀ</text>
            <text x="20" y="72">• A — положительно определённая:</text>
            <text x="30" y="90" font-family="ui-monospace, monospace"
                  font-weight="700" fill="#059669">xᵀ·A·x &gt; 0 для всех x ≠ 0</text>
            <text x="20" y="114">• Все λ(A) &gt; 0</text>
        </g>
    </g>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <g transform="translate(410, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#0891B2"
                  letter-spacing="1">ЗАЧЕМ</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">• Вдвое быстрее, чем LU: O(n³/3) vs O(2n³/3)</text>
            <text x="20" y="72">• Численно устойчиво для SPD-матриц</text>
            <text x="20" y="94">• Решение СЛАУ: A·x = b → L·Lᵀ·x = b</text>
            <text x="20" y="116">• Применение: МКЭ, оптимизация, статистика</text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 525)">
        <rect x="0" y="0" width="740" height="24" rx="12"
              fill="#10B981" fill-opacity="0.08"/>

        <text x="370" y="16" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" font-weight="700" fill="#059669">
            Холецкий: для SPD-матриц — вдвое быстрее LU. L — нижнетреугольная, Lᵀ — верхнетреугольная
        </text>
    </g>
</svg>