<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Факторный анализ психологических шкал">
    <defs>
        <linearGradient id="pp-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#06B6D4" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="pp-axis1" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <linearGradient id="pp-axis2" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
        <filter id="pp-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="pp-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="url(#pp-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        Факторный анализ шкал личности
    </text>

    <!-- ЛЕВАЯ ЧАСТЬ: корреляционная матрица -->
    <g transform="translate(30, 100)">

        <rect x="0" y="0" width="330" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="165" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">КОРРЕЛЯЦИОННАЯ МАТРИЦА R</text>

        <!-- Заголовки столбцов -->
        <g font-family="ui-monospace, monospace" font-size="10"
           font-weight="800" fill="#6B7280" text-anchor="middle">
            <text x="115" y="56">Трев</text>
            <text x="155" y="56">Депрес</text>
            <text x="200" y="56">Экстр</text>
            <text x="245" y="56">Откр</text>
        </g>

        <!-- Заголовки строк -->
        <g font-family="ui-monospace, monospace" font-size="10"
           font-weight="800" fill="#6B7280" text-anchor="end">
            <text x="100" y="86">Трев</text>
            <text x="100" y="126">Депрес</text>
            <text x="100" y="166">Экстр</text>
            <text x="100" y="206">Откр</text>
        </g>

        <!-- Ячейки 4×4 -->
        <g transform="translate(105, 66)">
            <!-- Строка 1 -->
            <rect x="0"  y="0"  width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.95"/>
            <rect x="42" y="0"  width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.75"/>
            <rect x="84" y="0"  width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.3"/>
            <rect x="126" y="0" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.15"/>

            <!-- Строка 2 -->
            <rect x="0"  y="42" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.75"/>
            <rect x="42" y="42" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.95"/>
            <rect x="84" y="42" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.4"/>
            <rect x="126" y="42" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.2"/>

            <!-- Строка 3 -->
            <rect x="0"  y="84" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.3"/>
            <rect x="42" y="84" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.4"/>
            <rect x="84" y="84" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.95"/>
            <rect x="126" y="84" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.35"/>

            <!-- Строка 4 -->
            <rect x="0"  y="126" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.15"/>
            <rect x="42" y="126" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.2"/>
            <rect x="84" y="126" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.35"/>
            <rect x="126" y="126" width="36" height="36" rx="5" fill="#8B5CF6" opacity="0.95"/>

            <!-- Значения -->
            <g font-family="ui-monospace, monospace" font-size="10"
               font-weight="800" text-anchor="middle">
                <text x="18" y="22" fill="#FFFFFF">1.00</text>
                <text x="60" y="22" fill="#FFFFFF">0.65</text>
                <text x="102" y="22" fill="#7C3AED">0.30</text>
                <text x="144" y="22" fill="#7C3AED">0.15</text>

                <text x="18" y="64" fill="#FFFFFF">0.65</text>
                <text x="60" y="64" fill="#FFFFFF">1.00</text>
                <text x="102" y="64" fill="#7C3AED">0.40</text>
                <text x="144" y="64" fill="#7C3AED">0.20</text>

                <text x="18" y="106" fill="#7C3AED">0.30</text>
                <text x="60" y="106" fill="#7C3AED">0.40</text>
                <text x="102" y="106" fill="#FFFFFF">1.00</text>
                <text x="144" y="106" fill="#7C3AED">0.35</text>

                <text x="18" y="148" fill="#7C3AED">0.15</text>
                <text x="60" y="148" fill="#7C3AED">0.20</text>
                <text x="102" y="148" fill="#7C3AED">0.35</text>
                <text x="144" y="148" fill="#FFFFFF">1.00</text>
            </g>
        </g>

        <text x="165" y="245" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" fill="#6B7280">
            диагональ = 1.00 · симметричная
        </text>

        <!-- Мини-спектр R -->
        <g transform="translate(30, 270)">
            <text x="135" y="0" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">СПЕКТР R</text>

            <!-- Столбики λ -->
            <g transform="translate(30, 15)">
                <rect x="0"  y="30" width="40" height="60" rx="4" fill="#8B5CF6" filter="url(#pp-glow)"/>
                <rect x="50" y="50" width="40" height="40" rx="4" fill="#A78BFA"/>
                <rect x="100" y="66" width="40" height="24" rx="4" fill="#C4B5FD"/>
                <rect x="150" y="76" width="40" height="14" rx="4" fill="#DDD6FE"/>

                <g font-family="ui-monospace, monospace" font-size="10"
                   font-weight="800" text-anchor="middle" fill="#7C3AED">
                    <text x="20"  y="104">2.5</text>
                    <text x="70"  y="104">0.9</text>
                    <text x="120" y="104">0.4</text>
                    <text x="170" y="104">0.2</text>
                </g>
            </g>
        </g>
    </g>

    <!-- СТРЕЛКА → -->
    <g transform="translate(370, 290)">
        <line x1="0" y1="0" x2="28" y2="0"
              stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,-6 42,0 28,6" fill="#7C3AED"/>
        <text x="14" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED">факторы</text>
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: факторы + профили -->
    <g transform="translate(425, 100)">

        <rect x="0" y="0" width="345" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="172" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">ГЛАВНЫЕ ФАКТОРЫ</text>

        <!-- Оси факторов -->
        <g transform="translate(35, 50)">
            <!-- Фон-область -->
            <rect x="0" y="0" width="280" height="180" rx="10"
                  fill="#FFFFFF" fill-opacity="0.4"
                  stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1"/>

            <!-- Оси -->
            <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3">
                <line x1="0" y1="140" x2="280" y2="140"/>
                <line x1="140" y1="0" x2="140" y2="180"/>
            </g>

            <!-- Фактор 1 — главная ось -->
            <line x1="40" y1="120" x2="240" y2="40"
                  stroke="url(#pp-axis1)" stroke-width="3.5"
                  stroke-linecap="round" filter="url(#pp-glow)"/>
            <text x="248" y="38" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#8B5CF6">F1</text>
            <text x="248" y="52" font-family="system-ui, sans-serif"
                  font-size="9" fill="#EC4899">λ₁ = 2.5</text>

            <!-- Фактор 2 -->
            <line x1="100" y1="20" x2="180" y2="150"
                  stroke="url(#pp-axis2)" stroke-width="2.5"
                  stroke-linecap="round" filter="url(#pp-glow)"/>
            <text x="188" y="160" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#0891B2">F2</text>
            <text x="188" y="174" font-family="system-ui, sans-serif"
                  font-size="9" fill="#10B981">λ₂ = 0.9</text>

            <!-- Шкалы как векторы -->
            <g stroke-linecap="round">
                <!-- Тревожность — по F1 -->
                <line x1="140" y1="140" x2="180" y2="116"
                      stroke="#8B5CF6" stroke-width="2"/>
                <circle cx="180" cy="116" r="4" fill="#8B5CF6"/>

                <!-- Депрессия — по F1 -->
                <line x1="140" y1="140" x2="175" y2="105"
                      stroke="#8B5CF6" stroke-width="2"/>
                <circle cx="175" cy="105" r="4" fill="#8B5CF6"/>

                <!-- Экстраверсия — по F2 -->
                <line x1="140" y1="140" x2="165" y2="160"
                      stroke="#06B6D4" stroke-width="2"/>
                <circle cx="165" cy="160" r="4" fill="#06B6D4"/>

                <!-- Открытость — по F2 -->
                <line x1="140" y1="140" x2="155" y2="135"
                      stroke="#06B6D4" stroke-width="2"/>
                <circle cx="155" cy="135" r="4" fill="#06B6D4"/>
            </g>

            <!-- Метки шкал -->
            <g font-family="system-ui, sans-serif" font-size="9"
               font-weight="700" text-anchor="middle">
                <text x="185" y="112" fill="#7C3AED">Трев</text>
                <text x="180" y="98" fill="#7C3AED">Депрес</text>
                <text x="170" y="174" fill="#0891B2">Экстр</text>
                <text x="152" y="132" fill="#0891B2">Откр</text>
            </g>
        </g>

        <!-- Разделитель -->
        <line x1="25" y1="245" x2="320" y2="245"
              stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1"
              stroke-dasharray="3 3"/>

        <!-- Профили испытуемых -->
        <text x="172" y="266" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="0.8">ПРОФИЛИ ИСПЫТУЕМЫХ</text>

        <g transform="translate(30, 280)">
            <!-- Профиль 1 -->
            <g>
                <text x="0" y="12" font-family="system-ui, sans-serif"
                      font-size="10" font-weight="700" fill="#7C3AED">Исп. 1</text>
                <rect x="60" y="0" width="14" height="14" rx="3" fill="#8B5CF6"/>
                <rect x="78" y="0" width="14" height="14" rx="3" fill="#8B5CF6" opacity="0.85"/>
                <rect x="96" y="0" width="14" height="14" rx="3" fill="#06B6D4" opacity="0.5"/>
                <rect x="114" y="0" width="14" height="14" rx="3" fill="#06B6D4" opacity="0.4"/>
            </g>

            <!-- Профиль 2 -->
            <g transform="translate(0, 22)">
                <text x="0" y="12" font-family="system-ui, sans-serif"
                      font-size="10" font-weight="700" fill="#BE185D">Исп. 2</text>
                <rect x="60" y="0" width="14" height="14" rx="3" fill="#8B5CF6" opacity="0.3"/>
                <rect x="78" y="0" width="14" height="14" rx="3" fill="#8B5CF6" opacity="0.25"/>
                <rect x="96" y="0" width="14" height="14" rx="3" fill="#06B6D4"/>
                <rect x="114" y="0" width="14" height="14" rx="3" fill="#06B6D4" opacity="0.9"/>
            </g>

            <!-- Профиль 3 -->
            <g transform="translate(0, 44)">
                <text x="0" y="12" font-family="system-ui, sans-serif"
                      font-size="10" font-weight="700" fill="#0891B2">Исп. 3</text>
                <rect x="60" y="0" width="14" height="14" rx="3" fill="#8B5CF6"/>
                <rect x="78" y="0" width="14" height="14" rx="3" fill="#8B5CF6"/>
                <rect x="96" y="0" width="14" height="14" rx="3" fill="#06B6D4"/>
                <rect x="114" y="0" width="14" height="14" rx="3" fill="#06B6D4"/>
            </g>

            <!-- Подписи колонок -->
            <g font-family="system-ui, sans-serif" font-size="8"
               font-weight="700" fill="#6B7280" text-anchor="middle">
                <text x="67"  y="76">Трев</text>
                <text x="85"  y="76">Депр</text>
                <text x="103" y="76">Экстр</text>
                <text x="121" y="76">Откр</text>
            </g>

            <!-- Легенда: профили на факторах -->
            <text x="0" y="94" font-family="system-ui, sans-serif"
                  font-size="9.5" fill="#6B7280">
                → проекция на F1, F2 даёт кластеры
            </text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 500)">
        <rect x="0" y="0" width="740" height="40" rx="12"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="370" y="26" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            Спектр корреляционной матрицы R → факторы. Проекция испытуемых на F1, F2 → профили личности.
        </text>
    </g>
</svg>