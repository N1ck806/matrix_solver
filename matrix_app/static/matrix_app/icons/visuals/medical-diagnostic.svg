<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Байесовская диагностика: матрица симптом × диагноз">
    <defs>
        <linearGradient id="md-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EC4899" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#06B6D4" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="md-hi" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <linearGradient id="md-mid" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="md-lo" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#0891B2"/>
        </linearGradient>
        <filter id="md-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="md-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="url(#md-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#EC4899" fill-opacity="0.10"
          stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#BE185D">
        Байесовская диагностика: P(D | S)
    </text>

    <!-- ЛЕВАЯ ЧАСТЬ: матрица симптом × диагноз -->
    <g transform="translate(30, 100)">

        <rect x="0" y="0" width="420" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#EC4899" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="210" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#BE185D"
              letter-spacing="1">МАТРИЦА «СИМПТОМ × ДИАГНОЗ»</text>

        <!-- Заголовки диагнозов -->
        <g font-family="system-ui, sans-serif" font-size="10"
           font-weight="800" fill="#BE185D" text-anchor="middle">
            <text x="175" y="56">Грипп</text>
            <text x="240" y="56">ОРВИ</text>
            <text x="305" y="56">Аллергия</text>
            <text x="370" y="56">COVID</text>
        </g>

        <!-- Заголовки симптомов -->
        <g font-family="system-ui, sans-serif" font-size="10"
           font-weight="800" fill="#0891B2" text-anchor="end">
            <text x="130" y="90">Темп.</text>
            <text x="130" y="130">Кашель</text>
            <text x="130" y="170">Насморк</text>
            <text x="130" y="210">Одышка</text>
            <text x="130" y="250">Слабость</text>
        </g>

        <!-- Ячейки 5×4 -->
        <g transform="translate(140, 66)">
            <!-- Строка 1: температура -->
            <rect x="0"  y="0" width="55" height="34" rx="5" fill="#EC4899" opacity="0.95"/>
            <rect x="60" y="0" width="55" height="34" rx="5" fill="#F59E0B" opacity="0.7"/>
            <rect x="120" y="0" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.2"/>
            <rect x="180" y="0" width="55" height="34" rx="5" fill="#EC4899" opacity="0.85"/>

            <!-- Строка 2: кашель -->
            <rect x="0"  y="40" width="55" height="34" rx="5" fill="#F59E0B" opacity="0.75"/>
            <rect x="60" y="40" width="55" height="34" rx="5" fill="#F59E0B" opacity="0.65"/>
            <rect x="120" y="40" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.25"/>
            <rect x="180" y="40" width="55" height="34" rx="5" fill="#EC4899" opacity="0.9"/>

            <!-- Строка 3: насморк -->
            <rect x="0"  y="80" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.4"/>
            <rect x="60" y="80" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.7"/>
            <rect x="120" y="80" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.9"/>
            <rect x="180" y="80" width="55" height="34" rx="5" fill="#F59E0B" opacity="0.55"/>

            <!-- Строка 4: одышка -->
            <rect x="0"  y="120" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.2"/>
            <rect x="60" y="120" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.15"/>
            <rect x="120" y="120" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.1"/>
            <rect x="180" y="120" width="55" height="34" rx="5" fill="#EC4899" opacity="0.95"/>

            <!-- Строка 5: слабость -->
            <rect x="0"  y="160" width="55" height="34" rx="5" fill="#EC4899" opacity="0.7"/>
            <rect x="60" y="160" width="55" height="34" rx="5" fill="#F59E0B" opacity="0.6"/>
            <rect x="120" y="160" width="55" height="34" rx="5" fill="#22D3EE" opacity="0.4"/>
            <rect x="180" y="160" width="55" height="34" rx="5" fill="#EC4899" opacity="0.75"/>

            <!-- Значения -->
            <g font-family="ui-monospace, monospace" font-size="10"
               font-weight="800" text-anchor="middle" fill="#FFFFFF">
                <text x="27" y="21">0.95</text>
                <text x="87" y="21">0.60</text>
                <text x="147" y="21" fill="#0891B2">0.15</text>
                <text x="207" y="21">0.85</text>

                <text x="27" y="61">0.70</text>
                <text x="87" y="61">0.65</text>
                <text x="147" y="61" fill="#0891B2">0.20</text>
                <text x="207" y="61">0.90</text>

                <text x="27" y="101" fill="#0891B2">0.40</text>
                <text x="87" y="101">0.70</text>
                <text x="147" y="101">0.90</text>
                <text x="207" y="101">0.55</text>

                <text x="27" y="141" fill="#0891B2">0.10</text>
                <text x="87" y="141" fill="#0891B2">0.10</text>
                <text x="147" y="141" fill="#0891B2">0.05</text>
                <text x="207" y="141">0.95</text>

                <text x="27" y="181">0.75</text>
                <text x="87" y="181">0.60</text>
                <text x="147" y="181" fill="#0891B2">0.40</text>
                <text x="207" y="181">0.80</text>
            </g>
        </g>

        <!-- Цветовая легенда -->
        <g transform="translate(40, 270)" font-family="system-ui, sans-serif"
           font-size="10" fill="#6B7280">
            <rect x="0" y="-6" width="14" height="14" rx="3" fill="#EC4899"/>
            <text x="22" y="6">высокая</text>
            <rect x="100" y="-6" width="14" height="14" rx="3" fill="#F59E0B" opacity="0.7"/>
            <text x="122" y="6">средняя</text>
            <rect x="200" y="-6" width="14" height="14" rx="3" fill="#22D3EE" opacity="0.5"/>
            <text x="222" y="6">низкая</text>
        </g>

        <!-- Формула Байеса -->
        <g transform="translate(40, 295)">
            <rect x="0" y="0" width="340" height="60" rx="10"
                  fill="#7C3AED" fill-opacity="0.08"
                  stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>

            <text x="170" y="22" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">ФОРМУЛА БАЙЕСА</text>

            <text x="170" y="46" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="14" font-weight="800" fill="#7C3AED">
                P(D | S) = P(S | D) · P(D) / P(S)
            </text>
        </g>
    </g>

    <!-- СТРЕЛКА → -->
    <g transform="translate(465, 290)">
        <line x1="0" y1="0" x2="28" y2="0"
              stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,-6 42,0 28,6" fill="#7C3AED"/>
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: диагностика пациента -->
    <g transform="translate(520, 100)">

        <rect x="0" y="0" width="250" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#EC4899" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="125" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#BE185D"
              letter-spacing="1">ДИАГНОЗ ПАЦИЕНТА</text>

        <!-- Симптомы пациента -->
        <text x="20" y="52" font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#0891B2">
            Симптомы:
        </text>

        <g transform="translate(20, 64)">
            <rect x="0" y="0" width="210" height="26" rx="6"
                  fill="#EC4899" fill-opacity="0.15"
                  stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
            <text x="10" y="17" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#BE185D">Температура ↑</text>

            <rect x="0" y="32" width="210" height="26" rx="6"
                  fill="#EC4899" fill-opacity="0.15"
                  stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
            <text x="10" y="49" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#BE185D">Кашель</text>

            <rect x="0" y="64" width="210" height="26" rx="6"
                  fill="#EC4899" fill-opacity="0.15"
                  stroke="#EC4899" stroke-opacity="0.4" stroke-width="1"/>
            <text x="10" y="81" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#BE185D">Одышка</text>
        </g>

        <!-- Разделитель -->
        <line x1="20" y1="170" x2="230" y2="170"
              stroke="#EC4899" stroke-opacity="0.25" stroke-width="1"
              stroke-dasharray="3 3"/>

        <!-- Вероятности диагнозов -->
        <text x="20" y="192" font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED">
            Вероятности:
        </text>

        <!-- Грипп — высокая -->
        <g transform="translate(20, 205)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#BE185D">Грипп</text>
            <rect x="80" y="4" width="100" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="80" y="4" width="88" height="14" rx="3" fill="url(#md-hi)"/>
            <text x="195" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#BE185D">88%</text>
        </g>

        <!-- COVID -->
        <g transform="translate(20, 230)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#BE185D">COVID</text>
            <rect x="80" y="4" width="100" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="80" y="4" width="62" height="14" rx="3" fill="url(#md-mid)"/>
            <text x="195" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#D97706">62%</text>
        </g>

        <!-- ОРВИ -->
        <g transform="translate(20, 255)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#0891B2">ОРВИ</text>
            <rect x="80" y="4" width="100" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="80" y="4" width="38" height="14" rx="3" fill="url(#md-lo)"/>
            <text x="195" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#0891B2">38%</text>
        </g>

        <!-- Аллергия -->
        <g transform="translate(20, 280)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#6B7280">Аллергия</text>
            <rect x="80" y="4" width="100" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="80" y="4" width="8" height="14" rx="3" fill="#9CA3AF"/>
            <text x="195" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#6B7280">8%</text>
        </g>

        <!-- Итог -->
        <g transform="translate(20, 315)">
            <rect x="0" y="0" width="210" height="50" rx="8"
                  fill="#EC4899" fill-opacity="0.10"
                  stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.3"
                  filter="url(#md-glow)"/>
            <text x="105" y="20" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="10" font-weight="800" fill="#BE185D"
                  letter-spacing="0.8">НАИБОЛЕЕ ВЕРОЯТНО</text>
            <text x="105" y="40" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="16" font-weight="800" fill="#BE185D">
                Грипп
            </text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 500)">
        <rect x="0" y="0" width="740" height="40" rx="12"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#EC4899" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="370" y="26" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            Матрица «симптом × диагноз» содержит условные вероятности P(S | D).
            Формула Байеса пересчитывает их в P(D | S) — вероятность диагноза по симптомам.
        </text>
    </g>
</svg>