<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Цветовой круг и матрица совместимости">
    <defs>
        <linearGradient id="cw-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EC4899" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="cw-conic" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#EC4899"/>
            <stop offset="25%" stop-color="#F59E0B"/>
            <stop offset="50%" stop-color="#10B981"/>
            <stop offset="75%" stop-color="#06B6D4"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
        </linearGradient>
        <filter id="cw-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="600" fill="url(#cw-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="30" width="400" height="56" rx="28"
          fill="#EC4899" fill-opacity="0.12"
          stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="66" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#BE185D">
        Цветовой круг гармонии
    </text>

    <!-- Цветовой круг (слева) -->
    <g transform="translate(220, 340)">
        <!-- Внешний круг с сегментами -->
        <circle cx="0" cy="0" r="120"
                fill="none" stroke="#F3F4F6" stroke-width="24" opacity="0.5"/>

        <!-- Сегменты по кругу -->
        <g filter="url(#cw-glow)">
            <path d="M 0 0 L 0 -120 A 120 120 0 0 1 104 -60 Z" fill="#EC4899" opacity="0.85"/>
            <path d="M 0 0 L 104 -60 A 120 120 0 0 1 104 60 Z" fill="#F59E0B" opacity="0.85"/>
            <path d="M 0 0 L 104 60 A 120 120 0 0 1 0 120 Z" fill="#FCD34D" opacity="0.85"/>
            <path d="M 0 0 L 0 120 A 120 120 0 0 1 -104 60 Z" fill="#10B981" opacity="0.85"/>
            <path d="M 0 0 L -104 60 A 120 120 0 0 1 -104 -60 Z" fill="#06B6D4" opacity="0.85"/>
            <path d="M 0 0 L -104 -60 A 120 120 0 0 1 0 -120 Z" fill="#8B5CF6" opacity="0.85"/>
        </g>

        <!-- Внутренний белый круг -->
        <circle cx="0" cy="0" r="60" fill="#FFFFFF" opacity="0.95"/>
        <circle cx="0" cy="0" r="60" fill="none" stroke="#E5E7EB" stroke-width="1"/>

        <text x="0" y="-8" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#7C3AED">
            Цвета
        </text>
        <text x="0" y="12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            совместимость
        </text>

        <!-- Точки-цвета на окружности -->
        <circle cx="0" cy="-120" r="8" fill="#EC4899" stroke="#FFFFFF" stroke-width="2">
            <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="104" cy="-60" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="104" cy="60" r="8" fill="#FCD34D" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="0" cy="120" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="-104" cy="60" r="8" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="-104" cy="-60" r="8" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Матрица совместимости (справа) -->
    <g transform="translate(440, 140)">
        <rect x="0" y="0" width="320" height="400" rx="16"
              fill="#FFFFFF" fill-opacity="0.92"
              stroke="#EC4899" stroke-opacity="0.35" stroke-width="1.5"/>

        <text x="160" y="30" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#BE185D"
              letter-spacing="1">МАТРИЦА C[i][j]</text>

        <!-- Заголовки столбцов -->
        <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">
            <text x="90" y="58" text-anchor="middle">P</text>
            <text x="146" y="58" text-anchor="middle">O</text>
            <text x="202" y="58" text-anchor="middle">Y</text>
            <text x="258" y="58" text-anchor="middle">G</text>
        </g>

        <!-- Заголовки строк -->
        <g font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6B7280">
            <text x="62" y="88" text-anchor="end">P</text>
            <text x="62" y="134" text-anchor="end">O</text>
            <text x="62" y="180" text-anchor="end">Y</text>
            <text x="62" y="226" text-anchor="end">G</text>
        </g>

        <!-- Ячейки матрицы -->
        <!-- Строка 1 — P (розовый) -->
        <rect x="78" y="70" width="52" height="38" rx="6" fill="#EC4899" opacity="0.95"/>
        <rect x="134" y="70" width="52" height="38" rx="6" fill="#EC4899" opacity="0.7"/>
        <rect x="190" y="70" width="52" height="38" rx="6" fill="#EC4899" opacity="0.35"/>
        <rect x="246" y="70" width="52" height="38" rx="6" fill="#EC4899" opacity="0.15"/>

        <!-- Строка 2 — O (оранжевый) -->
        <rect x="78" y="116" width="52" height="38" rx="6" fill="#F59E0B" opacity="0.7"/>
        <rect x="134" y="116" width="52" height="38" rx="6" fill="#F59E0B" opacity="0.95"/>
        <rect x="190" y="116" width="52" height="38" rx="6" fill="#F59E0B" opacity="0.55"/>
        <rect x="246" y="116" width="52" height="38" rx="6" fill="#F59E0B" opacity="0.3"/>

        <!-- Строка 3 — Y (жёлтый) -->
        <rect x="78" y="162" width="52" height="38" rx="6" fill="#FCD34D" opacity="0.35"/>
        <rect x="134" y="162" width="52" height="38" rx="6" fill="#FCD34D" opacity="0.55"/>
        <rect x="190" y="162" width="52" height="38" rx="6" fill="#FCD34D" opacity="0.95"/>
        <rect x="246" y="162" width="52" height="38" rx="6" fill="#FCD34D" opacity="0.7"/>

        <!-- Строка 4 — G (зелёный) -->
        <rect x="78" y="208" width="52" height="38" rx="6" fill="#10B981" opacity="0.15"/>
        <rect x="134" y="208" width="52" height="38" rx="6" fill="#10B981" opacity="0.3"/>
        <rect x="190" y="208" width="52" height="38" rx="6" fill="#10B981" opacity="0.7"/>
        <rect x="246" y="208" width="52" height="38" rx="6" fill="#10B981" opacity="0.95"/>

        <!-- Легенда -->
        <text x="160" y="290" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED">
            C[i][j] ∈ [0, 1]
        </text>
        <text x="160" y="312" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            1 — идеально сочетаются
        </text>
        <text x="160" y="328" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            0 — конфликтуют
        </text>

        <!-- Формула -->
        <rect x="20" y="348" width="280" height="36" rx="8"
              fill="#EC4899" fill-opacity="0.08"
              stroke="#EC4899" stroke-opacity="0.35" stroke-width="1"/>
        <text x="160" y="371" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="700" fill="#BE185D">
            C[i][j] = cos(ΔE)
        </text>
    </g>

    <!-- Пояснение снизу -->
    <text x="400" y="575" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#6B7280">
        Цвета, близкие на круге → высокое значение совместимости
    </text>
</svg>