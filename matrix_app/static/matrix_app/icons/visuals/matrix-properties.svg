<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Свойства матрицы: симметрия, ортогональность, диагональ">
    <defs>
        <linearGradient id="mp-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.07"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.07"/>
        </linearGradient>
        <linearGradient id="mp-sym" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="mp-orth" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#06B6D4"/>
            <stop offset="1" stop-color="#0891B2"/>
        </linearGradient>
        <linearGradient id="mp-diag" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <filter id="mp-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="600" fill="url(#mp-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="28" width="400" height="56" rx="28"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="400" y="64" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#7C3AED">
        Свойства матрицы
    </text>

    <!-- ============================================================
         СИММЕТРИЧНАЯ (слева): A = Aᵀ
         ============================================================ -->
    <g transform="translate(40, 130)">
        <text x="100" y="-8" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#7C3AED">
            Симметричная
        </text>

        <g transform="translate(20, 20)">
            <!-- Ячейки 3×3 -->
            <rect x="0"  y="0"  width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.85"/>
            <rect x="40" y="0"  width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.65"/>
            <rect x="80" y="0"  width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.4"/>
            <rect x="0"  y="40" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.65"/>
            <rect x="40" y="40" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.9"/>
            <rect x="80" y="40" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.65"/>
            <rect x="0"  y="80" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.4"/>
            <rect x="40" y="80" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.65"/>
            <rect x="80" y="80" width="34" height="34" rx="5" fill="#8B5CF6" opacity="0.85"/>

            <!-- Стрелки взаимности -->
            <g stroke="#7C3AED" stroke-width="1.5" fill="none" opacity="0.7">
                <path d="M 34 17 Q 57 10 74 17" marker-end="url(#mp-arrow-sym)"/>
                <path d="M 17 34 Q 10 57 17 74"/>
                <path d="M 97 34 Q 105 57 97 74"/>
            </g>
            <defs>
                <marker id="mp-arrow-sym" viewBox="0 0 10 10" refX="9" refY="5"
                        markerWidth="5" markerHeight="5" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
                </marker>
            </defs>
        </g>

        <text x="80" y="160" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="14" font-weight="700" fill="#7C3AED">
            A = Aᵀ
        </text>
        <text x="80" y="180" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            aᵢⱼ = aⱼᵢ
        </text>
    </g>

    <!-- ============================================================
         ОРТОГОНАЛЬНАЯ (центр): Aᵀ·A = I
         ============================================================ -->
    <g transform="translate(280, 130)">
        <text x="120" y="-8" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#0891B2">
            Ортогональная
        </text>

        <g transform="translate(40, 20)">
            <!-- Ячейки 3×3 — повёрнутые -->
            <rect x="0"  y="0"  width="34" height="34" rx="5" fill="#06B6D4" opacity="0.85"/>
            <rect x="40" y="0"  width="34" height="34" rx="5" fill="#06B6D4" opacity="0.25"/>
            <rect x="80" y="0"  width="34" height="34" rx="5" fill="#06B6D4" opacity="0.15"/>
            <rect x="0"  y="40" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.15"/>
            <rect x="40" y="40" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.9"/>
            <rect x="80" y="40" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.25"/>
            <rect x="0"  y="80" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.15"/>
            <rect x="40" y="80" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.25"/>
            <rect x="80" y="80" width="34" height="34" rx="5" fill="#06B6D4" opacity="0.85"/>

            <!-- Единичная матрица поверх — подсветка -->
            <rect x="40" y="40" width="34" height="34" rx="5"
                  fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
        </g>

        <text x="80" y="160" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="14" font-weight="700" fill="#0891B2">
            Aᵀ · A = I
        </text>
        <text x="80" y="180" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            столбцы — ортонормированы
        </text>
    </g>

    <!-- ============================================================
         ДИАГОНАЛЬНАЯ (справа): только диагональ ≠ 0
         ============================================================ -->
    <g transform="translate(520, 130)">
        <text x="120" y="-8" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#BE185D">
            Диагональная
        </text>

        <g transform="translate(40, 20)">
            <!-- Ячейки 3×3 -->
            <rect x="0"  y="0"  width="34" height="34" rx="5" fill="#EC4899" opacity="0.9"/>
            <rect x="40" y="0"  width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="80" y="0"  width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="0"  y="40" width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="40" y="40" width="34" height="34" rx="5" fill="#EC4899" opacity="0.9"/>
            <rect x="80" y="40" width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="0"  y="80" width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="40" y="80" width="34" height="34" rx="5" fill="#F3F4F6" opacity="0.5"/>
            <rect x="80" y="80" width="34" height="34" rx="5" fill="#EC4899" opacity="0.9"/>

            <!-- Диагональная линия -->
            <line x1="10" y1="10" x2="115" y2="115"
                  stroke="#BE185D" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
        </g>

        <text x="80" y="160" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="14" font-weight="700" fill="#BE185D">
            aᵢⱼ = 0 (i ≠ j)
        </text>
        <text x="80" y="180" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" fill="#6B7280">
            ненулевая только диагональ
        </text>
    </g>

    <!-- ============================================================
         НИЖНЯЯ ПЛАШКА — сводка свойств
         ============================================================ -->
    <g transform="translate(60, 380)">
        <rect x="0" y="0" width="680" height="170" rx="16"
              fill="#FFFFFF" fill-opacity="0.92"
              stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>

        <text x="340" y="30" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#7C3AED"
              letter-spacing="1.2">КЛЮЧЕВЫЕ СВОЙСТВА</text>

        <!-- 6 свойств в 3 колонки × 2 строки -->
        <g font-family="system-ui, sans-serif" font-size="12">
            <!-- Строка 1 -->
            <g transform="translate(30, 60)">
                <circle cx="6" cy="0" r="4" fill="#8B5CF6"/>
                <text x="18" y="4" fill="#4B5563">симметрия:</text>
                <text x="100" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#7C3AED">A = Aᵀ</text>
            </g>
            <g transform="translate(250, 60)">
                <circle cx="6" cy="0" r="4" fill="#06B6D4"/>
                <text x="18" y="4" fill="#4B5563">ортогональность:</text>
                <text x="140" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#0891B2">AᵀA = I</text>
            </g>
            <g transform="translate(480, 60)">
                <circle cx="6" cy="0" r="4" fill="#EC4899"/>
                <text x="18" y="4" fill="#4B5563">диагональ:</text>
                <text x="100" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#BE185D">aᵢⱼ = 0</text>
            </g>

            <!-- Строка 2 -->
            <g transform="translate(30, 100)">
                <circle cx="6" cy="0" r="4" fill="#8B5CF6"/>
                <text x="18" y="4" fill="#4B5563">транспонирование:</text>
                <text x="150" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#7C3AED">(Aᵀ)ᵀ = A</text>
            </g>
            <g transform="translate(250, 100)">
                <circle cx="6" cy="0" r="4" fill="#10B981"/>
                <text x="18" y="4" fill="#4B5563">определитель:</text>
                <text x="120" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#059669">det(Aᵀ) = det(A)</text>
            </g>
            <g transform="translate(480, 100)">
                <circle cx="6" cy="0" r="4" fill="#F59E0B"/>
                <text x="18" y="4" fill="#4B5563">след:</text>
                <text x="70" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#D97706">tr(A) = Σ aᵢᵢ</text>
            </g>

            <!-- Строка 3 -->
            <g transform="translate(30, 140)">
                <circle cx="6" cy="0" r="4" fill="#06B6D4"/>
                <text x="18" y="4" fill="#4B5563">обратная:</text>
                <text x="100" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#0891B2">A · A⁻¹ = I</text>
            </g>
            <g transform="translate(250, 140)">
                <circle cx="6" cy="0" r="4" fill="#EC4899"/>
                <text x="18" y="4" fill="#4B5563">спектр:</text>
                <text x="80" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#BE185D">A · v = λ · v</text>
            </g>
            <g transform="translate(480, 140)">
                <circle cx="6" cy="0" r="4" fill="#8B5CF6"/>
                <text x="18" y="4" fill="#4B5563">след–спектр:</text>
                <text x="120" y="4" font-family="ui-monospace, monospace"
                      font-weight="700" fill="#7C3AED">tr = Σ λᵢ</text>
            </g>
        </g>
    </g>
</svg>