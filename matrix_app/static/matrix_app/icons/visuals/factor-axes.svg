<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Факторный анализ: главные оси и проекции">
    <defs>
        <linearGradient id="fa-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#22D3EE" stop-opacity="0.06"/>
        </linearGradient>
        <radialGradient id="fa-cloud" cx="400" cy="320" r="220" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="fa-axis1" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <linearGradient id="fa-axis2" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
        <filter id="fa-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="600" fill="url(#fa-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="40" width="400" height="60" rx="30"
          fill="#8B5CF6" fill-opacity="0.12"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="78" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24" font-weight="800" fill="#7C3AED">
        Главные оси вариации
    </text>

    <!-- Облако точек -->
    <ellipse cx="400" cy="320" rx="240" ry="140"
             fill="url(#fa-cloud)" transform="rotate(-30 400 320)"/>

    <!-- Оси координат -->
    <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4">
        <line x1="140" y1="320" x2="660" y2="320"/>
        <line x1="400" y1="160" x2="400" y2="480"/>
    </g>
    <text x="670" y="325" font-family="system-ui, sans-serif"
          font-size="12" fill="#94A3B8">x₁</text>
    <text x="405" y="155" font-family="system-ui, sans-serif"
          font-size="12" fill="#94A3B8">x₂</text>

    <!-- Первая главная ось (PC1) — длинная -->
    <g filter="url(#fa-glow)">
        <line x1="200" y1="410" x2="600" y2="230"
              stroke="url(#fa-axis1)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="610" y="225" font-family="system-ui, sans-serif"
          font-size="14" font-weight="800" fill="#8B5CF6">PC1</text>
    <text x="610" y="243" font-family="system-ui, sans-serif"
          font-size="11" fill="#EC4899">λ₁ — главная</text>

    <!-- Вторая главная ось (PC2) — короткая -->
    <line x1="300" y1="200" x2="500" y2="440"
          stroke="url(#fa-axis2)" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="8 6">
        <animate attributeName="stroke-dashoffset" values="0;28" dur="2s" repeatCount="indefinite"/>
    </line>
    <text x="510" y="455" font-family="system-ui, sans-serif"
          font-size="14" font-weight="800" fill="#0891B2">PC2</text>
    <text x="510" y="473" font-family="system-ui, sans-serif"
          font-size="11" fill="#10B981">λ₂ — остаточная</text>

    <!-- Точки данных -->
    <g>
        <circle cx="280" cy="380" r="6" fill="#8B5CF6" opacity="0.85"/>
        <circle cx="340" cy="350" r="6" fill="#8B5CF6" opacity="0.9"/>
        <circle cx="400" cy="320" r="7" fill="#7C3AED"/>
        <circle cx="450" cy="295" r="6" fill="#8B5CF6" opacity="0.9"/>
        <circle cx="510" cy="260" r="6" fill="#8B5CF6" opacity="0.85"/>
        <circle cx="380" cy="290" r="5" fill="#A78BFA" opacity="0.8"/>
        <circle cx="430" cy="360" r="5" fill="#A78BFA" opacity="0.8"/>
        <circle cx="320" cy="300" r="5" fill="#A78BFA" opacity="0.8"/>
        <circle cx="490" cy="330" r="5" fill="#A78BFA" opacity="0.8"/>
        <circle cx="360" cy="400" r="5" fill="#A78BFA" opacity="0.8"/>
        <circle cx="540" cy="290" r="4" fill="#C4B5FD" opacity="0.75"/>
        <circle cx="260" cy="340" r="4" fill="#C4B5FD" opacity="0.75"/>
        <circle cx="450" cy="240" r="4" fill="#C4B5FD" opacity="0.75"/>
        <circle cx="330" cy="420" r="4" fill="#C4B5FD" opacity="0.75"/>
    </g>

    <!-- Проекция на PC1 -->
    <g stroke="#EC4899" stroke-width="1" stroke-dasharray="3 3" opacity="0.5">
        <line x1="280" y1="380" x2="330" y2="358"/>
        <line x1="400" y1="320" x2="400" y2="320"/>
        <line x1="510" y1="260" x2="470" y2="278"/>
    </g>

    <!-- Формула внизу слева -->
    <rect x="60" y="520" width="320" height="50" rx="12"
          fill="#FFFFFF" fill-opacity="0.9"
          stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="220" y="552" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="14" font-weight="700" fill="#7C3AED">
        R · v = λ · v
    </text>

    <!-- Пояснение внизу справа -->
    <rect x="420" y="520" width="320" height="50" rx="12"
          fill="#22D3EE" fill-opacity="0.1"
          stroke="#22D3EE" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="580" y="552" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#0891B2">
        λ₁ + λ₂ + … = tr(R)
    </text>
</svg>