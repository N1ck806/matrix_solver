<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Марковская цепь состояний кожи">
    <defs>
        <linearGradient id="ss-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F43F5E" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#F59E0B" stop-opacity="0.06"/>
        </linearGradient>
        <radialGradient id="ss-s1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(60)">
            <stop stop-color="#FECDD3"/>
            <stop offset="1" stop-color="#F43F5E"/>
        </radialGradient>
        <radialGradient id="ss-s2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(60)">
            <stop stop-color="#FEF3C7"/>
            <stop offset="1" stop-color="#F59E0B"/>
        </radialGradient>
        <radialGradient id="ss-s3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(60)">
            <stop stop-color="#A7F3D0"/>
            <stop offset="1" stop-color="#10B981"/>
        </radialGradient>
        <radialGradient id="ss-s4" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(0 0) scale(60)">
            <stop stop-color="#FBCFE8"/>
            <stop offset="1" stop-color="#BE185D"/>
        </radialGradient>
        <filter id="ss-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="ss-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/>
        </marker>
    </defs>

    <rect width="800" height="600" fill="url(#ss-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="28" width="440" height="56" rx="28"
          fill="#F43F5E" fill-opacity="0.10"
          stroke="#F43F5E" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="64" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#BE185D">
        Марковская цепь состояний кожи
    </text>

    <!-- Переходы -->
    <g stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.55"
       stroke-linecap="round" marker-end="url(#ss-arrow)">

        <!-- S1 → S2 -->
        <path d="M 250 200 Q 400 130 550 200"/>
        <!-- S2 → S3 -->
        <path d="M 550 200 Q 700 130 650 340"/>
        <!-- S3 → S4 -->
        <path d="M 650 340 Q 700 480 550 480"/>
        <!-- S4 → S1 -->
        <path d="M 550 480 Q 400 550 250 480"/>
        <!-- S1 → S3 -->
        <path d="M 250 480 Q 250 340 250 200"/>
        <!-- S2 → S4 -->
        <path d="M 650 200 Q 650 340 650 480"/>
    </g>

    <!-- Петли -->
    <g stroke="#8B5CF6" stroke-width="1.8" fill="none" opacity="0.5"
       stroke-linecap="round" marker-end="url(#ss-arrow)">
        <path d="M 190 200 Q 130 130 250 140"/>
        <path d="M 550 150 Q 650 90 700 200"/>
        <path d="M 700 340 Q 760 400 650 440"/>
        <path d="M 550 520 Q 400 590 250 520"/>
    </g>

    <!-- Импульс по циклу -->
    <circle r="6" fill="#F59E0B" filter="url(#ss-glow)">
        <animateMotion dur="12s" repeatCount="indefinite"
                       path="M 250 200 Q 400 130 550 200 Q 700 130 650 340 Q 700 480 550 480 Q 400 550 250 480 Q 250 340 250 200"/>
    </circle>

    <!-- Состояния: 4 узла -->
    <!-- S1: норма (розовый) -->
    <g filter="url(#ss-glow)">
        <circle cx="250" cy="200" r="58" fill="url(#ss-s1)"/>
        <circle cx="250" cy="200" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
    <text x="250" y="206" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₁</text>
    <text x="250" y="228" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">норма</text>

    <!-- S2: сухость (жёлтый) -->
    <g filter="url(#ss-glow)">
        <circle cx="650" cy="200" r="58" fill="url(#ss-s2)"/>
        <circle cx="650" cy="200" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
    <text x="650" y="206" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₂</text>
    <text x="650" y="228" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">сухость</text>

    <!-- S3: увлажнённая (зелёный) -->
    <g filter="url(#ss-glow)">
        <circle cx="650" cy="480" r="58" fill="url(#ss-s3)"/>
        <circle cx="650" cy="480" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
    <text x="650" y="486" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₃</text>
    <text x="650" y="508" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">увлажнённая</text>

    <!-- S4: воспаление (тёмно-розовый) -->
    <g filter="url(#ss-glow)">
        <circle cx="250" cy="480" r="58" fill="url(#ss-s4)"/>
        <circle cx="250" cy="480" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
    <text x="250" y="486" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₄</text>
    <text x="250" y="508" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">воспаление</text>

    <!-- Подписи вероятностей -->
    <g font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#7C3AED">
        <text x="400" y="128" text-anchor="middle">0.30</text>
        <text x="710" y="270" text-anchor="middle">0.25</text>
        <text x="400" y="555" text-anchor="middle">0.20</text>
        <text x="180" y="340" text-anchor="middle">0.15</text>
    </g>

    <!-- Формула перехода (внизу) -->
    <g transform="translate(60, 540)">
        <rect x="0" y="0" width="320" height="50" rx="12"
              fill="#FFFFFF" fill-opacity="0.95"
              stroke="#F43F5E" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="160" y="32" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#BE185D">
            sₜ₊₁ = P · sₜ
        </text>
    </g>

    <!-- Стационарное (внизу) -->
    <g transform="translate(420, 540)">
        <rect x="0" y="0" width="320" height="50" rx="12"
              fill="#F59E0B" fill-opacity="0.10"
              stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="160" y="32" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#B45309">
            π · P = π
        </text>
    </g>
</svg>