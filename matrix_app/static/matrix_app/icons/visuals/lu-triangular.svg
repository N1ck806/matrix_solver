<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="LU-разложение: A = L · U">
    <defs>
        <linearGradient id="lu-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#06B6D4" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="lu-A" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <linearGradient id="lu-L" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#A78BFA"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="lu-U" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#0891B2"/>
        </linearGradient>
        <filter id="lu-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="lu-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="url(#lu-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="20" width="400" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        LU-разложение: A = L · U
    </text>

    <!-- Расшифровка -->
    <text x="400" y="92" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="11" fill="#6B7280">
        L — нижнетреугольная · U — верхнетреугольная
    </text>

    <!-- РАЗЛОЖЕНИЕ -->
    <g transform="translate(70, 130)">

        <!-- A -->
        <g transform="translate(0, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#BE185D"
                  letter-spacing="0.8">A</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#EC4899" fill-opacity="0.12"
                  stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Ячейки 4×4 -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.8"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.5"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.4"/>

                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.5"/>

                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>

                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.5"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#BE185D">n × n</text>
        </g>

        <!-- = -->
        <text x="145" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="26" font-weight="800" fill="#7C3AED">=</text>

        <!-- L -->
        <g transform="translate(180, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">L</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#7C3AED" fill-opacity="0.12"
                  stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Нижнетреугольный паттерн -->
            <g transform="translate(15, 15)">
                <!-- Строка 1: одна ячейка -->
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#7C3AED" opacity="0.95"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <!-- Строка 2: две -->
                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.85"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.95"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <!-- Строка 3: три -->
                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.8"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.85"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <!-- Строка 4: четыре -->
                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.75"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.8"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.85"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#7C3AED">нижняя ⬤ · диаг = 1</text>
        </g>

        <!-- · -->
        <text x="325" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="20" font-weight="800" fill="#7C3AED">·</text>

        <!-- U -->
        <g transform="translate(345, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#0891B2"
                  letter-spacing="0.8">U</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#06B6D4" fill-opacity="0.12"
                  stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Верхнетреугольный паттерн -->
            <g transform="translate(15, 15)">
                <!-- Строка 1: четыре -->
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.8"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#06B6D4" opacity="0.75"/>

                <!-- Строка 2: три -->
                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.8"/>

                <!-- Строка 3: две -->
                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.85"/>

                <!-- Строка 4: одна -->
                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#06B6D4" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#0891B2">верхняя ⬤</text>
        </g>

        <!-- Стрелка вниз к алгоритму -->
        <g transform="translate(400, 175)">
            <line x1="0" y1="0" x2="0" y2="20"
                  stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
            <polygon points="-6,20 0,30 6,20" fill="#7C3AED"/>
        </g>
    </g>

    <!-- ЛЕВАЯ ПАНЕЛЬ: что даёт -->
    <g transform="translate(30, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="1">ЧТО ДАЁТ LU</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">• Решение СЛАУ за 2 шага:</text>
            <text x="30" y="68" font-family="ui-monospace, monospace"
                  font-weight="700" fill="#7C3AED">L·y = b → U·x = y</text>

            <text x="20" y="90">• Быстрое решение для многих b</text>
            <text x="20" y="108">• Основа для обратной матрицы и det</text>
        </g>
    </g>

    <!-- ПРАВАЯ ПАНЕЛЬ: шаги -->
    <g transform="translate(410, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#0891B2"
              letter-spacing="1">АЛГОРИТМ</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">1. Метод Гаусса → L и U</text>
            <text x="20" y="70">2. Прямой ход: решаем L·y = b</text>
            <text x="20" y="90">3. Обратный ход: решаем U·x = y</text>
            <text x="20" y="110">4. Сложность: O(n³) — один раз</text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 525)">
        <rect x="0" y="0" width="740" height="24" rx="12"
              fill="#7C3AED" fill-opacity="0.08"/>

        <text x="370" y="16" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" font-weight="700" fill="#7C3AED">
            L·y = b (прямой) → U·x = y (обратный) — быстрее, чем решать A·x = b напрямую
        </text>
    </g>
</svg>