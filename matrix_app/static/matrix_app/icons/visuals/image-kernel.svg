<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Ядро свёртки на изображении">
    <defs>
        <linearGradient id="ik-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#06B6D4" stop-opacity="0.05"/>
        </linearGradient>
        <linearGradient id="ik-kernel" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#CFFAFE" stop-opacity="0.9"/>
        </linearGradient>
        <filter id="ik-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="600" fill="url(#ik-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="30" width="400" height="56" rx="28"
          fill="#06B6D4" fill-opacity="0.12"
          stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="66" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#0E7490">
        Ядро свёртки изображения
    </text>

    <!-- ============================================================
         ИСХОДНОЕ ИЗОБРАЖЕНИЕ (сетка 5×5)
         ============================================================ -->
    <g transform="translate(60, 130)">
        <text x="105" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#7C3AED">
            Изображение (5 × 5 пикселей)
        </text>

        <!-- Фон сетки -->
        <rect x="0" y="0" width="210" height="210" rx="8"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.5"/>

        <!-- Ячейки: 5 столбцов × 5 строк, каждая 38×38, шаг 42, отступ 10 -->
        <g>
            <!-- Строка 1 -->
            <rect x="10"  y="10" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.15"/>
            <rect x="52"  y="10" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.20"/>
            <rect x="94"  y="10" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <rect x="136" y="10" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.25"/>
            <rect x="178" y="10" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.15"/>
            <!-- Строка 2 -->
            <rect x="10"  y="52" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <rect x="52"  y="52" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.55"/>
            <rect x="94"  y="52" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.75"/>
            <rect x="136" y="52" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.55"/>
            <rect x="178" y="52" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <!-- Строка 3 -->
            <rect x="10"  y="94" width="38" height="38" rx="4" fill="#8B5CF6" opacity="0.40"/>
            <rect x="52"  y="94" width="38" height="38" rx="4" fill="#8B5CF6" opacity="0.75"/>
            <rect x="94"  y="94" width="38" height="38" rx="4" fill="#8B5CF6" opacity="0.95"/>
            <rect x="136" y="94" width="38" height="38" rx="4" fill="#8B5CF6" opacity="0.75"/>
            <rect x="178" y="94" width="38" height="38" rx="4" fill="#8B5CF6" opacity="0.40"/>
            <!-- Строка 4 -->
            <rect x="10"  y="136" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <rect x="52"  y="136" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.55"/>
            <rect x="94"  y="136" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.75"/>
            <rect x="136" y="136" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.55"/>
            <rect x="178" y="136" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <!-- Строка 5 -->
            <rect x="10"  y="178" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.15"/>
            <rect x="52"  y="178" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.20"/>
            <rect x="94"  y="178" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.30"/>
            <rect x="136" y="178" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.25"/>
            <rect x="178" y="178" width="38" height="38" rx="4" fill="#A78BFA" opacity="0.15"/>
        </g>

        <!-- Движущееся окно 3×3 (охватывает 3 ячейки: от x=10 до x=94+38=132, шаг = 42) -->
        <!-- Позиции верхнего левого угла окна: 10, 52, 94 (по X и Y) -->
        <!-- Размер окна: 3×38 + 2×4 = 122 (от 10 до 132) -->
        <g>
            <!-- Заливка -->
            <rect x="10" y="10" width="122" height="122" rx="6"
                  fill="#EC4899" fill-opacity="0.10">
                <animate attributeName="x"
                         values="10;52;94;94;94;52;10;10;10"
                         dur="6s" repeatCount="indefinite"/>
                <animate attributeName="y"
                         values="10;10;10;52;94;94;94;52;10"
                         dur="6s" repeatCount="indefinite"/>
            </rect>

            <!-- Обводка -->
            <rect x="10" y="10" width="122" height="122" rx="6"
                  fill="none" stroke="#EC4899" stroke-width="2.5"
                  filter="url(#ik-glow)">
                <animate attributeName="x"
                         values="10;52;94;94;94;52;10;10;10"
                         dur="6s" repeatCount="indefinite"/>
                <animate attributeName="y"
                         values="10;10;10;52;94;94;94;52;10"
                         dur="6s" repeatCount="indefinite"/>
            </rect>
        </g>
    </g>

    <!-- ============================================================
         СТРЕЛКА → (сетка → ядро)
         ============================================================ -->
    <g>
        <line x1="290" y1="235" x2="340" y2="235"
              stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
        <polygon points="340,228 354,235 340,242" fill="#06B6D4"/>
        <circle r="4" fill="#06B6D4">
            <animateMotion dur="1.6s" repeatCount="indefinite"
                           path="M 290,235 L 350,235"/>
        </circle>
    </g>

    <!-- ============================================================
         ЯДРО 3×3
         ============================================================ -->
    <g transform="translate(380, 130)">
        <text x="60" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#0E7490">
            Ядро (3 × 3)
        </text>

        <!-- Фон -->
        <rect x="0" y="0" width="120" height="120" rx="10"
              fill="url(#ik-kernel)"
              stroke="#06B6D4" stroke-width="2"
              filter="url(#ik-glow)"/>

        <!-- Ячейки 3×3 — визуально с рамкой -->
        <g font-family="ui-monospace, monospace" font-size="15"
           font-weight="700" text-anchor="middle">

            <!-- Рамки ячеек -->
            <rect x="14" y="14" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.8"/>
            <rect x="46" y="14" width="28" height="28" rx="4" fill="#FCE7F3" opacity="0.9"/>
            <rect x="78" y="14" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.8"/>

            <rect x="14" y="46" width="28" height="28" rx="4" fill="#FCE7F3" opacity="0.9"/>
            <rect x="46" y="46" width="28" height="28" rx="4" fill="#EDE9FE"/>
            <rect x="78" y="46" width="28" height="28" rx="4" fill="#FCE7F3" opacity="0.9"/>

            <rect x="14" y="78" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.8"/>
            <rect x="46" y="78" width="28" height="28" rx="4" fill="#FCE7F3" opacity="0.9"/>
            <rect x="78" y="78" width="28" height="28" rx="4" fill="#FFFFFF" opacity="0.8"/>

            <!-- Значения -->
            <text x="28" y="34" fill="#0E7490">0</text>
            <text x="60" y="34" fill="#EC4899">−1</text>
            <text x="92" y="34" fill="#0E7490">0</text>

            <text x="28" y="66" fill="#EC4899">−1</text>
            <text x="60" y="66" fill="#7C3AED" font-size="17">5</text>
            <text x="92" y="66" fill="#EC4899">−1</text>

            <text x="28" y="98" fill="#0E7490">0</text>
            <text x="60" y="98" fill="#EC4899">−1</text>
            <text x="92" y="98" fill="#0E7490">0</text>
        </g>

        <text x="60" y="145" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            повышение резкости
        </text>
    </g>

    <!-- ============================================================
         СТРЕЛКА → (ядро → результат)
         ============================================================ -->
    <g>
        <line x1="560" y1="235" x2="610" y2="235"
              stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
        <polygon points="610,228 624,235 610,242" fill="#EC4899"/>
        <circle r="4" fill="#EC4899">
            <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"
                           path="M 560,235 L 620,235"/>
        </circle>
    </g>

    <!-- ============================================================
         РЕЗУЛЬТАТ (один пиксель)
         ============================================================ -->
    <g transform="translate(650, 130)">
        <text x="60" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#BE185D">
            Новый пиксель
        </text>

        <rect x="0" y="0" width="120" height="120" rx="10"
              fill="#FFFFFF" fill-opacity="0.95"
              stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"
              filter="url(#ik-glow)"/>

        <text x="60" y="58" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="26" font-weight="800" fill="#EC4899">
            P'[i][j]
        </text>
        <text x="60" y="84" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            одно число
        </text>
    </g>

    <!-- ============================================================
         ФОРМУЛА СВЁРТКИ
         ============================================================ -->
    <g transform="translate(140, 410)">
        <rect x="0" y="0" width="520" height="110" rx="16"
              fill="#FFFFFF" fill-opacity="0.92"
              stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"
              filter="url(#ik-glow)"/>

        <text x="260" y="30" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="13" font-weight="800" fill="#0E7490"
              letter-spacing="1.5">ФОРМУЛА СВЁРТКИ</text>

        <text x="260" y="62" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="17" font-weight="700" fill="#7C3AED">
            P'[i][j] = Σ P[i+k][j+l] · K[k][l]
        </text>

        <text x="260" y="90" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            Сумма по всем k, l ∈ {−1, 0, +1}
        </text>
    </g>

    <!-- Нижняя плашка -->
    <text x="400" y="565" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="12" font-weight="600" fill="#6B7280">
        Каждый пиксель заменяется взвешенной суммой соседей по ядру
    </text>
</svg>