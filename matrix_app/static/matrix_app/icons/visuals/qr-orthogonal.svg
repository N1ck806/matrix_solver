<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="QR-разложение: A = Q · R">
    <defs>
        <linearGradient id="qr-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#10B981" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="qr-A" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <linearGradient id="qr-Q" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="qr-R" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#10B981"/>
            <stop offset="1" stop-color="#059669"/>
        </linearGradient>
        <filter id="qr-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="560" fill="url(#qr-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="20" width="400" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        QR-разложение: A = Q · R
    </text>

    <text x="400" y="92" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="11" fill="#6B7280">
        Q — ортогональная · R — верхнетреугольная
    </text>

    <!-- РАЗЛОЖЕНИЕ -->
    <g transform="translate(70, 130)">

        <!-- A -->
        <g transform="translate(0, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#BE185D"
                  letter-spacing="0.8">A</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#EC4899" fill-opacity="0.12"
                  stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>

            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.8"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#EC4899" opacity="0.5"/>

                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>

                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>

                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.5"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.7"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#EC4899" opacity="0.9"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#BE185D">m × n</text>
        </g>

        <!-- = -->
        <text x="145" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="26" font-weight="800" fill="#7C3AED">=</text>

        <!-- Q -->
        <g transform="translate(180, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">Q</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#7C3AED" fill-opacity="0.12"
                  stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Ортогональные столбцы: каждый столбец выделен -->
            <g transform="translate(15, 15)">
                <!-- Столбец 1 (главный) -->
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#7C3AED" opacity="0.9"/>
                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.85"/>
                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.8"/>
                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#7C3AED" opacity="0.75"/>

                <!-- Столбец 2 -->
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#A78BFA" opacity="0.9"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#A78BFA" opacity="0.7"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#A78BFA" opacity="0.9"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#A78BFA" opacity="0.7"/>

                <!-- Столбец 3 -->
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#C4B5FD" opacity="0.9"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#C4B5FD" opacity="0.8"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#C4B5FD" opacity="0.7"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#C4B5FD" opacity="0.9"/>

                <!-- Столбец 4 -->
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#DDD6FE" opacity="0.9"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#DDD6FE" opacity="0.7"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#DDD6FE" opacity="0.8"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#DDD6FE" opacity="0.9"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#7C3AED">Qᵀ·Q = I · орт.</text>
        </g>

        <!-- · -->
        <text x="325" y="80" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="20" font-weight="800" fill="#7C3AED">·</text>

        <!-- R -->
        <g transform="translate(345, 0)">
            <text x="60" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#059669"
                  letter-spacing="0.8">R</text>

            <rect x="0" y="0" width="120" height="140" rx="10"
                  fill="#10B981" fill-opacity="0.12"
                  stroke="#10B981" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Верхнетреугольный паттерн -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="24" y="0"  width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>
                <rect x="48" y="0"  width="20" height="25" rx="3" fill="#10B981" opacity="0.8"/>
                <rect x="72" y="0"  width="20" height="25" rx="3" fill="#10B981" opacity="0.75"/>

                <rect x="0"  y="29" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="29" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="48" y="29" width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>
                <rect x="72" y="29" width="20" height="25" rx="3" fill="#10B981" opacity="0.8"/>

                <rect x="0"  y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="58" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="58" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
                <rect x="72" y="58" width="20" height="25" rx="3" fill="#10B981" opacity="0.85"/>

                <rect x="0"  y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="24" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="48" y="87" width="20" height="25" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="72" y="87" width="20" height="25" rx="3" fill="#10B981" opacity="0.95"/>
            </g>

            <text x="60" y="158" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#059669">верхняя ⬤</text>
        </g>
    </g>

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <g transform="translate(30, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="1">ЧТО ДАЁТ QR</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">• Численно устойчивое решение СЛАУ</text>
            <text x="20" y="72">• Ортогонализация Грама-Шмидта → Q</text>
            <text x="20" y="94">• Основа для поиска собственных значений</text>
            <text x="20" y="116">• QR-алгоритм: Aₖ = Qₖ·Rₖ</text>
        </g>
    </g>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <g transform="translate(410, 380)">

        <rect x="0" y="0" width="360" height="130" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#059669"
              letter-spacing="1">СВОЙСТВА Q</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="52">• Столбцы Q — ортонормированы</text>
            <text x="20" y="76" font-family="ui-monospace, monospace"
                  font-weight="700" fill="#7C3AED">Qᵀ · Q = I</text>
            <text x="20" y="100">• Q — сохраняет длины: ||Q·x|| = ||x||</text>
            <text x="20" y="120">• R — верхнетреугольная</text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 525)">
        <rect x="0" y="0" width="740" height="24" rx="12"
              fill="#10B981" fill-opacity="0.08"/>

        <text x="370" y="16" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" font-weight="700" fill="#059669">
            Q — ортогональна: Qᵀ·Q = I. Численно устойчивее, чем LU, для плохо обусловленных матриц
        </text>
    </g>
</svg>