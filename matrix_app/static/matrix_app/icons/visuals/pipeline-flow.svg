<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Схема потоков: вход, обработка, выход">
    <defs>
        <linearGradient id="pf-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="pf-node" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#EDE9FE" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="pf-node-active" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#A78BFA"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="pf-arrow" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <filter id="pf-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="pf-arrow-head" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/>
        </marker>
    </defs>

    <rect width="800" height="600" fill="url(#pf-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="40" width="400" height="60" rx="30"
          fill="#8B5CF6" fill-opacity="0.12"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="78" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="24" font-weight="800" fill="#7C3AED">
        Поток данных
    </text>

    <!-- Узлы -->
    <g>
        <!-- Вход -->
        <rect x="60" y="240" width="140" height="120" rx="16"
              fill="url(#pf-node)" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="130" y="290" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#7C3AED">ВХОД</text>
        <text x="130" y="315" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="13" fill="#6B7280">x₀</text>

        <!-- Обработка 1 (активная) -->
        <rect x="250" y="240" width="140" height="120" rx="16"
              fill="url(#pf-node-active)" filter="url(#pf-glow)"/>
        <text x="320" y="290" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#FFFFFF">ОБРАБОТКА</text>
        <text x="320" y="315" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="13" fill="#FFFFFF" fill-opacity="0.9">A·x</text>

        <!-- Обработка 2 -->
        <rect x="440" y="240" width="140" height="120" rx="16"
              fill="url(#pf-node)" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.5"/>
        <text x="510" y="290" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#0891B2">ОБРАБОТКА</text>
        <text x="510" y="315" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="13" fill="#6B7280">B·y</text>

        <!-- Выход -->
        <rect x="630" y="240" width="140" height="120" rx="16"
              fill="url(#pf-node)" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1.5"/>
        <text x="700" y="290" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="700" fill="#0891B2">ВЫХОД</text>
        <text x="700" y="315" text-anchor="middle"
              font-family="ui-monospace, monospace"
              font-size="13" fill="#6B7280">z</text>
    </g>

    <!-- Стрелки с анимацией -->
    <g stroke="url(#pf-arrow)" stroke-width="2.5" fill="none"
       marker-end="url(#pf-arrow-head)" stroke-linecap="round">
        <line x1="200" y1="300" x2="245" y2="300">
            <animate attributeName="x2" values="245;240;245" dur="1.8s" repeatCount="indefinite"/>
        </line>
        <line x1="390" y1="300" x2="435" y2="300">
            <animate attributeName="x2" values="435;430;435" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
        </line>
        <line x1="580" y1="300" x2="625" y2="300">
            <animate attributeName="x2" values="625;620;625" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
        </line>
    </g>

    <!-- Вектор состояния под узлами -->
    <g>
        <text x="400" y="440" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="600" fill="#6B7280">
            Состояние системы: xₜ₊₁ = P · xₜ
        </text>

        <!-- Столбики состояния -->
        <g transform="translate(320, 470)">
            <rect x="0" y="40" width="16" height="20" rx="3" fill="#A78BFA" opacity="0.7">
                <animate attributeName="height" values="20;28;20" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="y" values="40;32;40" dur="2s" repeatCount="indefinite"/>
            </rect>
            <rect x="24" y="30" width="16" height="30" rx="3" fill="#8B5CF6" opacity="0.8">
                <animate attributeName="height" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
                <animate attributeName="y" values="30;20;30" dur="2.4s" repeatCount="indefinite"/>
            </rect>
            <rect x="48" y="22" width="16" height="38" rx="3" fill="#7C3AED">
                <animate attributeName="height" values="38;48;38" dur="2.8s" repeatCount="indefinite"/>
                <animate attributeName="y" values="22;12;22" dur="2.8s" repeatCount="indefinite"/>
            </rect>
            <rect x="72" y="30" width="16" height="30" rx="3" fill="#8B5CF6" opacity="0.8">
                <animate attributeName="height" values="30;40;30" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
                <animate attributeName="y" values="30;20;30" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
            </rect>
            <rect x="96" y="40" width="16" height="20" rx="3" fill="#A78BFA" opacity="0.7">
                <animate attributeName="height" values="20;28;20" dur="2s" begin="0.8s" repeatCount="indefinite"/>
                <animate attributeName="y" values="40;32;40" dur="2s" begin="0.8s" repeatCount="indefinite"/>
            </rect>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <rect x="100" y="540" width="600" height="44" rx="22"
          fill="#8B5CF6" fill-opacity="0.08"
          stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="400" y="568" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="13" font-weight="600" fill="#7C3AED">
        Каждый узел преобразует входной вектор по матричному закону
    </text>
</svg>