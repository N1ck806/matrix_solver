<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Семантическая близость текстов: LSA">
    <defs>
        <linearGradient id="kl-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#EC4899" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="kl-doc1" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#EDE9FE" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="kl-doc2" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
            <stop offset="1" stop-color="#FCE7F3" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="kl-axis" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <filter id="kl-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="kl-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
        </marker>
    </defs>

    <rect width="800" height="560" fill="url(#kl-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        LSA: семантическая близость текстов
    </text>

    <!-- ЛЕВАЯ ЧАСТЬ: два текста -->
    <g transform="translate(30, 100)">

        <rect x="0" y="0" width="280" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="140" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">КОРПУС ТЕКСТОВ</text>

        <!-- Текст 1 -->
        <g transform="translate(20, 50)">
            <rect x="0" y="0" width="240" height="80" rx="10"
                  fill="url(#kl-doc1)"
                  stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="12" y="20" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#7C3AED">
                Документ 1
            </text>
            <text x="12" y="40" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                «Кимчи — традиционное
            </text>
            <text x="12" y="56" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                корейское блюдо. Готовится
            </text>
            <text x="12" y="72" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                из капусты и специй.»
            </text>
        </g>

        <!-- Текст 2 -->
        <g transform="translate(20, 145)">
            <rect x="0" y="0" width="240" height="80" rx="10"
                  fill="url(#kl-doc2)"
                  stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="12" y="20" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#BE185D">
                Документ 2
            </text>
            <text x="12" y="40" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                «Рецепт кимчи: пекинская
            </text>
            <text x="12" y="56" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                капуста, соль, чеснок,
            </text>
            <text x="12" y="72" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                перец чили.»
            </text>
        </g>

        <!-- Текст 3 -->
        <g transform="translate(20, 240)">
            <rect x="0" y="0" width="240" height="80" rx="10"
                  fill="url(#kl-doc1)"
                  stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.2"/>
            <text x="12" y="20" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#7C3AED">
                Документ 3
            </text>
            <text x="12" y="40" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                «В Корее едят кимчи
            </text>
            <text x="12" y="56" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                каждый день. Блюдо
            </text>
            <text x="12" y="72" font-family="system-ui, sans-serif"
                  font-size="11" fill="#4B5563">
                богато витаминами.»
            </text>
        </g>

        <text x="140" y="360" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" fill="#6B7280">
            TF-IDF: редкие слова важнее частых
        </text>
    </g>

    <!-- СТРЕЛКА → -->
    <g transform="translate(320, 290)">
        <line x1="0" y1="0" x2="28" y2="0"
              stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,-6 42,0 28,6" fill="#7C3AED"/>
        <text x="14" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED">SVD</text>
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: семантическое пространство + матрица -->
    <g transform="translate(380, 100)">

        <rect x="0" y="0" width="390" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="195" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#7C3AED"
              letter-spacing="1">СЕМАНТИЧЕСКОЕ ПРОСТРАНСТВО</text>

        <!-- Область с точками -->
        <g transform="translate(50, 50)">
            <!-- Оси -->
            <g stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
                <line x1="0" y1="180" x2="280" y2="180"/>
                <line x1="140" y1="0" x2="140" y2="180"/>
            </g>

            <!-- Главные оси -->
            <line x1="30" y1="150" x2="250" y2="30"
                  stroke="url(#kl-axis)" stroke-width="3" stroke-linecap="round"
                  filter="url(#kl-glow)"/>
            <text x="258" y="30" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#8B5CF6">PC1</text>

            <line x1="90" y1="20" x2="180" y2="160"
                  stroke="#22D3EE" stroke-width="2" stroke-linecap="round"
                  stroke-dasharray="5 4" opacity="0.7"/>
            <text x="186" y="172" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="800" fill="#0891B2">PC2</text>

            <!-- Тексты как точки -->
            <g filter="url(#kl-glow)">
                <circle cx="60" cy="140" r="10" fill="#8B5CF6"/>
                <circle cx="100" cy="120" r="10" fill="#EC4899"/>
                <circle cx="170" cy="80" r="10" fill="#7C3AED"/>
                <circle cx="220" cy="50" r="8" fill="#A78BFA" opacity="0.7"/>
                <circle cx="40" cy="110" r="6" fill="#C4B5FD" opacity="0.6"/>
            </g>

            <!-- Метки -->
            <g font-family="ui-monospace, monospace" font-size="10"
               font-weight="800" text-anchor="middle">
                <text x="60"  y="162" fill="#7C3AED">D1</text>
                <text x="100" y="142" fill="#BE185D">D2</text>
                <text x="170" y="102" fill="#7C3AED">D3</text>
            </g>

            <!-- Расстояния -->
            <g stroke="#EC4899" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5">
                <line x1="60" y1="140" x2="100" y2="120"/>
                <line x1="100" y1="120" x2="170" y2="80"/>
            </g>
            <text x="80" y="125" font-family="system-ui, sans-serif"
                  font-size="9" font-weight="700" fill="#BE185D" text-anchor="middle">0.72</text>
            <text x="135" y="95" font-family="system-ui, sans-serif"
                  font-size="9" font-weight="700" fill="#BE185D" text-anchor="middle">0.65</text>
        </g>

        <!-- Разделитель -->
        <line x1="25" y1="270" x2="365" y2="270"
              stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="1"
              stroke-dasharray="3 3"/>

        <!-- Матрица близости 3×3 -->
        <text x="195" y="292" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="0.8">МАТРИЦА БЛИЗОСТИ (3 × 3)</text>

        <g transform="translate(120, 305)">
            <!-- Заголовки -->
            <g font-family="ui-monospace, monospace" font-size="9"
               font-weight="800" fill="#6B7280" text-anchor="middle">
                <text x="30" y="-4">D1</text>
                <text x="70" y="-4">D2</text>
                <text x="110" y="-4">D3</text>
            </g>
            <g font-family="ui-monospace, monospace" font-size="9"
               font-weight="800" fill="#6B7280" text-anchor="end">
                <text x="-6" y="24">D1</text>
                <text x="-6" y="56">D2</text>
                <text x="-6" y="88">D3</text>
            </g>

            <!-- Ячейки 3×3 -->
            <rect x="0"  y="0"  width="34" height="28" rx="5" fill="#7C3AED" opacity="0.95"/>
            <rect x="40" y="0"  width="34" height="28" rx="5" fill="#EC4899" opacity="0.72"/>
            <rect x="80" y="0"  width="34" height="28" rx="5" fill="#8B5CF6" opacity="0.65"/>

            <rect x="0"  y="32" width="34" height="28" rx="5" fill="#EC4899" opacity="0.72"/>
            <rect x="40" y="32" width="34" height="28" rx="5" fill="#7C3AED" opacity="0.95"/>
            <rect x="80" y="32" width="34" height="28" rx="5" fill="#8B5CF6" opacity="0.45"/>

            <rect x="0"  y="64" width="34" height="28" rx="5" fill="#8B5CF6" opacity="0.65"/>
            <rect x="40" y="64" width="34" height="28" rx="5" fill="#8B5CF6" opacity="0.45"/>
            <rect x="80" y="64" width="34" height="28" rx="5" fill="#7C3AED" opacity="0.95"/>

            <!-- Значения -->
            <g font-family="ui-monospace, monospace" font-size="10"
               font-weight="800" text-anchor="middle">
                <text x="17" y="20" fill="#FFFFFF">1.00</text>
                <text x="57" y="20" fill="#FFFFFF">0.72</text>
                <text x="97" y="20" fill="#FFFFFF">0.65</text>

                <text x="17" y="52" fill="#FFFFFF">0.72</text>
                <text x="57" y="52" fill="#FFFFFF">1.00</text>
                <text x="97" y="52" fill="#FFFFFF">0.45</text>

                <text x="17" y="84" fill="#FFFFFF">0.65</text>
                <text x="57" y="84" fill="#FFFFFF">0.45</text>
                <text x="97" y="84" fill="#FFFFFF">1.00</text>
            </g>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 500)">
        <rect x="0" y="0" width="740" height="40" rx="12"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="370" y="26" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            SVD матрицы «слово × документ» → семантические оси. Близкие тексты → высокое косинусное сходство.
        </text>
    </g>
</svg>