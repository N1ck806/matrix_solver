<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Диагонализация: A = P · D · P⁻¹">
    <defs>
        <linearGradient id="dg-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#EC4899" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="dg-A" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <linearGradient id="dg-P" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="dg-D" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="dg-Pi" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#0891B2"/>
        </linearGradient>
        <filter id="dg-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="560" fill="url(#dg-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#8B5CF6" fill-opacity="0.10"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#7C3AED">
        Диагонализация: A = P · D · P⁻¹
    </text>

    <text x="400" y="92" text-anchor="middle"
          font-family="system-ui, sans-serif"
          font-size="11" fill="#6B7280">
        P — собственные векторы · D — собственные значения на диагонали
    </text>

    <!-- РАЗЛОЖЕНИЕ -->
    <g transform="translate(55, 130)">

        <!-- A -->
        <g transform="translate(0, 0)">
            <text x="55" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#BE185D"
                  letter-spacing="0.8">A</text>

            <rect x="0" y="0" width="110" height="130" rx="10"
                  fill="#EC4899" fill-opacity="0.12"
                  stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Заполненный паттерн (не диагональный) -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="18" height="22" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="22" y="0"  width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="44" y="0"  width="18" height="22" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="66" y="0"  width="18" height="22" rx="3" fill="#EC4899" opacity="0.3"/>

                <rect x="0"  y="26" width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="22" y="26" width="18" height="22" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="44" y="26" width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="66" y="26" width="18" height="22" rx="3" fill="#EC4899" opacity="0.4"/>

                <rect x="0"  y="52" width="18" height="22" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="22" y="52" width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="44" y="52" width="18" height="22" rx="3" fill="#EC4899" opacity="0.9"/>
                <rect x="66" y="52" width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>

                <rect x="0"  y="78" width="18" height="22" rx="3" fill="#EC4899" opacity="0.3"/>
                <rect x="22" y="78" width="18" height="22" rx="3" fill="#EC4899" opacity="0.4"/>
                <rect x="44" y="78" width="18" height="22" rx="3" fill="#EC4899" opacity="0.6"/>
                <rect x="66" y="78" width="18" height="22" rx="3" fill="#EC4899" opacity="0.9"/>
            </g>

            <text x="55" y="148" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#BE185D">плотная</text>
        </g>

        <!-- = -->
        <text x="135" y="75" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="24" font-weight="800" fill="#7C3AED">=</text>

        <!-- P -->
        <g transform="translate(165, 0)">
            <text x="55" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">P</text>

            <rect x="0" y="0" width="110" height="130" rx="10"
                  fill="#7C3AED" fill-opacity="0.12"
                  stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Паттерн: собственные векторы в столбцах -->
            <g transform="translate(15, 15)">
                <!-- Столбец 1 — вектор v1 -->
                <rect x="0"  y="0"  width="18" height="22" rx="3" fill="#7C3AED" opacity="0.9"/>
                <rect x="0"  y="26" width="18" height="22" rx="3" fill="#7C3AED" opacity="0.8"/>
                <rect x="0"  y="52" width="18" height="22" rx="3" fill="#7C3AED" opacity="0.7"/>
                <rect x="0"  y="78" width="18" height="22" rx="3" fill="#7C3AED" opacity="0.6"/>

                <!-- Столбец 2 — вектор v2 -->
                <rect x="22" y="0"  width="18" height="22" rx="3" fill="#A78BFA" opacity="0.9"/>
                <rect x="22" y="26" width="18" height="22" rx="3" fill="#A78BFA" opacity="0.7"/>
                <rect x="22" y="52" width="18" height="22" rx="3" fill="#A78BFA" opacity="0.9"/>
                <rect x="22" y="78" width="18" height="22" rx="3" fill="#A78BFA" opacity="0.6"/>

                <!-- Столбец 3 -->
                <rect x="44" y="0"  width="18" height="22" rx="3" fill="#C4B5FD" opacity="0.9"/>
                <rect x="44" y="26" width="18" height="22" rx="3" fill="#C4B5FD" opacity="0.8"/>
                <rect x="44" y="52" width="18" height="22" rx="3" fill="#C4B5FD" opacity="0.7"/>
                <rect x="44" y="78" width="18" height="22" rx="3" fill="#C4B5FD" opacity="0.9"/>

                <!-- Столбец 4 -->
                <rect x="66" y="0"  width="18" height="22" rx="3" fill="#DDD6FE" opacity="0.9"/>
                <rect x="66" y="26" width="18" height="22" rx="3" fill="#DDD6FE" opacity="0.7"/>
                <rect x="66" y="52" width="18" height="22" rx="3" fill="#DDD6FE" opacity="0.8"/>
                <rect x="66" y="78" width="18" height="22" rx="3" fill="#DDD6FE" opacity="0.9"/>
            </g>

            <text x="55" y="148" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#7C3AED">v₁ v₂ v₃ v₄</text>
        </g>

        <!-- · -->
        <text x="295" y="75" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="18" font-weight="800" fill="#7C3AED">·</text>

        <!-- D -->
        <g transform="translate(310, 0)">
            <text x="55" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#D97706"
                  letter-spacing="0.8">D</text>

            <rect x="0" y="0" width="110" height="130" rx="10"
                  fill="#F59E0B" fill-opacity="0.12"
                  stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Диагональный паттерн -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="18" height="22" rx="3" fill="#F59E0B" opacity="0.95"/>
                <rect x="22" y="0"  width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="44" y="0"  width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="66" y="0"  width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="26" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="22" y="26" width="18" height="22" rx="3" fill="#F59E0B" opacity="0.95"/>
                <rect x="44" y="26" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="66" y="26" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="52" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="22" y="52" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="44" y="52" width="18" height="22" rx="3" fill="#F59E0B" opacity="0.95"/>
                <rect x="66" y="52" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>

                <rect x="0"  y="78" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="22" y="78" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="44" y="78" width="18" height="22" rx="3" fill="#F3F4F6" opacity="0.35"/>
                <rect x="66" y="78" width="18" height="22" rx="3" fill="#F59E0B" opacity="0.95"/>
            </g>

            <text x="55" y="148" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#D97706">λ₁ λ₂ λ₃ λ₄</text>
        </g>

        <!-- · -->
        <text x="440" y="75" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="18" font-weight="800" fill="#7C3AED">·</text>

        <!-- P⁻¹ -->
        <g transform="translate(455, 0)">
            <text x="55" y="-10" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="12" font-weight="800" fill="#0891B2"
                  letter-spacing="0.8">P⁻¹</text>

            <rect x="0" y="0" width="110" height="130" rx="10"
                  fill="#06B6D4" fill-opacity="0.12"
                  stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.5"/>

            <!-- Обратный паттерн -->
            <g transform="translate(15, 15)">
                <rect x="0"  y="0"  width="18" height="22" rx="3" fill="#06B6D4" opacity="0.75"/>
                <rect x="22" y="0"  width="18" height="22" rx="3" fill="#22D3EE" opacity="0.6"/>
                <rect x="44" y="0"  width="18" height="22" rx="3" fill="#67E8F9" opacity="0.5"/>
                <rect x="66" y="0"  width="18" height="22" rx="3" fill="#A5F3FC" opacity="0.4"/>

                <rect x="0"  y="26" width="18" height="22" rx="3" fill="#67E8F9" opacity="0.5"/>
                <rect x="22" y="26" width="18" height="22" rx="3" fill="#06B6D4" opacity="0.75"/>
                <rect x="44" y="26" width="18" height="22" rx="3" fill="#22D3EE" opacity="0.6"/>
                <rect x="66" y="26" width="18" height="22" rx="3" fill="#67E8F9" opacity="0.5"/>

                <rect x="0"  y="52" width="18" height="22" rx="3" fill="#A5F3FC" opacity="0.4"/>
                <rect x="22" y="52" width="18" height="22" rx="3" fill="#67E8F9" opacity="0.5"/>
                <rect x="44" y="52" width="18" height="22" rx="3" fill="#06B6D4" opacity="0.75"/>
                <rect x="66" y="52" width="18" height="22" rx="3" fill="#22D3EE" opacity="0.6"/>

                <rect x="0"  y="78" width="18" height="22" rx="3" fill="#CFFAFE" opacity="0.35"/>
                <rect x="22" y="78" width="18" height="22" rx="3" fill="#A5F3FC" opacity="0.4"/>
                <rect x="44" y="78" width="18" height="22" rx="3" fill="#67E8F9" opacity="0.5"/>
                <rect x="66" y="78" width="18" height="22" rx="3" fill="#06B6D4" opacity="0.75"/>
            </g>

            <text x="55" y="148" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="10" fill="#0891B2">обратная</text>
        </g>
    </g>

    <!-- ============================================================
         ЛЕВАЯ ПАНЕЛЬ
         ============================================================ -->
    <g transform="translate(30, 320)">

        <rect x="0" y="0" width="360" height="190" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#7C3AED"
              letter-spacing="1">ЧТО ЭТО ЗНАЧИТ</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">A — сложная матрица (плотная)</text>
            <text x="20" y="72">P — столбцы = собственные векторы</text>
            <text x="20" y="94">D — диагональ = собственные значения</text>
            <text x="20" y="116">P⁻¹ — обратная к P</text>

            <text x="20" y="144" font-family="ui-monospace, monospace"
                  font-weight="800" fill="#7C3AED" font-size="12">
                A · vᵢ = λᵢ · vᵢ
            </text>
            <text x="20" y="166" font-family="system-ui, sans-serif"
                  font-size="10.5" fill="#6B7280">
                D — простейшая форма A
            </text>
        </g>
    </g>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <g transform="translate(410, 320)">

        <rect x="0" y="0" width="360" height="190" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="180" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" font-weight="800" fill="#0891B2"
              letter-spacing="1">КОГДА ВОЗМОЖНО</text>

        <g font-family="system-ui, sans-serif" font-size="10.5" fill="#4B5563">
            <text x="20" y="50">• Все n собственных векторов линейно</text>
            <text x="30" y="68">независимы (полный набор)</text>

            <text x="20" y="96">• Матрица симметрична → всегда</text>
            <text x="30" y="114">диагонализируема (спектральная теорема)</text>

            <text x="20" y="142">• Дефектные матрицы (λ кратные, векторов</text>
            <text x="30" y="160">не хватает) → форма Жордана</text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 525)">
        <rect x="0" y="0" width="740" height="24" rx="12"
              fill="#7C3AED" fill-opacity="0.08"/>

        <text x="370" y="16" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10.5" font-weight="700" fill="#7C3AED">
            Диагонализация: A = P·D·P⁻¹ → Aⁿ = P·Dⁿ·P⁻¹ — степень матрицы вычисляется мгновенно
        </text>
    </g>
</svg>