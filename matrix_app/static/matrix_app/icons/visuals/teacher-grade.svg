<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="Матрица оценивания: ученики × задания">
    <defs>
        <linearGradient id="tg-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#06B6D4" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="tg-hi" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#10B981"/>
            <stop offset="1" stop-color="#059669"/>
        </linearGradient>
        <linearGradient id="tg-mid" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#F59E0B"/>
            <stop offset="1" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="tg-lo" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#BE185D"/>
        </linearGradient>
        <filter id="tg-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <rect width="800" height="560" fill="url(#tg-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="180" y="20" width="440" height="52" rx="26"
          fill="#06B6D4" fill-opacity="0.10"
          stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="52" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="20" font-weight="800" fill="#0891B2">
        Критериальное оценивание: S · w = G
    </text>

    <!-- ЛЕВАЯ ЧАСТЬ: матрица баллов -->
    <g transform="translate(30, 100)">

        <rect x="0" y="0" width="440" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="220" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#0891B2"
              letter-spacing="1">МАТРИЦА БАЛЛОВ S (5 × 4)</text>

        <!-- Заголовки заданий -->
        <g font-family="system-ui, sans-serif" font-size="10"
           font-weight="800" fill="#0891B2" text-anchor="middle">
            <text x="200" y="56">Задание 1</text>
            <text x="255" y="56">Задание 2</text>
            <text x="310" y="56">Задание 3</text>
            <text x="365" y="56">Задание 4</text>
        </g>

        <!-- Заголовки учеников -->
        <g font-family="system-ui, sans-serif" font-size="10"
           font-weight="800" fill="#7C3AED" text-anchor="end">
            <text x="170" y="90">Иванов</text>
            <text x="170" y="130">Петров</text>
            <text x="170" y="170">Сидоров</text>
            <text x="170" y="210">Кузнецова</text>
            <text x="170" y="250">Смирнов</text>
        </g>

        <!-- Ячейки 5×4 (оценки 0-5) -->
        <g transform="translate(180, 66)">
            <!-- Иванов: 5, 4, 5, 4 -->
            <rect x="0"  y="0" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>
            <rect x="52" y="0" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>
            <rect x="104" y="0" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>
            <rect x="156" y="0" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>

            <!-- Петров: 3, 4, 2, 5 -->
            <rect x="0"  y="40" width="46" height="34" rx="5" fill="#F59E0B" opacity="0.65"/>
            <rect x="52" y="40" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>
            <rect x="104" y="40" width="46" height="34" rx="5" fill="#EC4899" opacity="0.5"/>
            <rect x="156" y="40" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>

            <!-- Сидоров: 2, 3, 4, 3 -->
            <rect x="0"  y="80" width="46" height="34" rx="5" fill="#EC4899" opacity="0.5"/>
            <rect x="52" y="80" width="46" height="34" rx="5" fill="#F59E0B" opacity="0.65"/>
            <rect x="104" y="80" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>
            <rect x="156" y="80" width="46" height="34" rx="5" fill="#F59E0B" opacity="0.65"/>

            <!-- Кузнецова: 5, 5, 4, 5 -->
            <rect x="0"  y="120" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>
            <rect x="52" y="120" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>
            <rect x="104" y="120" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>
            <rect x="156" y="120" width="46" height="34" rx="5" fill="#10B981" opacity="0.9"/>

            <!-- Смирнов: 4, 2, 3, 4 -->
            <rect x="0"  y="160" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>
            <rect x="52" y="160" width="46" height="34" rx="5" fill="#EC4899" opacity="0.5"/>
            <rect x="104" y="160" width="46" height="34" rx="5" fill="#F59E0B" opacity="0.65"/>
            <rect x="156" y="160" width="46" height="34" rx="5" fill="#10B981" opacity="0.7"/>

            <!-- Значения (баллы 0-5) -->
            <g font-family="ui-monospace, monospace" font-size="14"
               font-weight="800" text-anchor="middle" fill="#FFFFFF">
                <text x="23" y="22">5</text>
                <text x="75" y="22">4</text>
                <text x="127" y="22">5</text>
                <text x="179" y="22">4</text>

                <text x="23" y="62">3</text>
                <text x="75" y="62">4</text>
                <text x="127" y="62">2</text>
                <text x="179" y="62">5</text>

                <text x="23" y="102">2</text>
                <text x="75" y="102">3</text>
                <text x="127" y="102">4</text>
                <text x="179" y="102">3</text>

                <text x="23" y="142">5</text>
                <text x="75" y="142">5</text>
                <text x="127" y="142">4</text>
                <text x="179" y="142">5</text>

                <text x="23" y="182">4</text>
                <text x="75" y="182">2</text>
                <text x="127" y="182">3</text>
                <text x="179" y="182">4</text>
            </g>
        </g>

        <!-- Легенда цветов -->
        <g transform="translate(40, 270)" font-family="system-ui, sans-serif"
           font-size="10" fill="#6B7280">
            <rect x="0" y="-6" width="14" height="14" rx="3" fill="#10B981"/>
            <text x="22" y="6">отлично (4-5)</text>
            <rect x="120" y="-6" width="14" height="14" rx="3" fill="#F59E0B" opacity="0.7"/>
            <text x="142" y="6">хорошо (3)</text>
            <rect x="230" y="-6" width="14" height="14" rx="3" fill="#EC4899" opacity="0.5"/>
            <text x="252" y="6">слабо (1-2)</text>
        </g>

        <!-- Вектор w -->
        <g transform="translate(40, 295)">
            <rect x="0" y="0" width="360" height="60" rx="10"
                  fill="#7C3AED" fill-opacity="0.08"
                  stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.2"/>

            <text x="180" y="20" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="10" font-weight="800" fill="#7C3AED"
                  letter-spacing="0.8">ВЕСА ЗАДАНИЙ (Σw = 1)</text>

            <g transform="translate(30, 30)">
                <rect x="0"  y="0" width="60" height="22" rx="4" fill="#7C3AED" opacity="0.8"/>
                <text x="30" y="16" text-anchor="middle" font-family="ui-monospace, monospace"
                      font-size="11" font-weight="800" fill="#FFFFFF">0.30</text>

                <rect x="70" y="0" width="60" height="22" rx="4" fill="#7C3AED" opacity="0.7"/>
                <text x="100" y="16" text-anchor="middle" font-family="ui-monospace, monospace"
                      font-size="11" font-weight="800" fill="#FFFFFF">0.25</text>

                <rect x="140" y="0" width="60" height="22" rx="4" fill="#7C3AED" opacity="0.7"/>
                <text x="170" y="16" text-anchor="middle" font-family="ui-monospace, monospace"
                      font-size="11" font-weight="800" fill="#FFFFFF">0.25</text>

                <rect x="210" y="0" width="60" height="22" rx="4" fill="#7C3AED" opacity="0.6"/>
                <text x="240" y="16" text-anchor="middle" font-family="ui-monospace, monospace"
                      font-size="11" font-weight="800" fill="#FFFFFF">0.20</text>
            </g>
        </g>
    </g>

    <!-- СТРЕЛКА → -->
    <g transform="translate(485, 290)">
        <line x1="0" y1="0" x2="28" y2="0"
              stroke="#7C3AED" stroke-width="3" stroke-linecap="round"/>
        <polygon points="28,-6 42,0 28,6" fill="#7C3AED"/>
        <text x="14" y="-12" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="10" font-weight="800" fill="#7C3AED">S · w</text>
    </g>

    <!-- ПРАВАЯ ЧАСТЬ: итоговые оценки -->
    <g transform="translate(540, 100)">

        <rect x="0" y="0" width="230" height="380" rx="14"
              fill="#FFFFFF" fill-opacity="0.6"
              stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1.2"/>

        <text x="115" y="24" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="12" font-weight="800" fill="#0891B2"
              letter-spacing="1">ИТОГОВЫЕ ОЦЕНКИ G</text>

        <!-- Иванов -->
        <g transform="translate(20, 50)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#4B5563">Иванов</text>
            <rect x="70" y="4" width="120" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="70" y="4" width="108" height="14" rx="3" fill="#10B981"/>
            <text x="198" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#059669">4.50</text>
        </g>

        <!-- Петров -->
        <g transform="translate(20, 80)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#4B5563">Петров</text>
            <rect x="70" y="4" width="120" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="70" y="4" width="84" height="14" rx="3" fill="#F59E0B"/>
            <text x="198" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#D97706">3.50</text>
        </g>

        <!-- Сидоров -->
        <g transform="translate(20, 110)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#4B5563">Сидоров</text>
            <rect x="70" y="4" width="120" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="70" y="4" width="72" height="14" rx="3" fill="#F59E0B"/>
            <text x="198" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#D97706">3.00</text>
        </g>

        <!-- Кузнецова -->
        <g transform="translate(20, 140)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#4B5563">Кузнецова</text>
            <rect x="70" y="4" width="120" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="70" y="4" width="114" height="14" rx="3" fill="#10B981"/>
            <text x="198" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#059669">4.75</text>
        </g>

        <!-- Смирнов -->
        <g transform="translate(20, 170)">
            <text x="0" y="14" font-family="system-ui, sans-serif"
                  font-size="11" font-weight="700" fill="#4B5563">Смирнов</text>
            <rect x="70" y="4" width="120" height="14" rx="3" fill="#F3F4F6"/>
            <rect x="70" y="4" width="80" height="14" rx="3" fill="#F59E0B"/>
            <text x="198" y="15" font-family="ui-monospace, monospace"
                  font-size="11" font-weight="800" fill="#D97706">3.35</text>
        </g>

        <!-- Разделитель -->
        <line x1="20" y1="200" x2="210" y2="200"
              stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1"
              stroke-dasharray="3 3"/>

        <!-- Победитель -->
        <g transform="translate(20, 215)">
            <rect x="0" y="0" width="190" height="70" rx="10"
                  fill="#10B981" fill-opacity="0.10"
                  stroke="#10B981" stroke-opacity="0.5" stroke-width="1.3"
                  filter="url(#tg-glow)"/>
            <text x="95" y="22" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="10" font-weight="800" fill="#059669"
                  letter-spacing="0.8">ЛУЧШИЙ РЕЗУЛЬТАТ</text>
            <text x="95" y="45" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="16" font-weight="800" fill="#059669">
                Кузнецова
            </text>
            <text x="95" y="62" text-anchor="middle"
                  font-family="ui-monospace, monospace"
                  font-size="11" font-weight="700" fill="#059669">
                G = 4.75
            </text>
        </g>

        <!-- Пояснение формулы -->
        <g transform="translate(20, 305)">
            <text x="95" y="0" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="10.5" fill="#6B7280">
                G = S · w
            </text>
            <text x="95" y="16" text-anchor="middle"
                  font-family="system-ui, sans-serif"
                  font-size="10" fill="#6B7280">
                — матрица × вектор
            </text>
        </g>
    </g>

    <!-- Нижняя плашка -->
    <g transform="translate(30, 500)">
        <rect x="0" y="0" width="740" height="40" rx="12"
              fill="#FFFFFF" fill-opacity="0.9"
              stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.2"/>

        <text x="370" y="26" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            S — матрица баллов учеников × заданий · w — веса заданий · G = S · w — итоговые оценки
        </text>
    </g>
</svg>