<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none"
     role="img" aria-label="SVD-разложение: A = U · Σ · Vᵀ">
    <defs>
        <linearGradient id="sv-bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#EC4899" stop-opacity="0.06"/>
        </linearGradient>
        <linearGradient id="sv-U" x1="0" y1="0" x2="0" y2="1">
