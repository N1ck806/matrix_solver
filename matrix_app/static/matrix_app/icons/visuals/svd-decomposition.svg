            <text x="60" y="68">• Рекомендательные системы</text>

            <text x="290" y="52">• Сжатие изображений</text>
            <text x="290" y="68">• Обработка текстов (LSA)</text>

            <text x="510" y="52">• Шумоподавление</text>
            <text x="510" y="68">• Анализ данных</text>
