<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none"
     role="img" aria-label="Цепь Маркова: состояния и переходы">
    <defs>
        <linearGradient id="mc-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1" stop-opacity="0.06"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.06"/>
        </linearGradient>
        <radialGradient id="mc-s1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(180 320) scale(58)">
            <stop stop-color="#DDD6FE"/>
            <stop offset="1" stop-color="#7C3AED"/>
        </radialGradient>
        <radialGradient id="mc-s2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(400 320) scale(58)">
            <stop stop-color="#A5F3FC"/>
            <stop offset="1" stop-color="#0891B2"/>
        </radialGradient>
        <radialGradient id="mc-s3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(620 320) scale(58)">
            <stop stop-color="#FBCFE8"/>
            <stop offset="1" stop-color="#DB2777"/>
        </radialGradient>
        <linearGradient id="mc-arrow-grad" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#EC4899"/>
        </linearGradient>
        <filter id="mc-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <marker id="mc-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0,0 L10,5 L0,10 Z" fill="#8B5CF6"/>
        </marker>
    </defs>

    <rect width="800" height="600" fill="url(#mc-bg)" rx="24"/>

    <!-- Заголовок -->
    <rect x="200" y="30" width="400" height="56" rx="28"
          fill="#8B5CF6" fill-opacity="0.12"
          stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="400" y="66" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="22" font-weight="800" fill="#7C3AED">
        Марковская цепь
    </text>

    <!-- Переходы -->
    <g stroke="#8B5CF6" stroke-width="2.2" fill="none" opacity="0.7"
       stroke-linecap="round" marker-end="url(#mc-arrow)">

        <!-- S1 → S2 : верхняя дуга между кругами -->
        <path d="M 232 288 Q 290 230 348 288"/>

        <!-- S2 → S3 : верхняя дуга между кругами -->
        <path d="M 452 288 Q 510 230 568 288"/>

        <!-- S3 → S1 : нижняя широкая дуга (обход снизу) -->
        <path d="M 620 378 Q 400 480 180 378"/>
    </g>

    <!-- Петли (self-loops) — сверху каждого круга -->
    <g stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.65"
       stroke-linecap="round" marker-end="url(#mc-arrow)">
        <path d="M 140 268 Q 180 210 220 268"/>
        <path d="M 360 268 Q 400 210 440 268"/>
        <path d="M 580 268 Q 620 210 660 268"/>
    </g>

    <!-- Анимированный импульс по видимой траектории S1 → S2 → S3 → S1 -->
    <circle r="5.5" fill="#EC4899" filter="url(#mc-glow)">
        <animateMotion dur="7s" repeatCount="indefinite"
                       path="M 232 288 Q 290 230 348 288
                             M 452 288 Q 510 230 568 288
                             M 620 378 Q 400 480 180 378"/>
        <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Состояния -->
    <g filter="url(#mc-glow)">
        <circle cx="180" cy="320" r="58" fill="url(#mc-s1)"/>
        <circle cx="180" cy="320" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
        <circle cx="400" cy="320" r="58" fill="url(#mc-s2)"/>
        <circle cx="400" cy="320" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
        <circle cx="620" cy="320" r="58" fill="url(#mc-s3)"/>
        <circle cx="620" cy="320" r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>

    <text x="180" y="326" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₁</text>
    <text x="180" y="348" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">норма</text>

    <text x="400" y="326" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₂</text>
    <text x="400" y="348" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">ухудшение</text>

    <text x="620" y="326" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">S₃</text>
    <text x="620" y="348" text-anchor="middle"
          font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" fill-opacity="0.9">восстановление</text>

    <!-- Подписи вероятностей -->
    <g font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#7C3AED">
        <!-- На переходах -->
        <text x="290" y="248" text-anchor="middle">0.3</text>
        <text x="510" y="248" text-anchor="middle">0.5</text>
        <text x="400" y="450" text-anchor="middle">0.2</text>
        <!-- На петлях -->
        <text x="180" y="228" text-anchor="middle" font-size="12" fill="#8B5CF6">0.7</text>
        <text x="400" y="228" text-anchor="middle" font-size="12" fill="#8B5CF6">0.6</text>
        <text x="620" y="228" text-anchor="middle" font-size="12" fill="#8B5CF6">0.4</text>
    </g>

    <!-- Легенда: объяснение -->
    <g transform="translate(60, 510)">
        <rect x="0" y="0" width="320" height="70" rx="12"
              fill="#FFFFFF" fill-opacity="0.92"
              stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5"/>
        <text x="160" y="28" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#7C3AED">
            sₜ₊₁ = P · sₜ
        </text>
        <text x="160" y="50" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            sₜ — распределение по состояниям
        </text>
    </g>

    <!-- Стационарное распределение -->
    <g transform="translate(420, 510)">
        <rect x="0" y="0" width="320" height="70" rx="12"
              fill="#0891B2" fill-opacity="0.1"
              stroke="#0891B2" stroke-opacity="0.4" stroke-width="1.5"/>
        <text x="160" y="28" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="14" font-weight="800" fill="#0E7490">
            π · P = π
        </text>
        <text x="160" y="50" text-anchor="middle"
              font-family="system-ui, sans-serif"
              font-size="11" fill="#6B7280">
            π — долгосрочная доля каждого состояния
        </text>
    </g>
</svg>