<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="ml-mk-a" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="ml-mk-b" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
    </defs>

    <!-- Круговая стрелка (переходы) -->
    <path d="M6 16 A 10 10 0 0 1 26 16"
          stroke="url(#ml-mk-a)" stroke-width="1.3"
          fill="none" opacity="0.55"
          stroke-linecap="round"/>
    <path d="M26 16 A 10 10 0 0 1 6 16"
          stroke="url(#ml-mk-b)" stroke-width="1.3"
          fill="none" opacity="0.55"
          stroke-linecap="round"/>

    <!-- Стрелка сверху -->
    <polyline points="24,13 26,16 23,17"
              fill="none" stroke="url(#ml-mk-a)"
              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Стрелка снизу -->
    <polyline points="8,19 6,16 9,15"
              fill="none" stroke="url(#ml-mk-b)"
              stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Узлы-состояния -->
    <circle cx="6" cy="16" r="3.4" fill="url(#ml-mk-a)"/>
    <circle cx="6" cy="16" r="3.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>

    <circle cx="26" cy="16" r="3.4" fill="url(#ml-mk-b)"/>
    <circle cx="26" cy="16" r="3.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>

    <!-- Центральный узел -->
    <circle cx="16" cy="16" r="2.6" fill="#8B5CF6" opacity="0.85"/>
    <circle cx="16" cy="16" r="2.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.7"/>
</svg>