<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none"
     role="img" aria-label="Начать вычисления"
     class="ml-cta-orbit"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>

    <!-- ЯДРО: фиолетово-розовое с переходом в циан -->
    <radialGradient id="co-neon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.2"  stop-color="#F5D0FE" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#D946EF" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="1"    stop-color="#5B21B6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="co-glass" cx="0.4" cy="0.32" r="0.72">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.4"  stop-color="#E9D5FF" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#A855F7" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#4C1D95" stop-opacity="0.4"/>
    </radialGradient>

    <radialGradient id="co-fresnel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.93" stop-color="#F5D0FE" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.85"/>
    </radialGradient>

    <radialGradient id="co-key" cx="0.28" cy="0.18" r="0.42">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="co-fill" cx="0.75" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#FBCFE8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="co-rim" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1"    stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="co-bounce" cx="0.5" cy="1" r="0.6">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- ОРБИТЫ -->
    <linearGradient id="co-orbit-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#F0ABFC" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#EC4899" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#BE185D" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="co-orbit-cyan" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#67E8F9" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#0891B2" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="co-orbit-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#C4B5FD" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#7C3AED" stop-opacity="0.85"/>
    </linearGradient>

    <!-- ЧАСТИЦЫ -->
    <radialGradient id="co-spark-white" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#F5D0FE"/>
      <stop offset="1"   stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="co-spark-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="co-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="co-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FDE68A"/>
      <stop offset="1"   stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- ФИЛЬТРЫ -->
    <filter id="co-bloom-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="co-bloom-md" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="co-bloom-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="co-shadow-floor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="co-core-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="co-core-clip">
      <circle cx="160" cy="160" r="60"/>
    </clipPath>

  </defs>

  <!-- ================================================================
       ФОН: ореол
       ================================================================ -->
  <circle cx="160" cy="160" r="140"
          fill="url(#co-neon)" opacity="0.12">
    <animate attributeName="r" values="140;148;140" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================================================
       ТЕНЬ НА ПОЛ
       ================================================================ -->
  <ellipse cx="160" cy="270" rx="84" ry="10"
           fill="#4C1D95" opacity="0.26"
           filter="url(#co-shadow-floor)">
    <animate attributeName="rx" values="84;90;84" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================================================================
       ДАЛЬНЯЯ ОРБИТА (фиолетовая, медленная) — за ядром
       ================================================================ -->
  <g transform="translate(160 158)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="44s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="128" ry="28"
               fill="none" stroke="url(#co-orbit-violet)"
               stroke-width="1.3" opacity="0.55"
               transform="rotate(15)"/>
    </g>
  </g>

  <!-- ================================================================
       СРЕДНЯЯ ОРБИТА (циановая, обратное вращение)
       ================================================================ -->
  <g transform="translate(160 158)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="30s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="114" ry="24"
               fill="none" stroke="url(#co-orbit-cyan)"
               stroke-width="1.6" opacity="0.8"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="114" ry="24"
               fill="none" stroke="#22D3EE" stroke-width="4"
               opacity="0.14" filter="url(#co-bloom-md)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="114" cy="0" r="3.2"
                fill="url(#co-spark-cyan)" filter="url(#co-bloom-sm)">
          <animate attributeName="r" values="3.2;4.2;3.2" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="114" cy="0" r="1.4" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ================================================================
       БЛИЖНЯЯ ОРБИТА (розовая, быстрая) — поверх ядра
       ================================================================ -->
  <g transform="translate(160 158)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="100" ry="22"
               fill="none" stroke="url(#co-orbit-rose)"
               stroke-width="1.8" opacity="0.92"
               transform="rotate(30)"/>
      <ellipse cx="0" cy="0" rx="100" ry="22"
               fill="none" stroke="#D946EF" stroke-width="5"
               opacity="0.16" filter="url(#co-bloom-md)"
               transform="rotate(30)"/>
      <g transform="rotate(30)">
        <circle cx="-100" cy="0" r="3.6"
                fill="url(#co-spark-pink)" filter="url(#co-bloom-sm)">
          <animate attributeName="r" values="3.6;4.6;3.6" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-100" cy="0" r="1.6" fill="#FFFFFF"/>
      </g>
      <g transform="rotate(30)">
        <circle cx="100" cy="0" r="2.6"
                fill="url(#co-spark-white)" filter="url(#co-bloom-sm)">
          <animate attributeName="r" values="2.6;3.4;2.6" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="100" cy="0" r="1.2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- ================================================================
       ЯДРО: стеклянная сфера с символом «старт»
       ================================================================ -->
  <g filter="url(#co-core-shadow)">

    <!-- Ореол -->
    <circle cx="160" cy="160" r="78"
            fill="url(#co-neon)" opacity="0.34"
            filter="url(#co-bloom-lg)">
      <animate attributeName="r" values="78;86;78" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.34;0.2;0.34" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- Стеклянная оболочка -->
    <circle cx="160" cy="160" r="60" fill="url(#co-glass)"/>
    <circle cx="160" cy="160" r="60" fill="url(#co-neon)" opacity="0.85"/>
    <circle cx="160" cy="160" r="60" fill="url(#co-fresnel)"/>

    <!-- Внутренний пульс -->
    <circle cx="160" cy="160" r="30"
            fill="url(#co-neon)" opacity="0.9">
      <animate attributeName="r" values="30;34;30" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- ============================================================
         ВНУТРИ: круг-кнопка с символом запуска
         ============================================================ -->
    <g clip-path="url(#co-core-clip)">
      <!-- Круг-подложка кнопки -->
      <circle cx="160" cy="160" r="30"
              fill="#FFFFFF" fill-opacity="0.12"
              stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.4"/>

      <!-- Стрелка-запуск (треугольник play) -->
      <path d="M152 146 L176 160 L152 174 Z"
            fill="#FFFFFF" fill-opacity="0.95"/>

      <!-- Внутренний контур кнопки -->
      <circle cx="160" cy="160" r="24" fill="none"
              stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8"/>

      <!-- Микро-искры вокруг кнопки -->
      <circle cx="140" cy="140" r="1.4" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="180" r="1.2" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="180" cy="140" r="1.4" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="180" r="1.2" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Key light -->
    <ellipse cx="138" cy="136" rx="20" ry="13"
             fill="url(#co-key)" transform="rotate(-24 138 136)"/>
    <ellipse cx="134" cy="132" rx="5.5" ry="3.4"
             fill="#FFFFFF" opacity="0.9"
             transform="rotate(-28 134 132)"/>

    <!-- Fill -->
    <ellipse cx="188" cy="196" rx="24" ry="15"
             fill="url(#co-fill)" transform="rotate(-20 188 196)"/>

    <!-- Rim: циановая полоса справа -->
    <path d="M216 144 A60 60 0 0 1 196 206"
          fill="none" stroke="url(#co-rim)" stroke-width="2"
          stroke-linecap="round" opacity="0.8"/>

    <!-- Bounce -->
    <ellipse cx="160" cy="212" rx="38" ry="10"
             fill="url(#co-bounce)"/>

    <circle cx="160" cy="160" r="60" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8"/>
  </g>

  <!-- ================================================================
       ЧАСТИЦЫ
       ================================================================ -->
  <circle cx="42" cy="54" r="2" fill="url(#co-spark-cyan)" filter="url(#co-bloom-sm)">
    <animate attributeName="opacity" values="1;0.4;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="278" cy="48" r="2.2" fill="url(#co-spark-pink)" filter="url(#co-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="6s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="270" r="1.8" fill="url(#co-spark-warm)" filter="url(#co-bloom-sm)">
    <animate attributeName="cy" values="270;262;270" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="278" cy="266" r="2.4" fill="url(#co-spark-white)" filter="url(#co-bloom-sm)">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="5.6s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="22" r="1.8" fill="url(#co-spark-white)" filter="url(#co-bloom-sm)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="298" r="1.8" fill="url(#co-spark-pink)" filter="url(#co-bloom-sm)">
    <animate attributeName="opacity" values="0.85;0.3;0.85" dur="5.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

</svg>