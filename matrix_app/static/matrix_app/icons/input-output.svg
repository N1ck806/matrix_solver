<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="ml-io-a" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="ml-io-b" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
    </defs>

    <!-- Левая матрица 2×2 -->
    <g fill="url(#ml-io-a)" opacity="0.9">
        <rect x="3" y="11" width="4" height="4" rx="1"/>
        <rect x="8" y="11" width="4" height="4" rx="1" opacity="0.85"/>
        <rect x="3" y="16" width="4" height="4" rx="1" opacity="0.85"/>
        <rect x="8" y="16" width="4" height="4" rx="1" opacity="0.7"/>
    </g>

    <!-- Стрелка -->
    <g stroke="#8B5CF6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
        <line x1="14" y1="16" x2="18" y2="16"/>
        <polyline points="16.5,14 18.5,16 16.5,18"/>
    </g>

    <!-- Правая матрица 2×2 -->
    <g fill="url(#ml-io-b)" opacity="0.9">
        <rect x="20" y="11" width="4" height="4" rx="1"/>
        <rect x="25" y="11" width="4" height="4" rx="1" opacity="0.85"/>
        <rect x="20" y="16" width="4" height="4" rx="1" opacity="0.85"/>
        <rect x="25" y="16" width="4" height="4" rx="1" opacity="0.7"/>
    </g>
</svg>