<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Собственные значения"
     class="ml-feature-svg ml-feature-svg--eigen"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="eig-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#FDBA74">
        <animate attributeName="stop-color"
                 values="#FDBA74;#FB923C;#EA580C;#FDBA74"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#EA580C">
        <animate attributeName="stop-color"
                 values="#EA580C;#C2410C;#9A3412;#EA580C"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#431407"/>
    </radialGradient>

    <radialGradient id="eig-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFEDD5" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#FDBA74" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eig-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="eig-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FDBA74"/>
      <stop offset="0.5" stop-color="#EA580C"/>
      <stop offset="1"   stop-color="#9A3412"/>
    </linearGradient>

    <linearGradient id="eig-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="eig-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9A3412">
        <animate attributeName="stop-color"
                 values="#9A3412;#EA580C;#FB923C;#9A3412"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EA580C">
        <animate attributeName="stop-color"
                 values="#EA580C;#FB923C;#FDBA74;#EA580C"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="eig-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FDBA74"/>
      <stop offset="1"   stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="eig-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="eig-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="eig-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="eig-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="eig-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#eig-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#eig-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#EA580C" stroke-width="3.2"
               opacity="0.14" filter="url(#eig-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#eig-spark)" filter="url(#eig-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#eig-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#eig-spark-pink)" filter="url(#eig-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#eig-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#eig-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#eig-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#eig-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#eig-core-clip)">
      <!-- Оси -->
      <path d="M41 46 H55 M48 39 V53"
            stroke="#431407" stroke-opacity="0.3" stroke-width="0.8"
            stroke-linecap="round"/>

      <!-- Вектор до (короткий) -->
      <path d="M48 46 L53 43"
            stroke="#431407" stroke-opacity="0.6" stroke-width="1.2"
            stroke-linecap="round"/>
      <path d="M52 42.4 L53 43 L52.2 44"
            stroke="#431407" stroke-opacity="0.6" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Вектор после (длиннее, по той же прямой) -->
      <path d="M48 46 L56 40"
            stroke="#431407" stroke-opacity="0.95" stroke-width="1.5"
            stroke-linecap="round"/>
      <path d="M54.5 39.2 L56 40 L54.8 41.4"
            stroke="#431407" stroke-opacity="0.95" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="56" cy="40" r="1.3" fill="#431407" fill-opacity="0.95"/>

      <!-- λ-метка -->
      <path d="M41 43 L42.5 46 L41 49"
            stroke="#431407" stroke-opacity="0.9" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#eig-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#eig-spark-pink)" filter="url(#eig-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#eig-spark)" filter="url(#eig-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#eig-spark-pink)" filter="url(#eig-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#eig-spark)" filter="url(#eig-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#eig-text)">A · v = λ · v</text>
</svg>