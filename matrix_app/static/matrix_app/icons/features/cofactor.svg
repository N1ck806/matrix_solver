<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Алгебраическое дополнение"
     class="ml-feature-svg ml-feature-svg--cofactor"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="cof-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#A7F3D0">
        <animate attributeName="stop-color"
                 values="#A7F3D0;#6EE7B7;#34D399;#A7F3D0"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#059669;#047857;#10B981"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#022C22"/>
    </radialGradient>

    <radialGradient id="cof-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#D1FAE5" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#6EE7B7" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cof-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cof-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#6EE7B7"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1"   stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="cof-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="cof-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#047857">
        <animate attributeName="stop-color"
                 values="#047857;#10B981;#34D399;#047857"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#10B981">
        <animate attributeName="stop-color"
                 values="#10B981;#34D399;#6EE7B7;#10B981"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="cof-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A7F3D0"/>
      <stop offset="1"   stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cof-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="cof-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="cof-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cof-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="cof-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#cof-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#cof-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#10B981" stroke-width="3.2"
               opacity="0.14" filter="url(#cof-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#cof-spark)" filter="url(#cof-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#cof-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#cof-spark-pink)" filter="url(#cof-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#cof-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#cof-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#cof-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#cof-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#cof-core-clip)">
      <!-- Матрица 3×3 -->
      <path d="M42 41 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.85"/>
      <path d="M47.3 41 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.85"/>
      <path d="M42 47.3 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.85"/>
      <path d="M47.3 47.3 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.85"/>

      <path d="M52.6 41 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M42 44.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M47.3 44.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M52.6 44.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M42 52.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M47.3 52.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>
      <path d="M52.6 52.6 h3.3 v3.3 h-3.3 Z" fill="#022C22" fill-opacity="0.25"/>

      <!-- Линии вычёркивания -->
      <path d="M40 44 L57 44"
            stroke="#022C22" stroke-opacity="0.85" stroke-width="1.2"
            stroke-linecap="round"/>
      <path d="M52.6 40 L52.6 57"
            stroke="#022C22" stroke-opacity="0.85" stroke-width="1.2"
            stroke-linecap="round"/>

      <!-- Знак (−1)^(i+j) -->
      <path d="M46 60 h4"
            stroke="#022C22" stroke-opacity="0.95" stroke-width="1.2"
            stroke-linecap="round"/>
      <path d="M47.2 60 v3 M48.8 60 v3"
            stroke="#022C22" stroke-opacity="0.95" stroke-width="1"
            stroke-linecap="round"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#cof-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#cof-spark-pink)" filter="url(#cof-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#cof-spark)" filter="url(#cof-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#cof-spark-pink)" filter="url(#cof-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#cof-spark)" filter="url(#cof-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#cof-text)">Cᵢⱼ</text>
</svg>