<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Обратная матрица"
     class="ml-feature-svg ml-feature-svg--inverse"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="inv-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#A5F3FC">
        <animate attributeName="stop-color"
                 values="#A5F3FC;#67E8F9;#22D3EE;#A5F3FC"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#06B6D4;#0891B2;#22D3EE"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0E7490"/>
    </radialGradient>

    <radialGradient id="inv-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#A5F3FC" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inv-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="inv-orbit" x1="0" y1="96" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1"   stop-color="#0891B2"/>
    </linearGradient>

    <linearGradient id="inv-orbit-2" x1="96" y1="96" x2="0" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F0ABFC"/>
      <stop offset="1"   stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="inv-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891B2">
        <animate attributeName="stop-color"
                 values="#0891B2;#22D3EE;#67E8F9;#0891B2"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#67E8F9;#A5F3FC;#22D3EE"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="inv-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="inv-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="inv-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="inv-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inv-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="inv-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#inv-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#inv-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(25)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#22D3EE" stroke-width="3.2"
               opacity="0.14" filter="url(#inv-orbit-glow)"
               transform="rotate(25)"/>
      <g transform="rotate(25)">
        <circle cx="-32" cy="0" r="2.4"
                fill="url(#inv-spark-cool)" filter="url(#inv-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#inv-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(-35)"/>
      <g transform="rotate(-35)">
        <circle cx="30" cy="0" r="1.4"
                fill="url(#inv-spark-pink)" filter="url(#inv-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#inv-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#inv-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#inv-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#inv-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#inv-core-clip)">
      <!-- A -->
      <path d="M40 41 h7 v10 h-7 Z"
            stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.1"
            stroke-linejoin="round" fill="none"/>
      <path d="M42 44 l3.5 4 M45.5 44 l-3.5 4"
            stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.1"
            stroke-linecap="round"/>

      <!-- знак · -->
      <circle cx="48" cy="46" r="0.9" fill="#FFFFFF" fill-opacity="0.85"/>

      <!-- A⁻¹ -->
      <path d="M50 41 h7 v10 h-7 Z"
            stroke="#0E7490" stroke-opacity="0.95" stroke-width="1.2"
            stroke-linejoin="round" fill="none"/>
      <path d="M52 44 l3.5 4 M55.5 44 l-3.5 4"
            stroke="#0E7490" stroke-width="1.1" stroke-linecap="round"/>
      <!-- индекс -1 -->
      <path d="M56 39.5 h2"
            stroke="#0E7490" stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#inv-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#inv-spark-cool)" filter="url(#inv-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#inv-spark-pink)" filter="url(#inv-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#inv-spark-cool)" filter="url(#inv-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#inv-spark-pink)" filter="url(#inv-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#inv-text)">A · A⁻¹ = I</text>
</svg>