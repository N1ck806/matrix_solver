<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Определитель"
     class="ml-feature-svg ml-feature-svg--determinant"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="det-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#F5D0FE">
        <animate attributeName="stop-color"
                 values="#F5D0FE;#F0ABFC;#E879F9;#F5D0FE"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#C026D3;#A855F7;#D946EF"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#4C1D95"/>
    </radialGradient>

    <radialGradient id="det-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FCE7F3" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#F5D0FE" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="det-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="det-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F0ABFC"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1"   stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="det-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#67E8F9"/>
      <stop offset="1"   stop-color="#D946EF"/>
    </linearGradient>

    <linearGradient id="det-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#EC4899;#A855F7;#D946EF"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color"
                 values="#EC4899;#A855F7;#D946EF;#EC4899"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="det-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="det-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="det-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="det-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="det-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="det-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#det-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#det-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#EC4899" stroke-width="3.2"
               opacity="0.14" filter="url(#det-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#det-spark-pink)" filter="url(#det-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#det-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#det-spark-cool)" filter="url(#det-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#det-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#det-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#det-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#det-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#det-core-clip)">
      <path d="M43 42 L53 42 L53 49 L43 49 Z"
            stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.1"
            stroke-linejoin="round" fill="none"/>
      <path d="M43 42 L53 49"
            stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.7"
            stroke-dasharray="1.2 1.6"/>

      <path d="M43 49 L53 42 L57 47 L47 53 Z"
            stroke="#1E1B4B" stroke-opacity="0.9" stroke-width="1.4"
            stroke-linejoin="round" fill="none"/>
      <path d="M43 49 L53 42 L57 47 L47 53 Z"
            fill="#1E1B4B" fill-opacity="0.18"/>

      <circle cx="43" cy="49" r="1.15" fill="#1E1B4B" fill-opacity="0.9"/>
      <circle cx="53" cy="42" r="1.15" fill="#1E1B4B" fill-opacity="0.9"/>
      <circle cx="57" cy="47" r="1.15" fill="#1E1B4B" fill-opacity="0.9"/>
      <circle cx="47" cy="53" r="1.15" fill="#1E1B4B" fill-opacity="0.9"/>

      <path d="M43 49 L53 42"
            stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8"/>
      <path d="M43 49 L47 53"
            stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.8"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#det-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#det-spark-cool)" filter="url(#det-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#det-spark-pink)" filter="url(#det-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#det-spark-cool)" filter="url(#det-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#det-spark-pink)" filter="url(#det-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#det-text)">det A</text>
</svg>