<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Присоединённая матрица"
     class="ml-feature-svg ml-feature-svg--adjugate"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="adj-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#F5D0FE">
        <animate attributeName="stop-color"
                 values="#F5D0FE;#E879F9;#C026D3;#F5D0FE"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#C026D3">
        <animate attributeName="stop-color"
                 values="#C026D3;#A21CAF;#86198F;#C026D3"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#4A044E"/>
    </radialGradient>

    <radialGradient id="adj-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FAE8FF" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#F0ABFC" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#A21CAF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="adj-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="adj-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F0ABFC"/>
      <stop offset="0.5" stop-color="#C026D3"/>
      <stop offset="1"   stop-color="#86198F"/>
    </linearGradient>

    <linearGradient id="adj-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#67E8F9"/>
      <stop offset="1"   stop-color="#C026D3"/>
    </linearGradient>

    <linearGradient id="adj-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86198F">
        <animate attributeName="stop-color"
                 values="#86198F;#C026D3;#E879F9;#86198F"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#C026D3">
        <animate attributeName="stop-color"
                 values="#C026D3;#E879F9;#F0ABFC;#C026D3"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="adj-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#F5D0FE"/>
      <stop offset="1"   stop-color="#C026D3" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="adj-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="adj-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="adj-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="adj-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="adj-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#adj-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#adj-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#C026D3" stroke-width="3.2"
               opacity="0.14" filter="url(#adj-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#adj-spark)" filter="url(#adj-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#adj-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#adj-spark-cool)" filter="url(#adj-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#adj-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#adj-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#adj-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#adj-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#adj-core-clip)">
      <!-- A (2×2) слева -->
      <path d="M40 42 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M43.7 42 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M40 45.7 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M43.7 45.7 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>

      <!-- стрелка -->
      <path d="M48.6 46 h1.6"
            stroke="#4A044E" stroke-opacity="0.9" stroke-width="0.9"
            stroke-linecap="round"/>
      <path d="M49.5 45.2 L50.4 46 L49.5 46.8"
            stroke="#4A044E" stroke-opacity="0.9" stroke-width="0.9"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- adj A (2×2) справа -->
      <path d="M51.4 42 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M55.1 42 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M51.4 45.7 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
      <path d="M55.1 45.7 h3.4 v3.4 h-3.4 Z" fill="#4A044E" fill-opacity="0.9"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#adj-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#adj-spark-cool)" filter="url(#adj-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#adj-spark)" filter="url(#adj-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#adj-spark-cool)" filter="url(#adj-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#adj-spark)" filter="url(#adj-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#adj-text)">adj A</text>
</svg>