<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Разложения матриц"
     class="ml-feature-svg ml-feature-svg--decompositions"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="dc-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#F5D0FE">
        <animate attributeName="stop-color"
                 values="#F5D0FE;#E9D5FF;#D946EF;#F5D0FE"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#C026D3;#A855F7;#D946EF"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#4C1D95"/>
    </radialGradient>

    <radialGradient id="dc-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#F5D0FE" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#E9D5FF" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dc-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dc-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F0ABFC"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1"   stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="dc-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#FCD34D"/>
      <stop offset="1"   stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="dc-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#D946EF;#F0ABFC;#7C3AED"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#F0ABFC;#E9D5FF;#D946EF"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="dc-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#F5D0FE"/>
      <stop offset="1"   stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="dc-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FDE68A"/>
      <stop offset="1"   stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <filter id="dc-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="dc-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dc-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="dc-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#dc-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#dc-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#D946EF" stroke-width="3.2"
               opacity="0.14" filter="url(#dc-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#dc-spark)" filter="url(#dc-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#dc-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#dc-spark-warm)" filter="url(#dc-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#dc-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#dc-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#dc-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#dc-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#dc-core-clip)">
      <!-- L: нижний треугольник -->
      <path d="M41 53 L41 40 L54 53 Z"
            fill="#FFFFFF" fill-opacity="0.28"
            stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.1"
            stroke-linejoin="round"/>

      <!-- U: верхний треугольник (пунктиром) -->
      <path d="M42 39 L54 39 L54 52"
            fill="#FFFFFF" fill-opacity="0.12"
            stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1"
            stroke-dasharray="1.6 1.8" stroke-linejoin="round"/>

      <!-- Точки на диагонали -->
      <circle cx="42.5" cy="52" r="0.9" fill="#FFFFFF"/>
      <circle cx="45.5" cy="52" r="0.9" fill="#FFFFFF"/>
      <circle cx="48.5" cy="52" r="0.9" fill="#FFFFFF"/>
      <circle cx="51.5" cy="52" r="0.9" fill="#FFFFFF"/>
      <circle cx="48.5" cy="49" r="0.9" fill="#FFFFFF"/>
      <circle cx="51.5" cy="49" r="0.9" fill="#FFFFFF"/>
      <circle cx="51.5" cy="46" r="0.9" fill="#FFFFFF"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#dc-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#dc-spark-warm)" filter="url(#dc-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#dc-spark)" filter="url(#dc-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#dc-spark)" filter="url(#dc-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#dc-spark-warm)" filter="url(#dc-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#dc-text)">A = L · U</text>
</svg>