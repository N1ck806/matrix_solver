<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none"
     role="img" aria-label="Системы линейных уравнений"
     class="ml-feature-svg ml-feature-svg--slau"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="sl-core" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#C7D2FE">
        <animate attributeName="stop-color"
                 values="#C7D2FE;#A5B4FC;#6366F1;#C7D2FE"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#6366F1">
        <animate attributeName="stop-color"
                 values="#6366F1;#4F46E5;#4338CA;#6366F1"
                 dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1E1B4B"/>
    </radialGradient>

    <radialGradient id="sl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#E0E7FF" stop-opacity="0.7"/>
      <stop offset="0.7"  stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sl-hl" cx="0.34" cy="0.24" r="0.72">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sl-orbit" x1="0" y1="0" x2="96" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#A5B4FC"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1"   stop-color="#4338CA"/>
    </linearGradient>

    <linearGradient id="sl-orbit-2" x1="96" y1="0" x2="0" y2="96"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#67E8F9"/>
      <stop offset="1"   stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="sl-text" x1="0" y1="0" x2="96" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA">
        <animate attributeName="stop-color"
                 values="#4338CA;#6366F1;#A5B4FC;#4338CA"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#6366F1">
        <animate attributeName="stop-color"
                 values="#6366F1;#A5B4FC;#C7D2FE;#6366F1"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="sl-spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#C7D2FE"/>
      <stop offset="1"   stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sl-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <filter id="sl-spark-glow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="sl-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sl-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>

    <clipPath id="sl-core-clip">
      <circle cx="48" cy="46" r="13"/>
    </clipPath>
  </defs>

  <circle cx="48" cy="48" r="46" fill="url(#sl-glow)" opacity="0.16">
    <animate attributeName="r" values="46;48;46" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.22;0.16" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(48 46)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="url(#sl-orbit)"
               stroke-width="1.5" opacity="0.85"
               transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="32" ry="9.5"
               fill="none" stroke="#6366F1" stroke-width="3.2"
               opacity="0.14" filter="url(#sl-orbit-glow)"
               transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="32" cy="0" r="2.4"
                fill="url(#sl-spark)" filter="url(#sl-spark-glow)">
          <animate attributeName="r" values="2.4;3;2.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="32" cy="0" r="1.05" fill="#FFFFFF"/>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="360 0 0" to="0 0 0" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="8"
               fill="none" stroke="url(#sl-orbit-2)"
               stroke-width="0.9" opacity="0.55"
               transform="rotate(38)"/>
      <g transform="rotate(38)">
        <circle cx="-30" cy="0" r="1.4"
                fill="url(#sl-spark-cool)" filter="url(#sl-spark-glow)">
          <animate attributeName="r" values="1.4;1.9;1.4" dur="3s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g filter="url(#sl-core-shadow)">
    <circle cx="48" cy="46" r="17.5" fill="url(#sl-glow)" opacity="0.5">
      <animate attributeName="r" values="17.5;19.5;17.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="48" cy="46" r="13" fill="url(#sl-core)"/>
    <circle cx="48" cy="46" r="13" fill="url(#sl-hl)"/>
    <circle cx="48" cy="46" r="12.5" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

    <g clip-path="url(#sl-core-clip)">
      <!-- Две пересекающиеся прямые (решение системы) -->
      <path d="M38 50 L56 42"
            stroke="#1E1B4B" stroke-opacity="0.9" stroke-width="1.4"
            stroke-linecap="round"/>
      <path d="M39 41 L55 51"
            stroke="#1E1B4B" stroke-opacity="0.9" stroke-width="1.4"
            stroke-linecap="round"/>

      <!-- Точка пересечения (решение) -->
      <path d="M47.2 45 m-1.8 0 a1.8 1.8 0 1 0 3.6 0 a1.8 1.8 0 1 0 -3.6 0"
            fill="#FFFFFF"/>
      <path d="M47.2 45 m-3.2 0 a3.2 3.2 0 1 0 6.4 0 a3.2 3.2 0 1 0 -6.4 0"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.7"/>

      <!-- Ось -->
      <path d="M40 46 H55"
            stroke="#1E1B4B" stroke-opacity="0.3" stroke-width="0.7"
            stroke-dasharray="1.2 1.8"/>
    </g>

    <circle cx="48" cy="46" r="2.4" fill="url(#sl-glow)" opacity="0.85">
      <animate attributeName="r" values="2.4;3.2;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <circle cx="14" cy="14" r="1.3" fill="url(#sl-spark-cool)" filter="url(#sl-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="82" cy="18" r="1.4" fill="url(#sl-spark)" filter="url(#sl-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="84" cy="80" r="1.2" fill="url(#sl-spark-cool)" filter="url(#sl-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="12" cy="82" r="1" fill="url(#sl-spark)" filter="url(#sl-spark-glow)">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.5s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <text x="48" y="86" font-size="8" font-weight="700"
        letter-spacing="0.06em" text-anchor="middle"
        fill="url(#sl-text)">A · x = b</text>
</svg>