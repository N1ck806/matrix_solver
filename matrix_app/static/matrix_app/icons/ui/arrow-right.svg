<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none"
     role="img" aria-label="Далее"
     class="ml-icon-svg ml-icon-svg--arrow-right"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- ============================================================
       ОПРЕДЕЛЕНИЯ
       ============================================================ -->
  <defs>

    <!-- ОСНОВНАЯ СТРЕЛКА -->
    <linearGradient id="arr-body" x1="10" y1="40" x2="70" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7">
        <animate attributeName="stop-color"
                 values="#A855F7;#C084FC;#A855F7"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#EC4899;#D946EF"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#67E8F9;#22D3EE"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ЯДРО НА КОНЦЕ СТРЕЛКИ -->
    <radialGradient id="arr-core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#F0ABFC">
        <animate attributeName="stop-color"
                 values="#F0ABFC;#D946EF;#C084FC;#F0ABFC"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#A855F7;#8B5CF6;#D946EF"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#5B21B6"/>
    </radialGradient>

    <!-- СВЕЧЕНИЕ ЯДРА -->
    <radialGradient id="arr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.3"  stop-color="#FCE7F3" stop-opacity="0.65"/>
      <stop offset="0.6"  stop-color="#F5D0FE" stop-opacity="0.3"/>
      <stop offset="1"    stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- ОРБИТА СТРЕЛКИ -->
    <linearGradient id="arr-orbit" x1="0" y1="0" x2="80" y2="80"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- СЛЕД СТРЕЛКИ (затухающие линии) -->
    <linearGradient id="arr-trail" x1="6" y1="40" x2="26" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D946EF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- ТЕКСТ -->
    <linearGradient id="arr-text" x1="110" y1="28" x2="230" y2="52"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#A855F7;#D946EF;#7C3AED"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#A855F7">
        <animate attributeName="stop-color"
                 values="#A855F7;#D946EF;#22D3EE;#A855F7"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22D3EE">
        <animate attributeName="stop-color"
                 values="#22D3EE;#A855F7;#7C3AED;#22D3EE"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ЛИНИИ-СОЕДИНИТЕЛИ -->
    <linearGradient id="arr-line" x1="82" y1="40" x2="108" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- ЧАСТИЦЫ -->
    <radialGradient id="arr-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1"   stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="arr-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#22D3EE"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="arr-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- ФИЛЬТРЫ -->
    <filter id="arr-spark-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <filter id="arr-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="arr-text-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="arr-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- ================================================================
       ФОН СЦЕНЫ
       ================================================================ -->
  <circle class="arr-scene-halo"
          cx="140" cy="40" r="130"
          fill="url(#arr-glow)" opacity="0.08">
    <animate attributeName="r" values="130;135;130" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.04;0.08" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================================================
       ЛЕВАЯ ЧАСТЬ: СТРЕЛКА (0–80)
       ================================================================ -->
  <g transform="translate(0 0)">

    <!-- Свечение под стрелкой -->
    <circle class="arr-halo"
            cx="40" cy="40" r="32"
            fill="url(#arr-glow)" opacity="0.4">
      <animate attributeName="r" values="32;35;32" dur="5.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.22;0.4" dur="5.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Орбита вокруг стрелки -->
    <g class="arr-orbit" transform="translate(40 40)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0"
                          dur="22s" repeatCount="indefinite"/>

        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="url(#arr-orbit)"
                 stroke-width="1.4" opacity="0.85"
                 transform="rotate(-28)"/>

        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="#22D3EE" stroke-width="3"
                 opacity="0.15" filter="url(#arr-orbit-glow)"
                 transform="rotate(-28)"/>

        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 0 0" to="360 0 0"
                            dur="22s" repeatCount="indefinite"/>
          <circle class="arr-orbit-dot" cx="26" cy="0" r="2.2"
                  fill="url(#arr-spark-cool)" filter="url(#arr-spark-glow)">
            <animate attributeName="r" values="2.2;2.8;2.2"
                     dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="26" cy="0" r="1" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- След стрелки (3 затухающие линии позади) -->
    <g class="arr-trail">
      <line x1="8" y1="40" x2="20" y2="40"
            stroke="url(#arr-trail)"
            stroke-width="1.2" stroke-linecap="round" opacity="0.35">
        <animate attributeName="opacity" values="0.35;0.7;0.35" dur="2.8s" repeatCount="indefinite"/>
      </line>
      <line x1="13" y1="40" x2="23" y2="40"
            stroke="url(#arr-trail)"
            stroke-width="1.6" stroke-linecap="round" opacity="0.55">
        <animate attributeName="opacity" values="0.55;0.9;0.55" dur="2.8s" begin="0.35s" repeatCount="indefinite"/>
      </line>
      <line x1="18" y1="40" x2="26" y2="40"
            stroke="url(#arr-trail)"
            stroke-width="2" stroke-linecap="round" opacity="0.75">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="2.8s" begin="0.7s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Основная линия стрелки -->
    <g class="arr-body">
      <line x1="24" y1="40" x2="60" y2="40"
            stroke="url(#arr-body)"
            stroke-width="3.2"
            stroke-linecap="round"/>

      <!-- Подсветка -->
      <line x1="24" y1="39" x2="60" y2="39"
            stroke="#FFFFFF" stroke-opacity="0.32"
            stroke-width="0.9" stroke-linecap="round"/>

      <!-- Наконечник -->
      <path class="arr-head"
            d="M52 26 L66 40 L52 54"
            stroke="url(#arr-body)"
            stroke-width="3.2"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"/>

      <!-- Подсветка наконечника -->
      <path d="M52 26.5 L65.5 40"
            stroke="#FFFFFF" stroke-opacity="0.3"
            stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Ядро на конце стрелки -->
    <g class="arr-core" filter="url(#arr-core-shadow)">
      <circle class="arr-core-halo"
              cx="66" cy="40" r="10"
              fill="url(#arr-glow)" opacity="0.9">
        <animate attributeName="r" values="10;12;10" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0.6;0.9" dur="3.6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="66" cy="40" r="4.6" fill="url(#arr-core)"/>
      <circle cx="66" cy="40" r="4.6" fill="url(#arr-glow)" opacity="0.5"/>

      <circle cx="66" cy="40" r="2.2" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="r" values="2.2;2.8;2.2" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="40" r="1" fill="#FFFFFF"/>
    </g>

    <!-- Микро-искры -->
    <circle cx="42" cy="32" r="0.9" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="54" cy="50" r="0.8" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="48" r="1" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================================================
       СОЕДИНИТЕЛЬНАЯ ЛИНИЯ
       ================================================================ -->
  <g class="arr-connector">
    <path d="M82 40 L108 40"
          stroke="url(#arr-line)"
          stroke-width="1.2" stroke-linecap="round"
          stroke-dasharray="2 4">
      <animate attributeName="stroke-dashoffset"
               values="0;-12;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="82" cy="40" r="1.6" fill="#22D3EE">
      <animate attributeName="cx" values="82;108;82" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="40" r="1.4" fill="#A855F7" opacity="0.6">
      <animate attributeName="r" values="1.4;2;1.4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================================================
       ПРАВАЯ ЧАСТЬ: ТЕКСТ
       ================================================================ -->
  <g class="arr-text-group">

    <!-- Glow-подложка -->
    <text x="110" y="44"
          font-size="28"
          font-weight="900"
          letter-spacing="-0.4"
          fill="url(#arr-text)"
          filter="url(#arr-text-glow)"
          opacity="0.35">Далее</text>

    <!-- Основной текст -->
    <text x="110" y="44"
          font-size="28"
          font-weight="900"
          letter-spacing="-0.4"
          fill="url(#arr-text)">Далее</text>

    <!-- Верхняя линия -->
    <g class="arr-topline">
      <line x1="110" y1="14" x2="178" y2="14"
            stroke="url(#arr-text)"
            stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
      <line x1="110" y1="14" x2="126" y2="14"
            stroke="#FFFFFF" stroke-opacity="0.75"
            stroke-width="1.2" stroke-linecap="round">
        <animate attributeName="x1" values="110;168;110" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="126;184;126" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="6s" repeatCount="indefinite"/>
      </line>
      <circle cx="178" cy="14" r="1.4" fill="url(#arr-text)">
        <animate attributeName="r" values="1.4;2;1.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Пульс-точка над «а» -->
    <circle cx="158" cy="18" r="2.2" fill="url(#arr-text)">
      <animate attributeName="r" values="2.2;3;2.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="158" cy="18" r="4.4" fill="url(#arr-text)" opacity="0.3">
      <animate attributeName="r" values="4.4;6;4.4" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Подпись «К РЕШЕНИЮ» -->
    <g transform="translate(110 62)">
      <path d="M0 -7V0H4"
            stroke="url(#arr-text)"
            stroke-width="1.2" stroke-linecap="round" fill="none"
            opacity="0.7"/>

      <text x="10" y="2"
            font-size="8"
            font-weight="700"
            letter-spacing="2.4"
            fill="url(#arr-text)"
            opacity="0.7">К РЕШЕНИЮ</text>

      <circle cx="84" cy="-2" r="1.2" fill="url(#arr-text)">
        <animate attributeName="r" values="1.2;1.8;1.2" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <path d="M94 -7V0H90"
            stroke="url(#arr-text)"
            stroke-width="1.2" stroke-linecap="round" fill="none"
            opacity="0.7"/>

      <circle cx="-10" cy="-2" r="1" fill="url(#arr-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle cx="104" cy="-2" r="1" fill="url(#arr-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Тонкая линия под подписью -->
    <g transform="translate(110 72)">
      <line x1="0" y1="0" x2="104" y2="0"
            stroke="url(#arr-text)"
            stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
      <line x1="0" y1="0" x2="18" y2="0"
            stroke="#FFFFFF" stroke-opacity="0.7"
            stroke-width="1" stroke-linecap="round">
        <animate attributeName="x1" values="0;86;0" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="18;104;18" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ================================================================
       СВОБОДНЫЕ ЧАСТИЦЫ
       ================================================================ -->

  <circle class="arr-spark arr-spark--1" cx="14" cy="14" r="1.8"
          fill="url(#arr-spark-cool)" filter="url(#arr-spark-glow)">
    <animate attributeName="cx" values="14;11;14" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="14;11;14" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle class="arr-spark arr-spark--2" cx="260" cy="14" r="2"
          fill="url(#arr-spark-warm)" filter="url(#arr-spark-glow)">
    <animate attributeName="cx" values="260;262;260" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="14;11;14" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle class="arr-spark arr-spark--3" cx="252" cy="70" r="1.6"
          fill="url(#arr-spark-pink)" filter="url(#arr-spark-glow)">
    <animate attributeName="cx" values="252;250;252" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;72;70" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <circle class="arr-spark arr-spark--4" cx="220" cy="6" r="1.2"
          fill="url(#arr-spark-cool)" filter="url(#arr-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <circle class="arr-spark arr-spark--5" cx="230" cy="76" r="1.3"
          fill="url(#arr-spark-warm)" filter="url(#arr-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

</svg>