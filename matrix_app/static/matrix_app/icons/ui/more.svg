<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none"
     role="img" aria-label="Ещё"
     class="ml-icon-svg ml-icon-svg--more"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <defs>
    <radialGradient id="more-core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FBCFE8">
        <animate attributeName="stop-color"
                 values="#FBCFE8;#F9A8D4;#F472B6;#FBCFE8"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#EC4899">
        <animate attributeName="stop-color"
                 values="#EC4899;#DB2777;#BE185D;#EC4899"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#831843"/>
    </radialGradient>

    <radialGradient id="more-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.3"  stop-color="#FBCFE8" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="1"    stop-color="#DB2777" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="more-hl" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.5"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="more-body" x1="20" y1="40" x2="60" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="more-orbit" x1="0" y1="0" x2="280" y2="80"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F9A8D4"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1"   stop-color="#DB2777"/>
    </linearGradient>

    <linearGradient id="more-text" x1="110" y1="28" x2="230" y2="52"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BE185D">
        <animate attributeName="stop-color"
                 values="#BE185D;#DB2777;#EC4899;#BE185D"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#EC4899">
        <animate attributeName="stop-color"
                 values="#EC4899;#F472B6;#F9A8D4;#EC4899"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F9A8D4">
        <animate attributeName="stop-color"
                 values="#F9A8D4;#EC4899;#BE185D;#F9A8D4"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="more-line" x1="82" y1="40" x2="108" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="more-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1"   stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="more-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#A5F3FC"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="more-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <filter id="more-spark-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <filter id="more-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="more-text-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="more-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <circle cx="140" cy="40" r="130" fill="url(#more-glow)" opacity="0.08">
    <animate attributeName="r" values="130;135;130" dur="9s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(0 0)">

    <circle cx="40" cy="40" r="32" fill="url(#more-glow)" opacity="0.5">
      <animate attributeName="r" values="32;35;32" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="5.4s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(40 40)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0"
                          dur="26s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="url(#more-orbit)"
                 stroke-width="1.5" opacity="0.85"
                 transform="rotate(-28)"/>
        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="#EC4899" stroke-width="3"
                 opacity="0.15" filter="url(#more-orbit-glow)"
                 transform="rotate(-28)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 0 0" to="360 0 0"
                            dur="26s" repeatCount="indefinite"/>
          <circle cx="26" cy="0" r="2.2"
                  fill="url(#more-spark-pink)" filter="url(#more-spark-glow)">
            <animate attributeName="r" values="2.2;2.8;2.2"
                     dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="26" cy="0" r="1" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <g filter="url(#more-core-shadow)">
      <circle cx="40" cy="40" r="18" fill="url(#more-core)"/>
      <circle cx="40" cy="40" r="18" fill="url(#more-hl)"/>
      <circle cx="40" cy="40" r="17.5" fill="none"
              stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>
    </g>

    <!-- Три точки -->
    <g>
      <circle cx="26" cy="40" r="3.6" fill="url(#more-body)"/>
      <circle cx="40" cy="40" r="3.6" fill="url(#more-body)"/>
      <circle cx="54" cy="40" r="3.6" fill="url(#more-body)"/>

      <circle cx="26" cy="39" r="1.2" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="40" cy="39" r="1.2" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="54" cy="39" r="1.2" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <circle cx="40" cy="40" r="2.4" fill="url(#more-glow)" opacity="0.8">
      <animate attributeName="r" values="2.4;3;2.4" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="32" cy="46" r="0.9" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="34" r="0.8" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <path d="M82 40 L108 40"
          stroke="url(#more-line)" stroke-width="1.2"
          stroke-linecap="round" stroke-dasharray="2 4">
      <animate attributeName="stroke-dashoffset"
               values="0;-12;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="82" cy="40" r="1.6" fill="#EC4899">
      <animate attributeName="cx" values="82;108;82" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="40" r="1.4" fill="#F472B6" opacity="0.6">
      <animate attributeName="r" values="1.4;2;1.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <text x="110" y="44" font-size="28" font-weight="900"
          letter-spacing="-0.4" fill="url(#more-text)"
          filter="url(#more-text-glow)" opacity="0.35">Ещё</text>

    <text x="110" y="44" font-size="28" font-weight="900"
          letter-spacing="-0.4" fill="url(#more-text)">Ещё</text>

    <g>
      <line x1="110" y1="14" x2="160" y2="14"
            stroke="url(#more-text)" stroke-width="0.8"
            stroke-linecap="round" opacity="0.5"/>
      <line x1="110" y1="14" x2="126" y2="14"
            stroke="#FFFFFF" stroke-opacity="0.75"
            stroke-width="1.2" stroke-linecap="round">
        <animate attributeName="x1" values="110;150;110" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="126;166;126" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="6s" repeatCount="indefinite"/>
      </line>
      <circle cx="160" cy="14" r="1.4" fill="url(#more-text)">
        <animate attributeName="r" values="1.4;2;1.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="150" cy="18" r="2.2" fill="url(#more-text)">
      <animate attributeName="r" values="2.2;3;2.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="18" r="4.4" fill="url(#more-text)" opacity="0.3">
      <animate attributeName="r" values="4.4;6;4.4" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(110 62)">
      <path d="M0 -7V0H4"
            stroke="url(#more-text)" stroke-width="1.2"
            stroke-linecap="round" fill="none" opacity="0.7"/>
      <text x="10" y="2" font-size="8" font-weight="700"
            letter-spacing="2.4" fill="url(#more-text)"
            opacity="0.7">ДОПОЛНИТЕЛЬНО</text>
      <circle cx="120" cy="-2" r="1.2" fill="url(#more-text)">
        <animate attributeName="r" values="1.2;1.8;1.2" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M130 -7V0H126"
            stroke="url(#more-text)" stroke-width="1.2"
            stroke-linecap="round" fill="none" opacity="0.7"/>
      <circle cx="-10" cy="-2" r="1" fill="url(#more-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="140" cy="-2" r="1" fill="url(#more-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(110 72)">
      <line x1="0" y1="0" x2="140" y2="0"
            stroke="url(#more-text)" stroke-width="0.6"
            stroke-linecap="round" opacity="0.4"/>
      <line x1="0" y1="0" x2="18" y2="0"
            stroke="#FFFFFF" stroke-opacity="0.7"
            stroke-width="1" stroke-linecap="round">
        <animate attributeName="x1" values="0;122;0" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="18;140;18" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <circle cx="14" cy="12" r="1.8" fill="url(#more-spark-cool)" filter="url(#more-spark-glow)">
    <animate attributeName="cx" values="14;11;14" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;9;12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="14" r="2" fill="url(#more-spark-warm)" filter="url(#more-spark-glow)">
    <animate attributeName="cx" values="260;262;260" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="252" cy="70" r="1.6" fill="url(#more-spark-pink)" filter="url(#more-spark-glow)">
    <animate attributeName="cy" values="70;72;70" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>