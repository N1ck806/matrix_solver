<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none"
     role="img" aria-label="Закрыть"
     class="ml-icon-svg ml-icon-svg--close"
     preserveAspectRatio="xMidYMid meet"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- ============================================================
       ОПРЕДЕЛЕНИЯ
       ============================================================ -->
  <defs>

    <!-- ЯДРО КРЕСТИКА — дышит -->
    <radialGradient id="close-core" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#F5D0FE">
        <animate attributeName="stop-color"
                 values="#F5D0FE;#F0ABFC;#E9D5FF;#F5D0FE"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.4" stop-color="#D946EF">
        <animate attributeName="stop-color"
                 values="#D946EF;#A855F7;#C084FC;#D946EF"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.75" stop-color="#A855F7">
        <animate attributeName="stop-color"
                 values="#A855F7;#7C3AED;#9333EA;#A855F7"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#5B21B6"/>
    </radialGradient>

    <!-- СВЕЧЕНИЕ -->
    <radialGradient id="close-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.24" stop-color="#FCE7F3" stop-opacity="0.7"/>
      <stop offset="0.5"  stop-color="#F5D0FE" stop-opacity="0.4"/>
      <stop offset="0.78" stop-color="#D946EF" stop-opacity="0.15"/>
      <stop offset="1"    stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- БЛИК -->
    <radialGradient id="close-hl" cx="0.3" cy="0.2" r="0.7">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.4"  stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- ОРБИТА РОЗОВАЯ -->
    <linearGradient id="close-orbit-pink" x1="0" y1="0" x2="280" y2="80"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#F0ABFC"/>
      <stop offset="0.5" stop-color="#EC4899"/>
      <stop offset="1"   stop-color="#D946EF"/>
    </linearGradient>

    <!-- ОРБИТА ГОЛУБАЯ -->
    <linearGradient id="close-orbit-cyan" x1="0" y1="80" x2="280" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1"   stop-color="#06B6D4"/>
    </linearGradient>

    <!-- КРЕСТ (обводка) -->
    <linearGradient id="close-cross" x1="20" y1="20" x2="60" y2="60"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#D946EF"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>

    <!-- ТЕКСТ -->
    <linearGradient id="close-text" x1="110" y1="28" x2="230" y2="52"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3AED">
        <animate attributeName="stop-color"
                 values="#7C3AED;#A855F7;#D946EF;#7C3AED"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#A855F7">
        <animate attributeName="stop-color"
                 values="#A855F7;#D946EF;#EC4899;#A855F7"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#EC4899">
        <animate attributeName="stop-color"
                 values="#EC4899;#A855F7;#7C3AED;#EC4899"
                 dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- ЛИНИИ -->
    <linearGradient id="close-line" x1="82" y1="40" x2="108" y2="40"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EC4899" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- ЧАСТИЦЫ -->
    <radialGradient id="close-spark-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBBF24"/>
      <stop offset="1"   stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="close-spark-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#22D3EE"/>
      <stop offset="1"   stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="close-spark-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FBCFE8"/>
      <stop offset="1"   stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>

    <!-- ФИЛЬТРЫ -->
    <filter id="close-spark-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <filter id="close-core-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="close-text-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <filter id="close-orbit-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
  </defs>

  <!-- ================================================================
       ФОН СЦЕНЫ
       ================================================================ -->
  <circle class="close-scene-halo"
          cx="140" cy="40" r="130"
          fill="url(#close-glow)" opacity="0.1">
    <animate attributeName="r" values="130;135;130" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.05;0.1" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ================================================================
       ЛЕВАЯ ЧАСТЬ: КРЕСТИК (0–80)
       ================================================================ -->
  <g transform="translate(0 0)">

    <!-- Свечение под крестиком -->
    <circle class="close-core-halo"
            cx="40" cy="40" r="32"
            fill="url(#close-glow)" opacity="0.5">
      <animate attributeName="r" values="32;35;32" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.3;0.5" dur="5.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Розовая орбита -->
    <g class="close-orbit close-orbit--pink" transform="translate(40 40)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0"
                          dur="24s" repeatCount="indefinite"/>

        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="url(#close-orbit-pink)"
                 stroke-width="1.5" opacity="0.85"
                 transform="rotate(-28)"/>

        <ellipse cx="0" cy="0" rx="26" ry="8"
                 fill="none" stroke="#EC4899" stroke-width="3"
                 opacity="0.15" filter="url(#close-orbit-glow)"
                 transform="rotate(-28)"/>

        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0 0 0" to="360 0 0"
                            dur="24s" repeatCount="indefinite"/>
          <circle class="close-orbit-dot" cx="26" cy="0" r="2.2"
                  fill="url(#close-spark-pink)" filter="url(#close-spark-glow)">
            <animate attributeName="r" values="2.2;2.8;2.2"
                     dur="2.4s" repeatCount="indefinite"/>
          </circle>
          <circle cx="26" cy="0" r="1" fill="#FFFFFF"/>
        </g>
      </g>
    </g>

    <!-- Голубая орбита (контраст) -->
    <g class="close-orbit close-orbit--cyan" transform="translate(40 40)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="360 0 0" to="0 0 0"
                          dur="32s" repeatCount="indefinite"/>

        <ellipse cx="0" cy="0" rx="20" ry="6"
                 fill="none" stroke="url(#close-orbit-cyan)"
                 stroke-width="1" opacity="0.55"
                 transform="rotate(35)"/>

        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="360 0 0" to="0 0 0"
                            dur="32s" repeatCount="indefinite"/>
          <circle class="close-orbit-dot-2" cx="-20" cy="0" r="1.6"
                  fill="url(#close-spark-cool)" filter="url(#close-spark-glow)"/>
        </g>
      </g>
    </g>

    <!-- Ядро (фон крестика) -->
    <g class="close-core" filter="url(#close-core-shadow)">
      <circle cx="40" cy="40" r="18" fill="url(#close-core)"/>
      <circle cx="40" cy="40" r="18" fill="url(#close-hl)"/>
      <circle cx="40" cy="40" r="17.5" fill="none"
              stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>

      <!-- Центральный мягкий свет -->
      <circle cx="40" cy="40" r="10" fill="url(#close-glow)" opacity="0.55">
        <animate attributeName="r" values="10;11.5;10" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.3;0.55" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Крестик — две линии -->
    <g class="close-cross">
      <line class="close-cross-line close-cross-line--1"
            x1="26" y1="26" x2="54" y2="54"
            stroke="url(#close-cross)"
            stroke-width="3"
            stroke-linecap="round"/>
      <line class="close-cross-line close-cross-line--2"
            x1="54" y1="26" x2="26" y2="54"
            stroke="url(#close-cross)"
            stroke-width="3"
            stroke-linecap="round"/>

      <!-- Подсветка линий -->
      <line x1="26" y1="26" x2="54" y2="54"
            stroke="#FFFFFF" stroke-opacity="0.28"
            stroke-width="0.9" stroke-linecap="round"/>
      <line x1="54" y1="26" x2="26" y2="54"
            stroke="#FFFFFF" stroke-opacity="0.28"
            stroke-width="0.9" stroke-linecap="round"/>
    </g>

    <!-- Ядро-точка в центре -->
    <g class="close-center">
      <circle class="close-center-halo"
              cx="40" cy="40" r="7" fill="url(#close-glow)" opacity="0.85">
        <animate attributeName="r" values="7;8.5;7" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle class="close-center-core"
              cx="40" cy="40" r="2.6" fill="#FFFFFF">
        <animate attributeName="r" values="2.6;3.2;2.6" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle class="close-center-point"
              cx="40" cy="40" r="1.1" fill="#FFFFFF"/>
    </g>

    <!-- Микро-искры на ядре -->
    <circle cx="32" cy="46" r="0.9" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="34" r="0.8" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="48" r="1" fill="#FFFFFF">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================================================
       СОЕДИНИТЕЛЬНАЯ ЛИНИЯ
       ================================================================ -->
  <g class="close-connector">
    <path d="M82 40 L108 40"
          stroke="url(#close-line)"
          stroke-width="1.2" stroke-linecap="round"
          stroke-dasharray="2 4">
      <animate attributeName="stroke-dashoffset"
               values="0;-12;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="82" cy="40" r="1.6" fill="#EC4899">
      <animate attributeName="cx" values="82;108;82" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="40" r="1.4" fill="#A855F7" opacity="0.6">
      <animate attributeName="r" values="1.4;2;1.4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================================================================
       ПРАВАЯ ЧАСТЬ: ТЕКСТ
       ================================================================ -->
  <g class="close-text-group">

    <!-- Glow-подложка -->
    <text x="110" y="44"
          font-size="28"
          font-weight="900"
          letter-spacing="-0.4"
          fill="url(#close-text)"
          filter="url(#close-text-glow)"
          opacity="0.35">Закрыть</text>

    <!-- Основной текст -->
    <text x="110" y="44"
          font-size="28"
          font-weight="900"
          letter-spacing="-0.4"
          fill="url(#close-text)">Закрыть</text>

    <!-- Верхняя линия над текстом -->
    <g class="close-topline">
      <line x1="110" y1="14" x2="196" y2="14"
            stroke="url(#close-text)"
            stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
      <line x1="110" y1="14" x2="126" y2="14"
            stroke="#FFFFFF" stroke-opacity="0.75"
            stroke-width="1.2" stroke-linecap="round">
        <animate attributeName="x1" values="110;186;110" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="126;202;126" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.95;0" dur="6s" repeatCount="indefinite"/>
      </line>
      <circle cx="196" cy="14" r="1.4" fill="url(#close-text)">
        <animate attributeName="r" values="1.4;2;1.4" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Пульсирующая точка над «а» -->
    <circle cx="170" cy="18" r="2.2" fill="url(#close-text)">
      <animate attributeName="r" values="2.2;3;2.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="18" r="4.4" fill="url(#close-text)" opacity="0.3">
      <animate attributeName="r" values="4.4;6;4.4" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Подпись «ОТМЕНИТЬ ДЕЙСТВИЕ» -->
    <g transform="translate(110 62)">
      <path d="M0 -7V0H4"
            stroke="url(#close-text)"
            stroke-width="1.2" stroke-linecap="round" fill="none"
            opacity="0.7"/>

      <text x="10" y="2"
            font-size="8"
            font-weight="700"
            letter-spacing="2.4"
            fill="url(#close-text)"
            opacity="0.7">ОТМЕНИТЬ ДЕЙСТВИЕ</text>

      <circle cx="142" cy="-2" r="1.2" fill="url(#close-text)">
        <animate attributeName="r" values="1.2;1.8;1.2" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>

      <path d="M152 -7V0H148"
            stroke="url(#close-text)"
            stroke-width="1.2" stroke-linecap="round" fill="none"
            opacity="0.7"/>

      <circle cx="-10" cy="-2" r="1" fill="url(#close-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      </circle>

      <circle cx="162" cy="-2" r="1" fill="url(#close-text)" opacity="0.5">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Тонкая линия под подписью -->
    <g transform="translate(110 72)">
      <line x1="0" y1="0" x2="162" y2="0"
            stroke="url(#close-text)"
            stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
      <line x1="0" y1="0" x2="18" y2="0"
            stroke="#FFFFFF" stroke-opacity="0.7"
            stroke-width="1" stroke-linecap="round">
        <animate attributeName="x1" values="0;144;0" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="18;162;18" dur="7s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- ================================================================
       СВОБОДНЫЕ ЧАСТИЦЫ
       ================================================================ -->

  <circle class="close-spark close-spark--1" cx="14" cy="12" r="1.8"
          fill="url(#close-spark-cool)" filter="url(#close-spark-glow)">
    <animate attributeName="cx" values="14;11;14" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;9;12" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle class="close-spark close-spark--2" cx="260" cy="14" r="2"
          fill="url(#close-spark-warm)" filter="url(#close-spark-glow)">
    <animate attributeName="cx" values="260;262;260" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="14;11;14" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.55;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle class="close-spark close-spark--3" cx="252" cy="70" r="1.6"
          fill="url(#close-spark-pink)" filter="url(#close-spark-glow)">
    <animate attributeName="cx" values="252;250;252" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="70;72;70" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <circle class="close-spark close-spark--4" cx="220" cy="6" r="1.2"
          fill="url(#close-spark-cool)" filter="url(#close-spark-glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <circle class="close-spark close-spark--5" cx="230" cy="76" r="1.3"
          fill="url(#close-spark-warm)" filter="url(#close-spark-glow)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

</svg>