<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round"
     role="img"
     aria-hidden="true">

    <!-- Центральный ромб -->
    <rect x="8" y="8" width="8" height="8" rx="1.5"
          transform="rotate(45 12 12)"/>

    <!-- Угловые «модули» -->
    <rect x="1.5" y="1.5" width="4" height="4" rx="1"
          transform="rotate(45 3.5 3.5)"/>
    <rect x="18.5" y="1.5" width="4" height="4" rx="1"
          transform="rotate(45 20.5 3.5)"/>
    <rect x="1.5" y="18.5" width="4" height="4" rx="1"
          transform="rotate(45 3.5 20.5)"/>
    <rect x="18.5" y="18.5" width="4" height="4" rx="1"
          transform="rotate(45 20.5 20.5)"/>

    <!-- Соединительные линии -->
    <line x1="5.5" y1="5.5" x2="8.5" y2="8.5"/>
    <line x1="18.5" y1="5.5" x2="15.5" y2="8.5"/>
    <line x1="5.5" y1="18.5" x2="8.5" y2="15.5"/>
    <line x1="18.5" y1="18.5" x2="15.5" y2="15.5"/>
</svg>
