<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Инженерная школа">
    <defs>
        <radialGradient id="eng-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#C7C9FF"/>
            <stop offset="0.5" stop-color="#6366F1"/>
            <stop offset="1" stop-color="#0891B2"/>
        </radialGradient>
        <linearGradient id="eng-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="eng-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#E0E7FF"/>
        </linearGradient>
        <filter id="eng-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#eng-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#eng-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(-25 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(35 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="90" ry="40"
                 transform="rotate(80 140 140)" stroke-width="1"/>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#eng-core)" filter="url(#eng-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Шестерёнка -->
    <g transform="translate(140 140)">
        <!-- зубья -->
        <g fill="#FFFFFF" opacity="0.9">
            <rect x="-3" y="-30" width="6" height="10" rx="1.5"/>
            <rect x="-3" y="20" width="6" height="10" rx="1.5"/>
            <rect x="-30" y="-3" width="10" height="6" rx="1.5"/>
            <rect x="20" y="-3" width="10" height="6" rx="1.5"/>
            <rect x="-3" y="-30" width="6" height="10" rx="1.5"
                  transform="rotate(45)"/>
            <rect x="-3" y="-30" width="6" height="10" rx="1.5"
                  transform="rotate(135)"/>
            <rect x="-3" y="-30" width="6" height="10" rx="1.5"
                  transform="rotate(225)"/>
            <rect x="-3" y="-30" width="6" height="10" rx="1.5"
                  transform="rotate(315)"/>
        </g>
        <circle r="20" fill="none" stroke="#FFFFFF" stroke-width="2"/>
        <circle r="8" fill="#FFFFFF"/>
        <circle r="3" fill="#6366F1"/>
    </g>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#22D3EE" opacity="0.85"/>
    <circle cx="218" cy="160" r="3" fill="#6366F1" opacity="0.85"/>
</svg>