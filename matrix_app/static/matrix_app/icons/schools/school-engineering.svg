<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Инженерная школа">
    <defs>
        <radialGradient id="eng-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#DDD6FE"/>
            <stop offset="0.5" stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#4C1D95"/>
        </radialGradient>
        <linearGradient id="eng-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="eng-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#EDE9FE"/>
        </linearGradient>
        <filter id="eng-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#eng-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#eng-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(-25 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="-25 140 140" to="335 140 140"
                              dur="40s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(35 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="35 140 140" to="395 140 140"
                              dur="55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="90" ry="40" transform="rotate(80 140 140)" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate"
                              from="80 140 140" to="440 140 140"
                              dur="70s" repeatCount="indefinite"/>
        </ellipse>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#eng-core)" filter="url(#eng-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Шестерёнка внутри ядра (вращается) -->
    <g fill="url(#eng-cell)">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 140 140" to="360 140 140"
                          dur="30s" repeatCount="indefinite"/>
        <!-- 8 зубьев -->
        <rect x="134" y="102" width="12" height="14" rx="2"/>
        <rect x="134" y="164" width="12" height="14" rx="2"/>
        <rect x="102" y="134" width="14" height="12" rx="2"/>
        <rect x="164" y="134" width="14" height="12" rx="2"/>
        <rect x="112" y="112" width="12" height="12" rx="2" transform="rotate(45 118 118)"/>
        <rect x="156" y="112" width="12" height="12" rx="2" transform="rotate(45 162 118)"/>
        <rect x="112" y="156" width="12" height="12" rx="2" transform="rotate(45 118 162)"/>
        <rect x="156" y="156" width="12" height="12" rx="2" transform="rotate(45 162 162)"/>
    </g>
    <!-- Кольцо шестерёнки -->
    <circle cx="140" cy="140" r="26" fill="url(#eng-cell)"/>
    <circle cx="140" cy="140" r="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1"/>
    <!-- Центр -->
    <circle cx="140" cy="140" r="12" fill="url(#eng-core)"/>
    <circle cx="140" cy="140" r="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1"/>
    <circle cx="140" cy="140" r="5" fill="#FFFFFF" opacity="0.9"/>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#22D3EE" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="218" cy="160" r="3" fill="#A78BFA" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
</svg>