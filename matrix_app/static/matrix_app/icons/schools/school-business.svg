<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа бизнеса и финансов">
    <defs>
        <radialGradient id="biz-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#B8F4DC"/>
            <stop offset="0.5" stop-color="#10B981"/>
            <stop offset="1" stop-color="#0891B2"/>
        </radialGradient>
        <linearGradient id="biz-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#10B981"/>
            <stop offset="1" stop-color="#22D3EE"/>
        </linearGradient>
        <linearGradient id="biz-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#DFF9F0"/>
        </linearGradient>
        <filter id="biz-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#biz-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#biz-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(-25 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(35 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="90" ry="40"
                 transform="rotate(80 140 140)" stroke-width="1"/>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#biz-core)" filter="url(#biz-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Столбиковая диаграмма внутри ядра -->
    <g>
        <rect x="122" y="152" width="8" height="18" rx="1.5" fill="url(#biz-cell)"/>
        <rect x="134" y="144" width="8" height="26" rx="1.5" fill="url(#biz-cell)" opacity="0.9"/>
        <rect x="146" y="132" width="8" height="38" rx="1.5" fill="url(#biz-cell)"/>
        <rect x="158" y="138" width="8" height="32" rx="1.5" fill="url(#biz-cell)" opacity="0.9"/>
    </g>

    <!-- Верхняя точка-стрелка -->
    <path d="M120 138 L138 124 L150 130 L164 114"
          stroke="#FFFFFF" stroke-width="2" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="164" cy="114" r="3.5" fill="#FFFFFF"/>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#22D3EE" opacity="0.85"/>
    <circle cx="218" cy="160" r="3" fill="#10B981" opacity="0.85"/>
</svg>