<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа искусств">
    <defs>
        <radialGradient id="art-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#FFD5EC"/>
            <stop offset="0.5" stop-color="#EC4899"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </radialGradient>
        <linearGradient id="art-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#EC4899"/>
            <stop offset="1" stop-color="#8B5CF6"/>
        </linearGradient>
        <linearGradient id="art-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#FCE7F3"/>
        </linearGradient>
        <filter id="art-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#art-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#art-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(-25 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="-25 140 140" to="335 140 140"
                              dur="40s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(35 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="35 140 140" to="395 140 140"
                              dur="55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="90" ry="40"
                 transform="rotate(80 140 140)" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate"
                              from="80 140 140" to="440 140 140"
                              dur="70s" repeatCount="indefinite"/>
        </ellipse>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#art-core)" filter="url(#art-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Палитра -->
    <path d="M140 108 C 118 108 108 122 108 138 C 108 154 118 162 130 162 L 134 162 C 138 162 138 168 134 170 C 128 174 130 182 140 182 C 158 182 172 168 172 146 C 172 122 158 108 140 108 Z"
          fill="#FFFFFF" opacity="0.95"/>
    <circle cx="128" cy="128" r="5" fill="#EC4899"/>
    <circle cx="148" cy="128" r="5" fill="#8B5CF6"/>
    <circle cx="122" cy="146" r="5" fill="#22D3EE"/>
    <circle cx="152" cy="148" r="5" fill="#F59E0B"/>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#EC4899" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.35;0.85"
                 dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="218" cy="160" r="3" fill="#8B5CF6" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.35;0.85"
                 dur="4s" repeatCount="indefinite"/>
    </circle>
</svg>