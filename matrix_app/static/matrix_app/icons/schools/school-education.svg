<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа образования">
    <defs>
        <radialGradient id="edu-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#C7B6FF"/>
            <stop offset="0.5" stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#6366F1"/>
        </radialGradient>
        <linearGradient id="edu-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366F1"/>
            <stop offset="1" stop-color="#D946EF"/>
        </linearGradient>
        <linearGradient id="edu-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#E8E4FF"/>
        </linearGradient>
        <filter id="edu-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <!-- Внешнее свечение -->
    <circle cx="140" cy="140" r="95" fill="url(#edu-core)" opacity="0.15"/>

    <!-- Орбиты -->
    <g fill="none" stroke="url(#edu-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(-25 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(35 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="90" ry="40"
                 transform="rotate(80 140 140)" stroke-width="1"/>
    </g>

    <!-- Центральное ядро -->
    <circle cx="140" cy="140" r="52" fill="url(#edu-core)" filter="url(#edu-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Матрица 3×3 внутри ядра -->
    <g>
        <rect x="122" y="122" width="10" height="10" rx="2" fill="url(#edu-cell)"/>
        <rect x="136" y="122" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.85"/>
        <rect x="150" y="122" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.7"/>
        <rect x="122" y="136" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.85"/>
        <rect x="136" y="136" width="10" height="10" rx="2" fill="url(#edu-cell)"/>
        <rect x="150" y="136" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.85"/>
        <rect x="122" y="150" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.7"/>
        <rect x="136" y="150" width="10" height="10" rx="2" fill="url(#edu-cell)" opacity="0.85"/>
        <rect x="150" y="150" width="10" height="10" rx="2" fill="url(#edu-cell)"/>
    </g>

    <!-- Частицы -->
    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
        <circle cx="140" cy="32" r="1.6" opacity="0.6"/>
        <circle cx="140" cy="252" r="1.6" opacity="0.6"/>
    </g>

    <!-- Точки на орбитах -->
    <circle cx="62" cy="120" r="3.5" fill="#D946EF" opacity="0.85"/>
    <circle cx="218" cy="160" r="3" fill="#6366F1" opacity="0.85"/>
</svg>