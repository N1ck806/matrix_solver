<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа образования">
    <defs>
        <radialGradient id="edu-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#BFDBFE"/>
            <stop offset="0.5" stop-color="#3B82F6"/>
            <stop offset="1" stop-color="#1E3A8A"/>
        </radialGradient>
        <linearGradient id="edu-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#3B82F6"/>
            <stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
        <linearGradient id="edu-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#DBEAFE"/>
        </linearGradient>
        <filter id="edu-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#edu-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#edu-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(-25 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="-25 140 140" to="335 140 140"
                              dur="40s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(35 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="35 140 140" to="395 140 140"
                              dur="55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="90" ry="40" transform="rotate(80 140 140)" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate"
                              from="80 140 140" to="440 140 140"
                              dur="70s" repeatCount="indefinite"/>
        </ellipse>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#edu-core)" filter="url(#edu-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Книга внутри ядра -->
    <g>
        <path d="M116 152 L140 140 L164 152 L140 164 Z" fill="url(#edu-cell)"/>
        <path d="M116 152 L140 164 L140 172 L116 160 Z" fill="url(#edu-cell)" opacity="0.75"/>
        <path d="M164 152 L140 164 L140 172 L164 160 Z" fill="url(#edu-cell)" opacity="0.9"/>
        <path d="M164 152 L164 162" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="164" cy="164" r="2" fill="#FFFFFF"/>
    </g>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#06B6D4" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="218" cy="160" r="3" fill="#60A5FA" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
</svg>