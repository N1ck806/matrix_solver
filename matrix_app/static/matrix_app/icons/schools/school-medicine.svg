<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа медицины">
    <defs>
        <radialGradient id="med-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#FECDD3"/>
            <stop offset="0.5" stop-color="#F43F5E"/>
            <stop offset="1" stop-color="#9F1239"/>
        </radialGradient>
        <linearGradient id="med-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F43F5E"/>
            <stop offset="1" stop-color="#FB7185"/>
        </linearGradient>
        <linearGradient id="med-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#FFE4E6"/>
        </linearGradient>
        <filter id="med-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#med-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#med-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(-25 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="-25 140 140" to="335 140 140"
                              dur="40s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="105" ry="48" transform="rotate(35 140 140)" stroke-width="1.4">
            <animateTransform attributeName="transform" type="rotate"
                              from="35 140 140" to="395 140 140"
                              dur="55s" repeatCount="indefinite"/>
        </ellipse>
        <ellipse cx="140" cy="140" rx="90" ry="40" transform="rotate(80 140 140)" stroke-width="1">
            <animateTransform attributeName="transform" type="rotate"
                              from="80 140 140" to="440 140 140"
                              dur="70s" repeatCount="indefinite"/>
        </ellipse>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#med-core)" filter="url(#med-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Крест внутри ядра -->
    <g>
        <rect x="133" y="118" width="14" height="44" rx="3" fill="url(#med-cell)"/>
        <rect x="118" y="133" width="44" height="14" rx="3" fill="url(#med-cell)"/>
    </g>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#FB7185" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="218" cy="160" r="3" fill="#F472B6" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.4;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
</svg>