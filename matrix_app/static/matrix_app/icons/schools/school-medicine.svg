<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none" role="img" aria-label="Школа медицины">
    <defs>
        <radialGradient id="med-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                        gradientTransform="translate(140 140) scale(90)">
            <stop stop-color="#B8EEF7"/>
            <stop offset="0.5" stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#0891B2"/>
        </radialGradient>
        <linearGradient id="med-orbit" x1="40" y1="40" x2="240" y2="240" gradientUnits="userSpaceOnUse">
            <stop stop-color="#22D3EE"/>
            <stop offset="1" stop-color="#10B981"/>
        </linearGradient>
        <linearGradient id="med-cell" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#FFFFFF"/>
            <stop offset="1" stop-color="#DFF6FB"/>
        </linearGradient>
        <filter id="med-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <circle cx="140" cy="140" r="95" fill="url(#med-core)" opacity="0.15"/>

    <g fill="none" stroke="url(#med-orbit)" opacity="0.5">
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(-25 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="105" ry="48"
                 transform="rotate(35 140 140)" stroke-width="1.4"/>
        <ellipse cx="140" cy="140" rx="90" ry="40"
                 transform="rotate(80 140 140)" stroke-width="1"/>
    </g>

    <circle cx="140" cy="140" r="52" fill="url(#med-core)" filter="url(#med-glow)"/>
    <circle cx="140" cy="140" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Медицинский крест -->
    <g>
        <rect x="132" y="116" width="16" height="48" rx="3" fill="#FFFFFF"/>
        <rect x="116" y="132" width="48" height="16" rx="3" fill="#FFFFFF"/>
    </g>

    <!-- Пульс -->
    <path d="M100 140 L118 140 L124 130 L130 152 L136 138 L142 148 L148 140 L180 140"
          stroke="#FFFFFF" stroke-width="2.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <g fill="#FFFFFF">
        <circle cx="60" cy="80" r="2.4" opacity="0.85"/>
        <circle cx="230" cy="70" r="1.8" opacity="0.7"/>
        <circle cx="215" cy="215" r="2.2" opacity="0.8"/>
        <circle cx="70" cy="210" r="1.6" opacity="0.65"/>
    </g>

    <circle cx="62" cy="120" r="3.5" fill="#10B981" opacity="0.85"/>
    <circle cx="218" cy="160" r="3" fill="#22D3EE" opacity="0.85"/>
</svg>